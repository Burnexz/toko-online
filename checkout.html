<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Zokent Store</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 text-slate-800">

<header class="bg-red-600 text-white p-4 sticky top-0 z-50">

  <div class="max-w-2xl mx-auto flex items-center gap-3">

    <button
      onclick="history.back()"
      class="text-2xl"
    >
      ←
    </button>

    <div>
      <h1 class="font-bold text-lg">
        Checkout
      </h1>

      <p class="text-xs opacity-90">
        Selesaikan pesanan kamu
      </p>
    </div>

  </div>

</header>


<main class="max-w-2xl mx-auto p-4">


  <!-- ================= PRODUK ================= -->

  <section class="bg-white rounded-2xl p-4 shadow-sm mb-4">

    <h2 class="font-bold mb-3">
      🛒 Pesanan Kamu
    </h2>

    <div id="cartItems"></div>

    <div class="border-t mt-4 pt-4 flex justify-between">

      <span class="font-semibold">
        Total
      </span>

      <span
        id="totalPrice"
        class="font-extrabold text-red-600"
      >
        Rp 0
      </span>

    </div>

  </section>


  <!-- ================= DATA PEMBELI ================= -->

  <section class="bg-white rounded-2xl p-4 shadow-sm">

    <h2 class="font-bold mb-4">
      👤 Data Pemesan
    </h2>


    <label class="block text-sm font-semibold mb-1">
      Nama
    </label>

    <input
      id="customerName"
      type="text"
      placeholder="Nama kamu"
      class="w-full border rounded-xl p-3 mb-4"
    >


    <label class="block text-sm font-semibold mb-1">
      Nomor WhatsApp
    </label>

    <input
      id="customerPhone"
      type="tel"
      placeholder="083863000922"
      class="w-full border rounded-xl p-3 mb-4"
    >


    <label class="block text-sm font-semibold mb-1">
      Alamat
    </label>

    <textarea
      id="customerAddress"
      placeholder="Alamat lengkap"
      class="w-full border rounded-xl p-3 mb-4"
      rows="3"
    ></textarea>


    <label class="block text-sm font-semibold mb-1">
      Catatan
    </label>

    <textarea
      id="notes"
      placeholder="Catatan pesanan (opsional)"
      class="w-full border rounded-xl p-3 mb-5"
      rows="2"
    ></textarea>


    <div
      id="message"
      class="hidden mb-4 p-3 rounded-xl text-sm"
    ></div>


    <button
      id="checkoutButton"
      onclick="submitOrder()"
      class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition text-white font-bold py-3 rounded-xl"
    >
      Buat Pesanan
    </button>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://weuousmvkxmgmsnwiuad.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


// ======================================
// KERANJANG
// ======================================

let cart =
  JSON.parse(localStorage.getItem("zokent_cart") || "[]");


function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(number);

}


// ======================================
// TAMPILKAN KERANJANG
// ======================================

function renderCart() {

  const container =
    document.getElementById("cartItems");

  const totalElement =
    document.getElementById("totalPrice");


  if (!cart.length) {

    container.innerHTML = `
      <div class="text-center py-8 text-slate-500">
        Keranjang masih kosong.
      </div>
    `;

    totalElement.textContent = "Rp 0";

    document.getElementById(
      "checkoutButton"
    ).disabled = true;

    return;
  }


  let total = 0;


  container.innerHTML =
    cart.map(item => {

      const subtotal =
        Number(item.price) *
        Number(item.quantity);

      total += subtotal;


      return `
        <div class="flex justify-between items-center py-3 border-b">

          <div>

            <p class="font-semibold text-sm">
              ${item.name}
            </p>

            <p class="text-xs text-slate-500">
              ${item.quantity} ×
              ${formatRupiah(item.price)}
            </p>

          </div>

          <p class="font-bold text-sm">
            ${formatRupiah(subtotal)}
          </p>

        </div>
      `;

    }).join("");


  totalElement.textContent =
    formatRupiah(total);

}


// ======================================
// CHECKOUT
// ======================================

async function submitOrder() {

  if (!cart.length) {

    showMessage(
      "Keranjang masih kosong.",
      true
    );

    return;
  }


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();


  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();


  const notes =
    document.getElementById(
      "notes"
    ).value.trim();


  if (!name) {

    showMessage(
      "Nama wajib diisi.",
      true
    );

    return;
  }


  if (!phone) {

    showMessage(
      "Nomor WhatsApp wajib diisi.",
      true
    );

    return;
  }


  if (!address) {

    showMessage(
      "Alamat wajib diisi.",
      true
    );

    return;
  }


  const button =
    document.getElementById(
      "checkoutButton"
    );


  button.disabled = true;

  button.textContent =
    "Memproses pesanan...";


  try {

    const items =
      cart.map(item => ({
        product_id: item.id,
        quantity: Number(item.quantity)
      }));


    const { data, error } =
      await supabaseClient.rpc(
        "create_order",
        {
          p_customer_name: name,
          p_customer_phone: phone,
          p_customer_address: address,
          p_notes: notes || null,
          p_items: items
        }
      );


    if (error) {
      throw error;
    }


    // Pesanan berhasil

    localStorage.removeItem(
      "zokent_cart"
    );


    showMessage(
      "Pesanan berhasil dibuat!",
      false
    );


    button.textContent =
      "Pesanan Berhasil ✓";


    setTimeout(() => {

      window.location.href =
        "index.html";

    }, 1500);


  } catch (error) {

    console.error(error);


    showMessage(
      error.message ||
      "Pesanan gagal dibuat.",
      true
    );


    button.disabled = false;

    button.textContent =
      "Buat Pesanan";

  }

}


// ======================================
// PESAN
// ======================================

function showMessage(
  text,
  isError
) {

  const box =
    document.getElementById(
      "message"
    );


  box.textContent = text;


  box.className =
    "mb-4 p-3 rounded-xl text-sm " +
    (
      isError
      ? "bg-red-50 text-red-600 border border-red-200"
      : "bg-green-50 text-green-600 border border-green-200"
    );


  box.classList.remove("hidden");

}


// ======================================

renderCart();

</script>

</body>
  </html>
