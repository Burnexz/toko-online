<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Pembayaran - SRC Zokent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

  <!-- HEADER -->
  <header class="bg-red-600 text-white py-4 px-6 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='src.html'" class="bg-red-700 hover:bg-red-800 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition-all border border-red-500">
        ← Kembali Belanja
      </button>
      <h1 class="text-lg font-bold">🛒 Detail Pesanan Anda</h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 md:p-6">
    
    <!-- DAFTAR ITEM KERANJANG -->
    <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200 mb-6">
      <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">
        📦 Barang di Keranjang
      </h2>
      
      <div id="daftar-keranjang" class="divide-y divide-slate-100">
        <p class="text-center py-6 text-slate-400">Keranjang belanja Anda masih kosong.</p>
      </div>

      <!-- TOTAL HARGA -->
      <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-600">Total Pembayaran:</span>
        <span id="total-harga" class="text-xl font-extrabold text-red-600">Rp 0</span>
      </div>
    </div>

    <!-- FORM DATA PEMBELI & PEMBAYARAN -->
    <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200">
      <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">
        📝 Form Pengiriman & Pembayaran
      </h2>

      <form id="form-checkout" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
          <input type="text" id="nama-pembeli" required placeholder="Contoh: Budi Santoso" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat Pengiriman / Catatan</label>
          <textarea id="alamat-pembeli" rows="2" required placeholder="Masukkan alamat lengkap atau no. meja/catatan..." class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500"></textarea>
        </div>

        <!-- PILIHAN METODE PEMBAYARAN -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-2">Pilih Metode Pembayaran</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="border border-slate-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:border-red-500 transition-all bg-slate-50">
              <input type="radio" name="metode-bayar" value="COD / Bayar di Tempat" checked class="text-red-600 focus:ring-red-500" onchange="toggleQris(false)">
              <div>
                <p class="text-xs font-bold text-slate-800">💵 COD / Manual</p>
                <p class="text-[10px] text-slate-500">Bayar langsung / konfirmasi via WA</p>
              </div>
            </label>

            <label class="border border-slate-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:border-red-500 transition-all bg-slate-50">
              <input type="radio" name="metode-bayar" value="QRIS" class="text-red-600 focus:ring-red-500" onchange="toggleQris(true)">
              <div>
                <p class="text-xs font-bold text-slate-800">📱 QRIS (Scan)</p>
                <p class="text-[10px] text-slate-500">Scan pakai GoPay, OVO, BCA, dll</p>
              </div>
            </label>
          </div>
        </div>

        <!-- CONTAINER GAMBAR QRIS (Muncul Otomatis jika QRIS dipilih) -->
        <div id="qris-box" class="hidden p-4 bg-slate-50 border border-dashed border-red-300 rounded-xl text-center space-y-2">
          <p class="text-xs font-bold text-red-600">Scan QRIS di bawah ini untuk membayar:</p>
          <img src="qris.jpg" alt="QRIS Toko" class="w-48 h-48 mx-auto object-contain rounded-lg border border-slate-200 bg-white p-2 shadow-sm">
          <p class="text-[11px] text-slate-500">Setelah scan dan berhasil, klik tombol kirim pesanan di bawah dan lampirkan buktinya.</p>
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold text-sm py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
          📲 Kirim Pesanan via WhatsApp
        </button>
      </form>
    </div>

  </main>

  <script>
    // ⚠️ GANTI DENGAN NOMOR WHATSAPP TOKO ANDA (Awali 62)
    const NOMOR_WA_TOKO = "628xxxxxxxxxx"; 

    // 1. TAMPILKAN DAFTAR KERANJANG
    function renderKeranjang() {
      const container = document.getElementById('daftar-keranjang');
      const totalEl = document.getElementById('total-harga');
      const keranjang = JSON.parse(localStorage.getItem('keranjang_zokent')) || [];

      if (keranjang.length === 0) {
        container.innerHTML = `<p class="text-center py-6 text-slate-400">Keranjang belanja Anda masih kosong.</p>`;
        totalEl.innerText = "Rp 0";
        return;
      }

      let grandTotal = 0;
      container.innerHTML = keranjang.map((item, index) => {
        const subtotal = item.harga * item.jumlah;
        grandTotal += subtotal;

        return `
          <div class="py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              ${item.gambar ? `<img src="${item.gambar}" class="w-12 h-12 rounded-lg object-cover">` : '<span class="text-2xl">📦</span>'}
              <div>
                <h4 class="font-bold text-xs text-slate-800">${item.nama}</h4>
                <p class="text-[11px] text-slate-500">Rp ${Number(item.harga).toLocaleString('id-ID')} x ${item.jumlah}</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="flex items-center border border-slate-200 rounded-lg">
                <button type="button" onclick="ubahJumlah(${index}, -1)" class="px-2 py-0.5 text-xs font-bold text-slate-600 hover:bg-slate-100">-</button>
                <span class="px-2 text-xs font-semibold">${item.jumlah}</span>
                <button type="button" onclick="ubahJumlah(${index}, 1)" class="px-2 py-0.5 text-xs font-bold text-slate-600 hover:bg-slate-100">+</button>
              </div>
              <span class="text-xs font-bold text-slate-800">Rp ${Number(subtotal).toLocaleString('id-ID')}</span>
              <button type="button" onclick="hapusItem(${index})" class="text-red-500 hover:text-red-700 text-xs font-bold">🗑</button>
            </div>
          </div>
        `;
      }).join('');

      totalEl.innerText = `Rp ${Number(grandTotal).toLocaleString('id-ID')}`;
    }

    // 2. TOGGLE TAMPILAN QRIS
    function toggleQris(tampilkan) {
      const qrisBox = document.getElementById('qris-box');
      if (tampilkan) {
        qrisBox.classList.remove('hidden');
      } else {
        qrisBox.classList.add('hidden');
      }
    }

    // 3. UBAH JUMLAH ITEM (+ / -)
    function ubahJumlah(index, delta) {
      let keranjang = JSON.parse(localStorage.getItem('keranjang_zokent')) || [];
      keranjang[index].jumlah += delta;
      
      if (keranjang[index].jumlah <= 0) {
        keranjang.splice(index, 1);
      }
      
      localStorage.setItem('keranjang_zokent', JSON.stringify(keranjang));
      renderKeranjang();
    }

    // 4. HAPUS ITEM
    function hapusItem(index) {
      let keranjang = JSON.parse(localStorage.getItem('keranjang_zokent')) || [];
      keranjang.splice(index, 1);
      localStorage.setItem('keranjang_zokent', JSON.stringify(keranjang));
      renderKeranjang();
    }

    // 5. KIRIM PESANAN KE WHATSAPP
    document.getElementById('form-checkout').addEventListener('submit', (e) => {
      e.preventDefault();
      const keranjang = JSON.parse(localStorage.getItem('keranjang_zokent')) || [];
      
      if (keranjang.length === 0) {
        alert('Keranjang belanja Anda masih kosong!');
        return;
      }

      const nama = document.getElementById('nama-pembeli').value.trim();
      const alamat = document.getElementById('alamat-pembeli').value.trim();
      const metodeBayar = document.querySelector('input[name="metode-bayar"]:checked').value;

      let rincianPesanan = "";
      let grandTotal = 0;

      keranjang.forEach(item => {
        const subtotal = item.harga * item.jumlah;
        grandTotal += subtotal;
        rincianPesanan += `- ${item.nama} (${item.jumlah}x) = Rp ${Number(subtotal).toLocaleString('id-ID')}\n`;
      });

      const pesanWA = `Halo SRC Zokent, saya mau pesan:\n\n` +
        `*Nama:* ${nama}\n` +
        `*Alamat/Catatan:* ${alamat}\n` +
        `*Metode Pembayaran:* ${metodeBayar}\n\n` +
        `*Detail Pesanan:*\n${rincianPesanan}\n` +
        `*Total Pembayaran:* Rp ${Number(grandTotal).toLocaleString('id-ID')}\n\n` +
        `Mohon diproses ya, terima kasih!`;

      // Buka Whatsapp
      window.open(`https://wa.me/${NOMOR_WA_TOKO}?text=${encodeURIComponent(pesanWA)}`, '_blank');
      
      // Kosongkan keranjang setelah order terkirim
      localStorage.removeItem('keranjang_zokent');
      renderKeranjang();
    });

    renderKeranjang();
  </script>

</body>
</html>
