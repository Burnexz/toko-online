<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir POS - Zokent Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">

  <!-- HEADER NAVBAR -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-3xl">🏪</span>
      <div>
        <h1 class="font-extrabold text-slate-800 text-lg leading-tight">ZOKENT GROUP</h1>
        <p class="text-xs text-slate-500">Sistem Kasir POS</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-right">
        <p id="kasir-email" class="text-xs font-bold text-slate-700">Memuat...</p>
        <span class="inline-block bg-emerald-100 text-emerald-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Petugas Kasir</span>
      </div>
      <button id="btn-logout" class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 px-3 py-2 rounded-xl text-xs font-bold transition-all border border-slate-200">
        🚪 Keluar
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER (LAYOUT 2 KOLOM) -->
  <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
    
    <!-- KOLOM KIRI: KATALOG PRODUK (LG: 7 KOLOM) -->
    <section class="lg:col-span-7 flex flex-col gap-4">
      <!-- PENCARIAN & FILTER -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex gap-3">
        <input 
          type="text" 
          id="search-input" 
          placeholder="🔍 Cari nama barang atau kode SKU..." 
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
        >
      </div>

      <!-- GRID DAFTAR PRODUK -->
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto max-h-[calc(100vh-220px)] p-1">
        <!-- Produk dinamis diisi oleh JavaScript -->
      </div>
    </section>

    <!-- KOLOM KANAN: KERANJANG & PEMBAYARAN (LG: 5 KOLOM) -->
    <section class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 shadow-xl p-5 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
          <h2 class="font-extrabold text-slate-800 text-base">🛒 Keranjang Belanja</h2>
          <button id="btn-clear-cart" class="text-xs text-red-500 font-bold hover:underline">Kosongkan</button>
        </div>

        <!-- LIST ITEM KERANJANG -->
        <div id="cart-list" class="space-y-3 max-h-[260px] overflow-y-auto pr-1">
          <p class="text-xs text-slate-400 text-center py-8">Keranjang masih kosong.</p>
        </div>
      </div>

      <!-- RINGKASAN & KALKULATOR PEMBAYARAN -->
      <div class="border-t border-slate-100 pt-4 mt-4 space-y-3">
        <div class="flex justify-between text-sm">
          <span class="text-slate-500 font-medium">Total Harga</span>
          <span id="total-price" class="font-extrabold text-slate-900 text-lg">Rp 0</span>
        </div>

        <!-- INPUT UANG BAYAR -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nominal Bayar (Rp)</label>
          <input 
            type="number" 
            id="cash-input" 
            placeholder="0" 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          >
        </div>

        <div class="flex justify-between text-sm py-1">
          <span class="text-slate-500 font-medium">Kembalian</span>
          <span id="change-price" class="font-bold text-emerald-600">Rp 0</span>
        </div>

        <button 
          id="btn-checkout" 
          disabled
          class="w-full bg-slate-300 text-white font-extrabold py-3.5 rounded-xl text-sm transition-all shadow-md disabled:cursor-not-allowed"
        >
          💳 Selesaikan Transaksi
        </button>
      </div>
    </section>
  </main>

  <!-- SUPABASE INTERACTION SCRIPT -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DUMMY DATA PRODUK (Dapat diganti dengan fetch dari Supabase 'products')
    const products = [
      { id: 1, name: "Kopi Hitam Zokent", price: 12000, icon: "☕" },
      { id: 2, name: "Roti Bakar Cokelat", price: 18000, icon: "🍞" },
      { id: 3, name: "Air Mineral 600ml", price: 5000, icon: "🥤" },
      { id: 4, name: "Snack Keripik Pedas", price: 10000, icon: "🍿" },
      { id: 5, name: "Es Teh Manis", price: 8000, icon: "🍹" }
    ];

    let cart = [];

    // ELEMEN DOM
    const productGrid = document.getElementById("product-grid");
    const cartList = document.getElementById("cart-list");
    const totalPriceEl = document.getElementById("total-price");
    const cashInput = document.getElementById("cash-input");
    const changePriceEl = document.getElementById("change-price");
    const btnCheckout = document.getElementById("btn-checkout");
    const kasirEmail = document.getElementById("kasir-email");

    // FORMAT RUPIAH
    const formatRupiah = (number) => "Rp " + number.toLocaleString("id-ID");

    // RENDER KATALOG PRODUK
    function renderProducts(items) {
      productGrid.innerHTML = items.map(p => `
        <div onclick="addToCart(${p.id})" class="bg-white p-4 rounded-2xl border border-slate-200 hover:border-red-500 cursor-pointer transition-all shadow-sm flex flex-col items-center text-center group">
          <div class="text-4xl mb-2 group-hover:scale-110 transition-transform">${p.icon}</div>
          <h3 class="text-xs font-bold text-slate-800 line-clamp-1">${p.name}</h3>
          <p class="text-xs text-red-600 font-extrabold mt-1">${formatRupiah(p.price)}</p>
        </div>
      `).join("");
    }

    // TAMBAH KE KERANJANG
    window.addToCart = (id) => {
      const item = products.find(p => p.id === id);
      const cartItem = cart.find(c => c.id === id);

      if (cartItem) {
        cartItem.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    };

    // UPDATE TAMPILAN KERANJANG & KALKULASI
    function updateCartUI() {
      if (cart.length === 0) {
        cartList.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Keranjang masih kosong.</p>`;
        totalPriceEl.textContent = "Rp 0";
        btnCheckout.disabled = true;
        btnCheckout.className = "w-full bg-slate-300 text-white font-extrabold py-3.5 rounded-xl text-sm transition-all shadow-md disabled:cursor-not-allowed";
        return;
      }

      cartList.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs">
          <div>
            <p class="font-bold text-slate-800">${item.name}</p>
            <p class="text-slate-500">${formatRupiah(item.price)} x ${item.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white border rounded-lg text-slate-600 font-bold">-</button>
            <span class="font-bold text-slate-800">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white border rounded-lg text-slate-600 font-bold">+</button>
          </div>
        </div>
      `).join("");

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      totalPriceEl.textContent = formatRupiah(total);
      
      calculateChange(total);
    }

    // UBAH QUANTITY
    window.changeQty = (id, delta) => {
      const cartItem = cart.find(c => c.id === id);
      if (cartItem) {
        cartItem.qty += delta;
        if (cartItem.qty <= 0) {
          cart = cart.filter(c => c.id !== id);
        }
      }
      updateCartUI();
    };

    // HITUNG KEMBALIAN
    function calculateChange(total) {
      const cash = parseFloat(cashInput.value) || 0;
      const change = cash - total;

      if (cash >= total && total > 0) {
        changePriceEl.textContent = formatRupiah(change);
        btnCheckout.disabled = false;
        btnCheckout.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl text-sm transition-all shadow-md cursor-pointer";
      } else {
        changePriceEl.textContent = "Rp 0";
        btnCheckout.disabled = true;
        btnCheckout.className = "w-full bg-slate-300 text-white font-extrabold py-3.5 rounded-xl text-sm transition-all shadow-md disabled:cursor-not-allowed";
      }
    }

    cashInput.addEventListener("input", () => {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      calculateChange(total);
    });

    // KOSONGKAN KERANJANG
    document.getElementById("btn-clear-cart").addEventListener("click", () => {
      cart = [];
      cashInput.value = "";
      updateCartUI();
    });

    // SELESAIKAN TRANSAKSI
    btnCheckout.addEventListener("click", () => {
      alert("✅ Transaksi Berhasil Disimpan!");
      cart = [];
      cashInput.value = "";
      updateCartUI();
    });

    // VERIFIKASI SESI SUPABASE & LOGOUT
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
      } else {
        kasirEmail.textContent = session.user.email;
      }
    }

    document.getElementById("btn-logout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });

    // INITIALIZATION
    checkAuth();
    renderProducts(products);
  </script>
</body>
</html>
