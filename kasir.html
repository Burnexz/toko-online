<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir POS Terminal - Matrix Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height: 100vh;
      width: 100%;
      background-color: #030712;
      font-family: 'ui-monospace', SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #34d399;
      margin: 0;
      overflow-x: hidden;
    }
    #matrix-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    .glow-green-text {
      color: #34d399;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.7);
    }
    .glow-box {
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.2);
    }
    .glass-card {
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(52, 211, 153, 0.35);
    }
    .hacker-input {
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #4ade80;
      text-shadow: 0 0 5px rgba(74, 222, 128, 0.6);
      transition: all 0.25s ease-in-out;
    }
    .hacker-input::placeholder {
      color: rgba(52, 211, 153, 0.4);
    }
    .hacker-input:focus {
      outline: none;
      border-color: #34d399;
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.6);
      background-color: rgba(0, 0, 0, 0.6);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #15803d; border-radius: 3px; }
  </style>
  <script>
    // PROTEKSI HALAMAN KASIR: Cek apakah kasir sudah login via localStorage
    if (localStorage.getItem("kasirLoggedIn") !== "true") {
        alert("AKSES DITOLAK! Silakan login melalui portal login kasir terlebih dahulu.");
        window.location.href = "login-kasir.html";
    }
  </script>
</head>
<body class="min-h-screen w-full p-3 md:p-6 relative">

  <canvas id="matrix-bg"></canvas>

  <div class="relative z-10 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="lg:col-span-8 space-y-4">
      <div class="glass-card p-4 rounded-2xl glow-box flex justify-between items-center">
        <div>
          <h1 class="text-lg font-black glow-green-text flex items-center gap-2">
            <span>&gt;_</span> TERMINAL KASIR POS
          </h1>
          <p class="text-xs text-emerald-400/80 mt-0.5">
            OPERATOR: <span id="kasir-name" class="font-bold text-white uppercase tracking-wider">-</span>
          </p>
        </div>
        <div class="flex items-center gap-3">
          <span id="realtime-clock" class="font-mono font-bold text-xs bg-black/60 border border-emerald-500/40 text-emerald-400 px-3 py-1.5 rounded-xl glow-box">00:00:00</span>
          <button id="btn-logout" class="bg-red-950/80 hover:bg-red-900 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:shadow-[0_0_15px_rgba(239,68,68,0.4)]">
            🚪 LOGOUT
          </button>
        </div>
      </div>

      <div class="glass-card p-3 rounded-2xl glow-box flex items-center gap-2">
        <span class="text-emerald-400 text-sm pl-2">🔍</span>
        <input type="text" id="barcode-input" placeholder="Scan Barcode / Cari nama barang [Enter]..." autofocus class="hacker-input w-full px-4 py-2.5 rounded-xl text-xs font-mono">
      </div>

      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">&gt; KATALOG BARANG</span>
        <span id="product-count" class="text-xs font-bold text-emerald-500/70 font-mono">0 Item</span>
      </div>

      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-[60vh] overflow-y-auto pr-1"></div>
    </div>

    <div class="lg:col-span-4 glass-card p-4 rounded-2xl glow-box flex flex-col justify-between h-[88vh]">
      <div>
        <div class="flex justify-between items-center border-b border-emerald-500/30 pb-3 mb-3">
          <h2 class="font-black text-emerald-300 text-sm tracking-wider uppercase">&gt; PESANAN KASIR</h2>
          <button id="btn-clear-cart" class="text-xs font-bold text-red-400 hover:text-red-300 transition-colors uppercase">Clear</button>
        </div>

        <div class="max-h-[38vh] overflow-y-auto pr-1">
          <table class="w-full text-left text-xs font-mono">
            <tbody id="cart-table-body">
              <tr><td colspan="4" class="text-center py-12 text-emerald-600/70">Terminal kosong. Scan barcode untuk menambah barang.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="border-t border-emerald-500/30 pt-3 space-y-3 font-mono">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-emerald-400/80">TOTAL PAYMENT:</span>
          <span id="display-total" class="text-xl font-black text-emerald-300 glow-green-text">Rp 0</span>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-emerald-400 uppercase mb-1">TUNAI / BAYAR (RP)</label>
          <input type="number" id="cash-input" placeholder="0" class="hacker-input w-full px-3 py-2 rounded-xl text-sm font-black text-right">
        </div>

        <div class="flex justify-between items-center text-xs font-bold">
          <span class="text-emerald-400/80">KEMBALIAN:</span>
          <span id="display-change" class="px-3 py-1.5 rounded-xl bg-black/60 border border-emerald-500/30 text-emerald-400 font-mono">Rp 0</span>
        </div>

        <button id="btn-checkout" disabled class="w-full bg-emerald-950/40 text-emerald-700 border border-emerald-900 font-black py-3 rounded-xl text-xs transition-all disabled:cursor-not-allowed uppercase tracking-wider">
          💳 PROSES & CETAK STRUK
        </button>
      </div>
    </div>
  </div>

  <div id="modal-struk" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="glass-card p-6 rounded-2xl max-w-xs w-full glow-box font-mono text-xs text-emerald-300 space-y-3 border-emerald-500/50">
      <div class="text-center border-b border-emerald-500/30 pb-3">
        <h3 class="font-black text-base glow-green-text">ZOKENT MART</h3>
        <p class="text-[10px] text-emerald-500/80 tracking-widest uppercase">[ STRUK TRANSAKSI POS ]</p>
      </div>
      <div class="space-y-1 text-[11px] text-emerald-400/90">
        <div class="flex justify-between"><span>Nota:</span><span id="struk-nota" class="text-white">-</span></div>
        <div class="flex justify-between"><span>Kasir:</span><span id="struk-kasir" class="text-white">-</span></div>
        <div class="flex justify-between"><span>Waktu:</span><span id="struk-date" class="text-white">-</span></div>
      </div>
      <div id="struk-items" class="border-t border-b border-emerald-500/30 py-2 space-y-1 my-2 text-white"></div>
      <div class="space-y-1 font-bold">
        <div class="flex justify-between text-emerald-400"><span>Total:</span><span id="struk-total" class="text-emerald-300 glow-green-text">Rp 0</span></div>
        <div class="flex justify-between text-emerald-400"><span>Bayar:</span><span id="struk-bayar" class="text-white">Rp 0</span></div>
        <div class="flex justify-between text-emerald-400"><span>Kembali:</span><span id="struk-kembali" class="text-emerald-300">Rp 0</span></div>
      </div>
      <button onclick="closeStrukModal()" class="w-full mt-3 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-2.5 rounded-xl text-xs transition-all shadow-[0_0_15px_rgba(52,211,153,0.4)] uppercase">
        ✓ Selesai & Transaksi Baru
      </button>
    </div>
  </div>

  <script>
    let products = [
      { id: 1, name: "Kopi Hitam Matrix", price: 15000, stock: 50, icon: "☕", barcode: "1001" },
      { id: 2, name: "Roti Bakar Cyber", price: 20000, stock: 30, icon: "🍞", barcode: "1002" },
      { id: 3, name: "Mineral Water 600ml", price: 5000, stock: 100, icon: "💧", barcode: "1003" },
      { id: 4, name: "Snack Keripik Glitch", price: 10000, stock: 45, icon: "🍿", barcode: "1004" }
    ];
    let cart = [];

    const barcodeInput = document.getElementById("barcode-input");
    const productGrid = document.getElementById("product-grid");
    const cartTableBody = document.getElementById("cart-table-body");
    const displayTotal = document.getElementById("display-total");
    const displayChange = document.getElementById("display-change");
    const cashInput = document.getElementById("cash-input");
    const btnCheckout = document.getElementById("btn-checkout");
    const btnClearCart = document.getElementById("btn-clear-cart");
    const kasirNameEl = document.getElementById("kasir-name");

    const formatRupiah = (num) => "Rp " + Number(num).toLocaleString("id-ID");

    // Ambil nama kasir yang sedang aktif dari localStorage
    const activeKasirName = localStorage.getItem("activeKasirName") || "Operator Kasir";
    kasirNameEl.textContent = activeKasirName;

    // Matrix Rain Animation
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    let fontSize = 14;
    let columns = Math.floor(window.innerWidth / fontSize);
    let rainDrops = Array.from({ length: columns }, () => Math.floor(Math.random() * -50));
    const alphabet = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#10b981';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
        rainDrops[i]++;
      }
    }
    function initMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
    }
    initMatrix();
    window.addEventListener('resize', initMatrix);
    setInterval(drawMatrix, 45);

    // Realtime Clock
    setInterval(() => {
      const clockEl = document.getElementById("realtime-clock");
      if (clockEl) clockEl.textContent = new Date().toLocaleTimeString("id-ID");
    }, 1000);

    function loadProducts() {
      // Muat data produk (bisa disesuaikan dengan localStorage jika produk juga diatur admin)
      const savedProducts = JSON.parse(localStorage.getItem("daftarProduk"));
      if (savedProducts && savedProducts.length > 0) {
        products = savedProducts;
      }
      document.getElementById("product-count").textContent = `${products.length} Item`;
      renderProducts(products);
    }

    function renderProducts(items) {
      productGrid.innerHTML = items.map(p => `
        <div onclick="addToCartById(${p.id})" class="glass-card p-3 rounded-xl hover:border-emerald-400 hover:shadow-[0_0_15px_rgba(52,211,153,0.3)] cursor-pointer transition-all flex flex-col justify-between group">
          <div>
            <div class="text-2xl text-center mb-1 group-hover:scale-110 transition-transform">${p.icon || '📦'}</div>
            <p class="text-[11px] font-bold text-white line-clamp-2 leading-tight font-mono">${p.name}</p>
          </div>
          <div class="mt-2 pt-2 border-t border-emerald-500/20 flex justify-between items-center font-mono">
            <span class="text-[9px] text-emerald-400/70">Stok: ${p.stock ?? 0}</span>
            <span class="text-xs font-black text-emerald-300 glow-green-text">${formatRupiah(p.price)}</span>
          </div>
        </div>
      `).join("");
    }

    window.addToCartById = (id) => {
      const product = products.find(p => p.id === id);
      if (product) addItemToOrder(product);
    };

    function addItemToOrder(product) {
      const existingItem = cart.find(c => c.id === product.id);
      const currentQty = existingItem ? existingItem.qty : 0;

      if (product.stock !== undefined && (currentQty + 1) > product.stock) {
        alert(`⚠️ Stok ${product.name} tidak mencukupi!`);
        return;
      }

      if (existingItem) existingItem.qty += 1;
      else cart.push({ ...product, qty: 1 });

      updateOrderUI();
      barcodeInput.value = "";
      barcodeInput.focus();
    }

    barcodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const query = barcodeInput.value.trim().toLowerCase();
        if (!query) return;

        const matched = products.find(p => (p.barcode && p.barcode.toLowerCase() === query) || p.name.toLowerCase().includes(query));
        if (matched) addItemToOrder(matched);
        else {
          alert("❌ Barang tidak ditemukan!");
          barcodeInput.value = "";
        }
      }
    });

    function updateOrderUI() {
      if (cart.length === 0) {
        cartTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-emerald-600/70">Terminal kosong. Scan barcode untuk menambah barang.</td></tr>`;
        displayTotal.textContent = "Rp 0";
        displayChange.textContent = "Rp 0";
        btnCheckout.disabled = true;
        btnCheckout.className = "w-full bg-emerald-950/40 text-emerald-700 border border-emerald-900 font-black py-3 rounded-xl text-xs transition-all disabled:cursor-not-allowed uppercase tracking-wider";
        return;
      }

      cartTableBody.innerHTML = cart.map(item => `
        <tr class="hover:bg-emerald-950/30 border-b border-emerald-500/10">
          <td class="py-2.5 font-bold text-white"><p class="leading-tight">${item.name}</p></td>
          <td class="py-2.5 text-center text-emerald-400 font-bold">${item.qty}</td>
          <td class="py-2.5 text-right font-black text-emerald-300">${formatRupiah(item.price * item.qty)}</td>
          <td class="py-2.5 text-center"><button onclick="removeItem(${item.id})" class="text-red-400 hover:text-red-300 font-bold">✕</button></td>
        </tr>
      `).join("");

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      displayTotal.textContent = formatRupiah(total);
      calculateChange(total);
    }

    window.removeItem = (id) => {
      cart = cart.filter(c => c.id !== id);
      updateOrderUI();
    };

    if (btnClearCart) {
      btnClearCart.addEventListener("click", () => {
        cart = [];
        updateOrderUI();
      });
    }

    function calculateChange(total) {
      const cash = parseFloat(cashInput.value) || 0;
      const change = cash - total;

      if (cash >= total && total > 0) {
        displayChange.textContent = formatRupiah(change);
        displayChange.className = "px-3 py-1.5 rounded-xl bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 font-mono glow-green-text";
        btnCheckout.disabled = false;
        btnCheckout.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-3 rounded-xl text-xs transition-all shadow-[0_0_20px_rgba(52,211,153,0.5)] cursor-pointer uppercase tracking-wider";
      } else {
        displayChange.textContent = "Rp 0";
        displayChange.className = "px-3 py-1.5 rounded-xl bg-black/60 border border-emerald-500/30 text-emerald-500/60 font-mono";
        btnCheckout.disabled = true;
        btnCheckout.className = "w-full bg-emerald-950/40 text-emerald-700 border border-emerald-900 font-black py-3 rounded-xl text-xs transition-all disabled:cursor-not-allowed uppercase tracking-wider";
      }
    }

    cashInput.addEventListener("input", () => {
      calculateChange(cart.reduce((sum, item) => sum + (item.price * item.qty), 0));
    });

    btnCheckout.addEventListener("click", () => {
      btnCheckout.disabled = true;
      btnCheckout.textContent = "⏳ PROCESSING TRANSACTIONS...";

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const cash = parseFloat(cashInput.value) || 0;
      const change = cash - total;
      const notaNo = "#TRX-" + Math.floor(100000 + Math.random() * 900000);
      const cashierName = activeKasirName;

      // Kurangi stok barang lokal
      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) {
          prod.stock = Math.max(0, prod.stock - item.qty);
        }
      });
      localStorage.setItem("daftarProduk", JSON.stringify(products));
      loadProducts();

      // Tampilkan Struk
      document.getElementById("struk-nota").textContent = notaNo;
      document.getElementById("struk-kasir").textContent = cashierName;
      document.getElementById("struk-date").textContent = new Date().toLocaleString("id-ID");
      document.getElementById("struk-total").textContent = formatRupiah(total);
      document.getElementById("struk-bayar").textContent = formatRupiah(cash);
      document.getElementById("struk-kembali").textContent = formatRupiah(change);
      document.getElementById("struk-items").innerHTML = cart.map(i => `
        <div class="flex justify-between">
          <span>${i.name} x${i.qty}</span>
          <span>${formatRupiah(i.price * i.qty)}</span>
        </div>
      `).join("");

      document.getElementById("modal-struk").classList.remove("hidden");
      btnCheckout.textContent = "💳 PROSES & CETAK STRUK";
    });

    window.closeStrukModal = () => {
      document.getElementById("modal-struk").classList.add("hidden");
      cart = [];
      cashInput.value = "";
      updateOrderUI();
      barcodeInput.focus();
    };

    // Tombol Logout Kasir
    document.getElementById("btn-logout").addEventListener("click", () => {
      if (confirm("Apakah Anda yakin ingin keluar dari sesi Kasir?")) {
        localStorage.removeItem("kasirLoggedIn");
        localStorage.removeItem("activeKasirName");
        localStorage.removeItem("activeKasirEmail");
        window.location.href = "login-kasir.html";
      }
    });

    // Inisialisasi awal saat halaman dimuat
    loadProducts();
  </script>
</body>
</html>
