<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // EFEK SUARA BEEP SCANNER
  function playBeepSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = 1400;
      gainNode.gain.value = 0.15;
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.08);
    } catch (e) {}
  }

  let products = [];
  let cart = [];
  let html5QrcodeScanner = null;

  const barcodeInput = document.getElementById("barcode-input");
  const productGrid = document.getElementById("product-grid");
  const cartTableBody = document.getElementById("cart-table-body");
  const displayTotal = document.getElementById("display-total");
  const displayChange = document.getElementById("display-change");
  const cashInput = document.getElementById("cash-input");
  const btnCheckout = document.getElementById("btn-checkout");
  const kasirNameEl = document.getElementById("kasir-name");

  const formatRupiah = (num) => "Rp " + Number(num).toLocaleString("id-ID");

  // JAM REALTIME
  setInterval(() => {
    const clockEl = document.getElementById("realtime-clock");
    if (clockEl) clockEl.textContent = new Date().toLocaleTimeString("id-ID");
  }, 1000);

  // 1. VERIFIKASI KEAMANAN & AKUN KASIR (PENTING)
  async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();

    // Jika belum login sama sekali -> lempar ke login-admin.html
    if (!session) {
      window.location.href = "login-admin.html";
      return;
    }

    const userRole = session.user.user_metadata?.role;

    // Jika yang login BUKAN role kasir (misal belum dibuatkan akun oleh admin) -> tolak
    if (userRole !== "kasir" && userRole !== "admin") {
      alert("⚠️ Akses ditolak! Anda harus login menggunakan akun Kasir yang dibuat oleh Admin.");
      await supabase.auth.signOut();
      window.location.href = "login-admin.html";
      return;
    }

    // Tampilkan Nama Kasir yang dibuat oleh Admin
    if (kasirNameEl) {
      const kasirUsername = session.user.user_metadata?.username || session.user.email.split('@')[0];
      kasirNameEl.textContent = kasirUsername;
    }
  }

  // 2. FETCH DATA BARANG DARI SUPABASE
  async function loadProducts() {
    const { data, error } = await supabase.from('products').select('*');
    if (data && data.length > 0) {
      products = data;
    }
    const countEl = document.getElementById("product-count");
    if (countEl) countEl.textContent = `${products.length} Item`;
    renderProducts(products);
  }

  // 3. RENDER KATALOG
  function renderProducts(items) {
    if (!productGrid) return;
    productGrid.innerHTML = items.map(p => `
      <div onclick="addToCartById(${p.id})" class="bg-white p-2.5 rounded-xl border border-slate-200 hover:border-[#005697] hover:shadow-md cursor-pointer transition-all flex flex-col justify-between group">
        <div>
          <div class="text-2xl text-center mb-1 group-hover:scale-110 transition-transform">${p.icon || '📦'}</div>
          <p class="text-[11px] font-bold text-slate-800 line-clamp-2 leading-tight">${p.name}</p>
        </div>
        <div class="mt-2 pt-1 border-t border-slate-100 flex justify-between items-center">
          <span class="text-[9px] font-mono text-slate-400">Stok: ${p.stock ?? 0}</span>
          <span class="text-xs font-black text-[#e31e24]">${formatRupiah(p.price)}</span>
        </div>
      </div>
    `).join("");
  }

  window.addToCartById = (id) => {
    const product = products.find(p => p.id === id);
    if (product) addItemToOrder(product);
  };

  // 4. TAMBAH BARANG KE KERANJANG (DENGAN CEK STOK)
  function addItemToOrder(product) {
    const existingItem = cart.find(c => c.id === product.id);
    const currentQtyInCart = existingItem ? existingItem.qty : 0;

    if (product.stock !== undefined && (currentQtyInCart + 1) > product.stock) {
      alert(`⚠️ Stok ${product.name} tidak mencukupi! Sisa stok: ${product.stock}`);
      return;
    }

    playBeepSound();

    if (existingItem) {
      existingItem.qty += 1;
    } else {
      cart.push({ ...product, qty: 1 });
    }

    updateOrderUI();
    if (barcodeInput) {
      barcodeInput.value = "";
      barcodeInput.focus();
    }
  }

  // 5. SCANNER BARCODE INPUT
  if (barcodeInput) {
    barcodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const query = barcodeInput.value.trim().toLowerCase();
        if (!query) return;

        const matchedProduct = products.find(p => 
          (p.barcode && p.barcode.toLowerCase() === query) || 
          p.name.toLowerCase().includes(query)
        );

        if (matchedProduct) {
          addItemToOrder(matchedProduct);
        } else {
          alert("❌ Barang tidak ditemukan!");
          barcodeInput.value = "";
        }
      }
    });
  }

  // 6. UPDATE UI KERANJANG
  function updateOrderUI() {
    if (!cartTableBody) return;

    if (cart.length === 0) {
      cartTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-slate-400 text-xs">Pesanan masih kosong. Scan barcode untuk menambah barang.</td></tr>`;
      if (displayTotal) displayTotal.textContent = "Rp 0";
      if (displayChange) displayChange.textContent = "Rp 0";
      if (btnCheckout) {
        btnCheckout.disabled = true;
        btnCheckout.className = "w-full bg-slate-300 text-slate-500 font-black py-3 rounded-xl text-sm transition-all shadow-md disabled:cursor-not-allowed flex items-center justify-center gap-2";
      }
      return;
    }

    cartTableBody.innerHTML = cart.map(item => `
      <tr class="hover:bg-slate-50">
        <td class="py-2.5 font-bold text-slate-800">
          <p class="leading-tight">${item.name}</p>
          <p class="text-[9px] text-slate-400 font-normal">@ ${formatRupiah(item.price)}</p>
        </td>
        <td class="py-2.5 text-center">
          <div class="inline-flex items-center gap-1 bg-slate-100 rounded-lg p-0.5">
            <button onclick="changeQty(${item.id}, -1)" class="w-5 h-5 bg-white rounded font-bold border shadow-sm text-slate-600">-</button>
            <span class="px-1 font-bold text-slate-800">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="w-5 h-5 bg-white rounded font-bold border shadow-sm text-slate-600">+</button>
          </div>
        </td>
        <td class="py-2.5 text-right font-black text-slate-800">${formatRupiah(item.price * item.qty)}</td>
        <td class="py-2.5 text-center">
          <button onclick="removeItem(${item.id})" class="text-red-500 hover:text-red-700 font-bold px-1">✕</button>
        </td>
      </tr>
    `).join("");

    const totalNominal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    if (displayTotal) displayTotal.textContent = formatRupiah(totalNominal);
    calculateChange(totalNominal);
  }

  window.changeQty = (id, delta) => {
    const item = cart.find(c => c.id === id);
    if (item) {
      const product = products.find(p => p.id === id);
      if (delta > 0 && product && (item.qty + delta) > product.stock) {
        alert(`Stok maksimal ${product.name} hanya ${product.stock}`);
        return;
      }
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
    }
    updateOrderUI();
  };

  window.removeItem = (id) => {
    cart = cart.filter(c => c.id !== id);
    updateOrderUI();
  };

  function calculateChange(total) {
    if (!cashInput || !displayChange || !btnCheckout) return;
    const cash = parseFloat(cashInput.value) || 0;
    const change = cash - total;

    if (cash >= total && total > 0) {
      displayChange.textContent = formatRupiah(change);
      displayChange.className = "px-3 py-2 rounded-lg bg-emerald-100 font-extrabold text-emerald-700 text-sm font-mono";
      btnCheckout.disabled = false;
      btnCheckout.className = "w-full bg-[#005697] hover:bg-blue-800 text-white font-black py-3 rounded-xl text-sm transition-all shadow-md cursor-pointer flex items-center justify-center gap-2";
    } else {
      displayChange.textContent = "Rp 0";
      displayChange.className = "px-3 py-2 rounded-lg bg-slate-200 font-bold text-slate-700 text-sm font-mono";
      btnCheckout.disabled = true;
      btnCheckout.className = "w-full bg-slate-300 text-slate-500 font-black py-3 rounded-xl text-sm transition-all shadow-md disabled:cursor-not-allowed flex items-center justify-center gap-2";
    }
  }

  if (cashInput) {
    cashInput.addEventListener("input", () => {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      calculateChange(total);
    });
  }

  // 7. PROSES TRANSAKSI & POTONG STOK
  if (btnCheckout) {
    btnCheckout.addEventListener("click", async () => {
      btnCheckout.disabled = true;
      btnCheckout.textContent = "⏳ Memproses Transaksi...";

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const cash = parseFloat(cashInput.value) || 0;
      const change = cash - total;
      const notaNo = "#TRX-" + Math.floor(100000 + Math.random() * 900000);
      const cashierName = kasirNameEl ? kasirNameEl.textContent : "Kasir";

      try {
        // Catat Transaksi
        await supabase.from('transactions').insert([{
          total_price: total,
          cash_paid: cash,
          change_returned: change,
          cashier_email: cashierName
        }]);

        // Potong Stok
        for (const item of cart) {
          const productInDb = products.find(p => p.id === item.id);
          if (productInDb) {
            const updatedStock = Math.max(0, (productInDb.stock || 0) - item.qty);
            await supabase
              .from('products')
              .update({ stock: updatedStock })
              .eq('id', item.id);
          }
        }

        await loadProducts();

        // Cetak / Tampil Struk
        const strukNota = document.getElementById("struk-nota");
        const strukKasir = document.getElementById("struk-kasir");
        const strukDate = document.getElementById("struk-date");
        const strukTotal = document.getElementById("struk-total");
        const strukBayar = document.getElementById("struk-bayar");
        const strukKembali = document.getElementById("struk-kembali");
        const strukItems = document.getElementById("struk-items");
        const modalStruk = document.getElementById("modal-struk");

        if (strukNota) strukNota.textContent = notaNo;
        if (strukKasir) strukKasir.textContent = cashierName;
        if (strukDate) strukDate.textContent = new Date().toLocaleString("id-ID");
        if (strukTotal) strukTotal.textContent = formatRupiah(total);
        if (strukBayar) strukBayar.textContent = formatRupiah(cash);
        if (strukKembali) strukKembali.textContent = formatRupiah(change);

        if (strukItems) {
          strukItems.innerHTML = cart.map(item => `
            <div class="flex justify-between">
              <span>${item.name} x${item.qty}</span>
              <span>${formatRupiah(item.price * item.qty)}</span>
            </div>
          `).join("");
        }

        if (modalStruk) modalStruk.classList.remove("hidden");

      } catch (err) {
        alert("Terjadi kesalahan transaksi: " + err.message);
      } finally {
        btnCheckout.textContent = "💳 PROSES & CETAK STRUK";
      }
    });
  }

  // LOGOUT KASIR
  const btnLogout = document.getElementById("btn-logout");
  if (btnLogout) {
    btnLogout.addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login-admin.html";
    });
  }

  // INISIALISASI
  await checkAuth();
  await loadProducts();
</script>
