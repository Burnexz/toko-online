<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelola Kasir - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      font-size: 24px;
    }

    .add-button {
      border: none;
      background: #111827;
      color: white;
      padding: 12px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-box {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .form-box.active {
      display: block;
    }

    .form-box h3 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
    }

    .save-button,
    .cancel-button {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-button {
      background: #111827;
      color: white;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #111827;
    }

    .cashier-list {
      display: grid;
      gap: 12px;
    }

    .cashier-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .cashier-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .username {
      color: #6b7280;
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .active {
      background: #dcfce7;
      color: #166534;
    }

    .inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .message {
      margin-bottom: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #6b7280;
      background: white;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .toggle-button {
      margin-top: 12px;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      background: #e5e7eb;
    }
  </style>
</head>

<body>

<header>
  <h1>ZOKENT STORE</h1>
  <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main class="container">

  <div class="top">
    <h2>Kelola Kasir</h2>

    <button
      class="add-button"
      onclick="showForm()">
      + Tambah Kasir
    </button>
  </div>

  <div id="message" class="message"></div>

  <section id="formBox" class="form-box">

    <h3>Tambah Kasir</h3>

    <form id="cashierForm">

      <label for="fullName">
        Nama Kasir
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Contoh: Budi"
        required
      >

      <label for="username">
        Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Contoh: budi"
        autocomplete="off"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Minimal 6 karakter"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <div class="form-actions">

        <button
          type="submit"
          class="save-button"
          id="saveButton">
          Simpan Kasir
        </button>

        <button
          type="button"
          class="cancel-button"
          onclick="hideForm()">
          Batal
        </button>

      </div>

    </form>

  </section>


  <section id="cashierList">

    <div class="loading">
      Memuat data kasir...
    </div>

  </section>

</main>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL = "MASUKKAN_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "MASUKKAN_SUPABASE_ANON_KEY";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ==========================================
  // CEK PEMILIK
  // ==========================================

  async function checkOwner() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "admin.html";
      return false;
    }

    const { data: profile, error } =
      await supabaseClient
        .from("profiles")
        .select("role, is_active")
        .eq("id", user.id)
        .single();

    if (
      error ||
      !profile ||
      profile.role !== "owner" ||
      profile.is_active !== true
    ) {

      await supabaseClient.auth.signOut();

      window.location.href = "admin.html";

      return false;
    }

    return true;
  }


  // ==========================================
  // TAMPILKAN FORM
  // ==========================================

  function showForm() {

    document
      .getElementById("formBox")
      .classList.add("active");

    document
      .getElementById("fullName")
      .focus();
  }


  function hideForm() {

    document
      .getElementById("formBox")
      .classList.remove("active");

    document
      .getElementById("cashierForm")
      .reset();

  }


  // ==========================================
  // PESAN
  // ==========================================

  function showMessage(text, success = false) {

    const element =
      document.getElementById("message");

    element.textContent = text;

    element.style.color =
      success ? "green" : "red";

  }


  // ==========================================
  // BUAT KASIR
  // ==========================================

  document
    .getElementById("cashierForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      const saveButton =
        document.getElementById("saveButton");

      saveButton.disabled = true;
      saveButton.textContent = "Membuat...";

      showMessage("");


      try {

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

          window.location.href = "admin.html";
          return;

        }


        // Panggil Edge Function
        const { data, error } =
          await supabaseClient.functions.invoke(
            "rapid-function",
            {
              body: {
                full_name: fullName,
                username: username,
                password: password
              }
            }
          );


        if (error) {
          throw error;
        }


        if (!data || !data.success) {

          throw new Error(
            data?.error ||
            "Gagal membuat akun kasir"
          );

        }


        showMessage(
          "Akun kasir berhasil dibuat.",
          true
        );


        hideForm();

        loadCashiers();

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Terjadi kesalahan saat membuat kasir."
        );

      } finally {

        saveButton.disabled = false;
        saveButton.textContent = "Simpan Kasir";

      }

    });


  // ==========================================
  // TAMPILKAN DAFTAR KASIR
  // ==========================================

  async function loadCashiers() {

    const list =
      document.getElementById("cashierList");

    list.innerHTML =
      '<div class="loading">Memuat data kasir...</div>';


    const { data, error } =
      await supabaseClient
        .from("cashier_settings")
        .select(`
          id,
          username,
          is_active,
          created_at,
          user_id
        `)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      list.innerHTML =
        '<div class="empty">Gagal memuat data kasir.</div>';

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">Belum ada kasir.</div>';

      return;
    }


    list.innerHTML = "";


    for (const cashier of data) {

      const card =
        document.createElement("div");

      card.className = "cashier-card";

      card.innerHTML = `
        <div class="cashier-name">
          Kasir
        </div>

        <div class="username">
          Username: ${escapeHtml(cashier.username)}
        </div>

        <span class="status ${
          cashier.is_active
            ? "active"
            : "inactive"
        }">
          ${
            cashier.is_active
              ? "Aktif"
              : "Nonaktif"
          }
        </span>

        <br>

        <button
          class="toggle-button"
          onclick="toggleCashier(
            '${cashier.id}',
            ${cashier.is_active}
          )">
          ${
            cashier.is_active
              ? "Nonaktifkan"
              : "Aktifkan"
          }
        </button>
      `;

      list.appendChild(card);

    }

  }


  // ==========================================
  // AKTIF / NONAKTIF
  // ==========================================

  async function toggleCashier(
    cashierId,
    currentStatus
  ) {

    const newStatus = !currentStatus;


    const { error } =
      await supabaseClient
        .from("cashier_settings")
        .update({
          is_active: newStatus,
          updated_at: new Date().toISOString()
        })
        .eq("id", cashierId);


    if (error) {

      showMessage(
        "Gagal mengubah status kasir."
      );

      console.error(error);

      return;
    }


    showMessage(
      newStatus
        ? "Kasir diaktifkan."
        : "Kasir dinonaktifkan.",
      true
    );


    loadCashiers();

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    const div =
      document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

  }


  // ==========================================
  // MULAI
  // ==========================================

  (async function() {

    const isOwner =
      await checkOwner();

    if (isOwner) {
      loadCashiers();
    }

  })();

</script>

</body>
</html>
