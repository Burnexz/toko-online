<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelola Kategori - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      font-size: 24px;
    }

    .add-button {
      border: none;
      background: #111827;
      color: white;
      padding: 12px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-box {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .form-box.active {
      display: block;
    }

    .form-box h3 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
    }

    .save-button,
    .cancel-button {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-button {
      background: #111827;
      color: white;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #111827;
    }

    .category-list {
      display: grid;
      gap: 12px;
    }

    .category-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .category-name {
      font-size: 17px;
      font-weight: bold;
    }

    .delete-button {
      border: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      margin-bottom: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>ZOKENT STORE</h1>
  <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main class="container">

  <div class="top">
    <h2>Kategori</h2>

    <button
      class="add-button"
      onclick="showForm()">
      + Tambah Kategori
    </button>
  </div>

  <div id="message" class="message"></div>

  <section id="formBox" class="form-box">

    <h3>Tambah Kategori</h3>

    <form id="categoryForm">

      <label for="categoryName">
        Nama Kategori
      </label>

      <input
        type="text"
        id="categoryName"
        placeholder="Contoh: Minuman"
        required
      >

      <div class="form-actions">

        <button
          type="submit"
          class="save-button"
          id="saveButton">
          Simpan
        </button>

        <button
          type="button"
          class="cancel-button"
          onclick="hideForm()">
          Batal
        </button>

      </div>

    </form>

  </section>

  <section id="categoryList">
    <div class="loading">
      Memuat kategori...
    </div>
  </section>

</main>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ==========================================
  // CEK PEMILIK
  // ==========================================

  async function checkOwner() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "admin.html";
      return false;
    }

    const { data: profile, error } =
      await supabaseClient
        .from("profiles")
        .select("role, is_active")
        .eq("id", user.id)
        .single();

    if (
      error ||
      !profile ||
      profile.role !== "owner" ||
      profile.is_active !== true
    ) {

      await supabaseClient.auth.signOut();

      window.location.href = "admin.html";

      return false;
    }

    return true;
  }


  // ==========================================
  // FORM
  // ==========================================

  function showForm() {

    document
      .getElementById("formBox")
      .classList.add("active");

    document
      .getElementById("categoryName")
      .focus();
  }


  function hideForm() {

    document
      .getElementById("formBox")
      .classList.remove("active");

    document
      .getElementById("categoryForm")
      .reset();
  }


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text, success = false) {

    const element =
      document.getElementById("message");

    element.textContent = text;

    element.style.color =
      success ? "green" : "red";
  }


  // ==========================================
  // LOAD KATEGORI
  // ==========================================

  async function loadCategories() {

    const list =
      document.getElementById("categoryList");

    list.innerHTML =
      '<div class="loading">Memuat kategori...</div>';


    const { data, error } =
      await supabaseClient
        .from("categories")
        .select("*")
        .order("name", {
          ascending: true
        });


    if (error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">Gagal memuat kategori.</div>';

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">Belum ada kategori.</div>';

      return;
    }


    list.innerHTML = "";


    data.forEach(category => {

      const card =
        document.createElement("div");

      card.className = "category-card";

      card.innerHTML = `
        <div class="category-name">
          ${escapeHtml(category.name)}
        </div>

        <button
          class="delete-button"
          onclick="deleteCategory('${category.id}')">
          Hapus
        </button>
      `;

      list.appendChild(card);

    });

  }


  // ==========================================
  // TAMBAH KATEGORI
  // ==========================================

  document
    .getElementById("categoryForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const name =
        document
          .getElementById("categoryName")
          .value
          .trim();


      if (!name) {
        return;
      }


      const saveButton =
        document.getElementById("saveButton");

      saveButton.disabled = true;
      saveButton.textContent = "Menyimpan...";


      const { error } =
        await supabaseClient
          .from("categories")
          .insert({
            name: name
          });


      if (error) {

        console.error(error);

        showMessage(
          "Kategori gagal ditambahkan."
        );

      } else {

        showMessage(
          "Kategori berhasil ditambahkan.",
          true
        );

        hideForm();

        loadCategories();

      }


      saveButton.disabled = false;
      saveButton.textContent = "Simpan";

    });


  // ==========================================
  // HAPUS KATEGORI
  // ==========================================

  async function deleteCategory(id) {

    const yakin =
      confirm(
        "Yakin ingin menghapus kategori ini?"
      );

    if (!yakin) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("categories")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      showMessage(
        "Kategori gagal dihapus."
      );

      return;
    }


    showMessage(
      "Kategori berhasil dihapus.",
      true
    );

    loadCategories();

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    const div =
      document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
  }


  // ==========================================
  // MULAI
  // ==========================================

  (async function() {

    const isOwner =
      await checkOwner();

    if (isOwner) {
      loadCategories();
    }

  })();

</script>

</body>
</html>
