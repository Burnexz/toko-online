<!DOCTYPE html>
<html lang="id" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZOKENT GROUP SYSTEMS | TERMINAL PORTAL AMAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Kunci Layar Pas 1 Screen Tanpa Scroll */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden !important;
      position: fixed;
      touch-action: none;
      background-color: #030712;
      font-family: 'ui-monospace', SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #38bdf8;
    }

    /* Canvas Matrix Background (Fullscreen) */
    #matrix-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Teks Glow Cyber */
    .glow-green-text {
      color: #34d399;
      text-shadow: 0 0 15px rgba(52, 211, 153, 0.7);
    }

    .glow-box {
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.2);
    }

    /* Card Kaca Transparan Tanpa Garis Kaku */
    .glass-card-clean {
      background-color: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Input Transparan dengan Padding Lega */
    .hacker-input {
      background-color: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #4ade80;
      text-shadow: 0 0 5px rgba(74, 222, 128, 0.5);
      transition: all 0.25s ease-in-out;
    }

    .hacker-input::placeholder {
      color: rgba(52, 211, 153, 0.45);
    }

    .hacker-input:focus {
      outline: none;
      border-color: #34d399;
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* Tombol Tab Seamless (Tanpa Garis Pembatas) */
    .tab-btn {
      transition: all 0.25s ease;
      color: #9ca3af;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .tab-btn.active {
      background-color: rgba(0, 0, 0, 0.75);
      color: #34d399;
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
    }
  </style>
</head>
<body class="h-full w-full flex items-center justify-center p-4">

  <!-- Matrix Rain Canvas Background -->
  <canvas id="matrix-bg"></canvas>

  <!-- Container Utama (Fit Pas 1 Layar) -->
  <div class="relative z-10 w-full max-w-xl my-auto">
    
    <!-- CARD TRANSPARAN UTAMA (SEAMLESS / TANPA PEMBATAS KAKU) -->
    <div class="glass-card-clean rounded-3xl p-6 sm:p-9 glow-box w-full">
      
      <!-- HEADER BRANDING -->
      <div class="text-center mb-6 sm:mb-8">
        <div class="inline-block p-3 mb-2 rounded-2xl bg-black/40 text-4xl sm:text-5xl">
          🏪
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold glow-green-text tracking-wider">
          <span class="text-white">&gt;_</span> ZOKENT GROUP
        </h1>
        <p class="text-xs sm:text-sm text-cyan-400 font-bold mt-1.5 tracking-widest uppercase">
          PORTAL MASUK SISTEM TOKO
        </p>
      </div>

      <!-- TAB PILIHAN PERAN (PEMILIK / KASIR) -->
      <div class="grid grid-cols-2 gap-2 bg-black/30 p-1.5 rounded-2xl mb-6">
        <button 
          type="button" 
          id="tab-pemilik" 
          class="tab-btn active py-3 text-xs sm:text-sm font-extrabold rounded-xl flex items-center justify-center gap-2 active:scale-95"
        >
          <span>👑</span> Login Pemilik
        </button>
        <button 
          type="button" 
          id="tab-kasir" 
          class="tab-btn py-3 text-xs sm:text-sm font-extrabold rounded-xl flex items-center justify-center gap-2 active:scale-95"
        >
          <span>🛒</span> Login Kasir
        </button>
      </div>

      <!-- JUDUL FORM -->
      <div class="mb-5 text-center sm:text-left">
        <h2 id="login-title" class="text-xl sm:text-2xl font-extrabold glow-green-text">Login Pemilik</h2>
        <p id="login-subtitle" class="text-xs sm:text-sm text-gray-300 mt-1">
          Masuk untuk mengatur dan mengontrol seluruh toko online.
        </p>
      </div>

      <!-- FORM LOGIN -->
      <form id="login-form" class="space-y-4 sm:space-y-5">
        <!-- EMAIL (DENGAN PADDING LEGA) -->
        <div>
          <label for="email" class="block text-xs font-bold text-gray-200 mb-2 uppercase tracking-wider pl-1">Email Akses</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan email pengguna"
            autocomplete="email"
            required
            class="hacker-input w-full px-6 py-3.5 sm:py-4 rounded-xl text-sm"
          >
        </div>

        <!-- PASSWORD (DENGAN PADDING LEGA) -->
        <div>
          <label for="password" class="block text-xs font-bold text-gray-200 mb-2 uppercase tracking-wider pl-1">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
              class="hacker-input w-full px-6 py-3.5 sm:py-4 pr-14 rounded-xl text-sm"
            >
            <button
              type="button"
              id="btn-show-password"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-emerald-400 p-1 text-base transition-colors"
              title="Lihat Password"
            >
              👁
            </button>
          </div>
        </div>

        <!-- PESAN ERROR -->
        <div id="error-message" class="hidden bg-red-950/80 border border-red-500/50 text-red-200 text-xs rounded-xl p-3.5 backdrop-blur-md"></div>

        <!-- PESAN BERHASIL -->
        <div id="success-message" class="hidden bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 text-xs rounded-xl p-3.5 backdrop-blur-md"></div>

        <!-- TOMBOL LOGIN -->
        <button
          type="submit"
          id="btn-login"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-sm py-4 rounded-xl transition-all shadow-[0_0_25px_rgba(34,197,94,0.4)] active:scale-[0.98] uppercase tracking-wider mt-2"
        >
          🔐 Login Pemilik
        </button>
      </form>

      <p id="access-note" class="text-xs text-center text-gray-400 mt-5">
        Akses khusus pemilik / administrator toko.
      </p>

      <!-- FOOTER -->
      <p class="text-center text-[10px] text-gray-500 mt-5 font-mono tracking-widest uppercase">
        © 2026 ZOKENT GROUP SYSTEMS
      </p>
    </div>

  </div>

  <!-- JAVASCRIPT & SUPABASE INTEGRATION -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // MODE STATUS: 'pemilik' atau 'kasir'
    let currentRole = "pemilik";

    const tabPemilik = document.getElementById("tab-pemilik");
    const tabKasir = document.getElementById("tab-kasir");
    const loginTitle = document.getElementById("login-title");
    const loginSubtitle = document.getElementById("login-subtitle");
    const accessNote = document.getElementById("access-note");

    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const btnLogin = document.getElementById("btn-login");
    const btnShowPassword = document.getElementById("btn-show-password");
    const errorMessage = document.getElementById("error-message");
    const successMessage = document.getElementById("success-message");

    // =====================================================
    // EFEK MATRIX DIGITAL RAIN (FULLSCREEN)
    // =====================================================
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    let fontSize = window.innerWidth < 640 ? 12 : 14;
    let columns = 0;
    let rainDrops = [];

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const alphabet = katakana + latin;

    function initMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fontSize = window.innerWidth < 640 ? 12 : 14;
      columns = Math.floor(canvas.width / fontSize);
      rainDrops = Array.from({ length: columns }, () => Math.floor(Math.random() * -50));
    }

    initMatrix();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#10b981'; // Emerald 500
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    }

    setInterval(drawMatrix, 45);

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(initMatrix, 150);
    });

    // =====================================================
    // SWITCH TAB (PEMILIK / KASIR)
    // =====================================================
    tabPemilik.addEventListener("click", () => {
      currentRole = "pemilik";
      tabPemilik.classList.add("active");
      tabKasir.classList.remove("active");
      
      loginTitle.textContent = "Login Pemilik";
      loginSubtitle.textContent = "Masuk untuk mengatur dan mengontrol seluruh toko online.";
      btnLogin.textContent = "🔐 Login Pemilik";
      accessNote.textContent = "Akses khusus pemilik / administrator toko.";
      
      errorMessage.classList.add("hidden");
      successMessage.classList.add("hidden");
    });

    tabKasir.addEventListener("click", () => {
      currentRole = "kasir";
      tabKasir.classList.add("active");
      tabPemilik.classList.remove("active");
      
      loginTitle.textContent = "Login Kasir Toko";
      loginSubtitle.textContent = "Masuk untuk membuka mesin kasir POS dan melayani transaksi.";
      btnLogin.textContent = "🛒 Login Kasir";
      accessNote.textContent = "Akses khusus petugas kasir toko.";

      errorMessage.classList.add("hidden");
      successMessage.classList.add("hidden");
    });

    // =====================================================
    // INPUT HIGHLIGHT & TOGGLE PASSWORD
    // =====================================================
    function updateInputStyle(input) {
      if (input.value.trim().length > 0) {
        input.classList.add("border-emerald-500");
      } else {
        input.classList.remove("border-emerald-500");
      }
    }

    emailInput.addEventListener("input", () => updateInputStyle(emailInput));
    passwordInput.addEventListener("input", () => updateInputStyle(passwordInput));

    btnShowPassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      btnShowPassword.textContent = isPassword ? "🙈" : "👁";
    });

    function tampilkanError(pesan) {
      errorMessage.textContent = `⚠️ ${pesan}`;
      errorMessage.classList.remove("hidden");
      successMessage.classList.add("hidden");
    }

    function tampilkanSukses(pesan) {
      successMessage.textContent = `✅ ${pesan}`;
      successMessage.classList.remove("hidden");
      errorMessage.classList.add("hidden");
    }

    // =====================================================
    // SUBMIT LOGIN HANDLER
    // =====================================================
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      btnLogin.disabled = true;
      btnLogin.textContent = "⏳ Memeriksa Akun...";
      errorMessage.classList.add("hidden");

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          tampilkanError("Email atau password salah.");
          btnLogin.disabled = false;
          btnLogin.textContent = currentRole === "pemilik" ? "🔐 Login Pemilik" : "🛒 Login Kasir";
          return;
        }

        const targetPage = currentRole === "pemilik" ? "admin.html" : "kasir.html";
        tampilkanSukses(`Login ${currentRole} berhasil! Mengalihkan...`);
        
        setTimeout(() => {
          window.location.href = targetPage;
        }, 800);

      } catch (err) {
        tampilkanError("Terjadi kesalahan koneksi ke server.");
        btnLogin.disabled = false;
        btnLogin.textContent = currentRole === "pemilik" ? "🔐 Login Pemilik" : "🛒 Login Kasir";
      }
    });

    // Auto Check Session Existing
    async function cekLogin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = currentRole === "pemilik" ? "admin.html" : "kasir.html";
      }
    }

    cekLogin();
  </script>
</body>
</html>
