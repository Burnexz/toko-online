<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Pemilik - Zokent Group</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- LOGO / JUDUL -->
    <div class="text-center mb-6">
      <div class="text-5xl mb-3">🏪</div>

      <h1 class="text-2xl font-extrabold text-slate-900">
        ZOKENT GROUP
      </h1>

      <p class="text-sm text-slate-500 mt-1">
        Dashboard Pemilik
      </p>
    </div>


    <!-- LOGIN CARD -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-6">

      <div class="mb-6">
        <h2 class="text-lg font-extrabold text-slate-900">
          Login Pemilik
        </h2>

        <p class="text-xs text-slate-500 mt-1">
          Masuk untuk mengatur dan mengontrol toko online.
        </p>
      </div>


      <!-- EMAIL -->
      <div class="mb-4">

        <label
          for="email"
          class="block text-xs font-bold text-slate-700 mb-1.5"
        >
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email pemilik"
          autocomplete="email"
          class="w-full px-4 py-3 rounded-xl border border-slate-200
                 focus:outline-none focus:ring-2 focus:ring-red-500
                 focus:border-red-500 text-sm"
        >

      </div>


      <!-- PASSWORD -->
      <div class="mb-5">

        <label
          for="password"
          class="block text-xs font-bold text-slate-700 mb-1.5"
        >
          Password
        </label>

        <div class="relative">

          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            class="w-full px-4 py-3 pr-12 rounded-xl border border-slate-200
                   focus:outline-none focus:ring-2 focus:ring-red-500
                   focus:border-red-500 text-sm"
          >

          <button
            type="button"
            id="btn-show-password"
            class="absolute right-3 top-1/2 -translate-y-1/2
                   text-slate-400 text-xs font-bold"
          >
            👁
          </button>

        </div>

      </div>


      <!-- PESAN ERROR -->
      <div
        id="error-message"
        class="hidden mb-4 bg-red-50 border border-red-200
               text-red-700 text-xs rounded-xl px-4 py-3"
      ></div>


      <!-- PESAN BERHASIL -->
      <div
        id="success-message"
        class="hidden mb-4 bg-emerald-50 border border-emerald-200
               text-emerald-700 text-xs rounded-xl px-4 py-3"
      ></div>


      <!-- TOMBOL LOGIN -->
      <button
        type="button"
        id="btn-login"
        class="w-full bg-red-600 hover:bg-red-700
               text-white font-extrabold text-sm
               py-3.5 rounded-xl transition-all
               shadow-md"
      >
        🔐 Login Pemilik
      </button>


      <p class="text-[10px] text-center text-slate-400 mt-5">
        Akses ini khusus pemilik / administrator toko.
      </p>

    </div>


    <!-- FOOTER -->
    <p class="text-center text-[10px] text-slate-400 mt-6">
      © 2026 Zokent Group
    </p>

  </div>


  <!-- SUPABASE -->
  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // =====================================================
    // ELEMENT
    // =====================================================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const btnLogin =
      document.getElementById("btn-login");

    const btnShowPassword =
      document.getElementById("btn-show-password");

    const errorMessage =
      document.getElementById("error-message");

    const successMessage =
      document.getElementById("success-message");


    // =====================================================
    // SHOW / HIDE PASSWORD
    // =====================================================

    btnShowPassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        btnShowPassword.textContent = "🙈";

      } else {

        passwordInput.type = "password";

        btnShowPassword.textContent = "👁";

      }

    });


    // =====================================================
    // FUNGSI PESAN
    // =====================================================

    function tampilkanError(pesan) {

      errorMessage.textContent = pesan;

      errorMessage.classList.remove("hidden");

      successMessage.classList.add("hidden");

    }


    function tampilkanSukses(pesan) {

      successMessage.textContent = pesan;

      successMessage.classList.remove("hidden");

      errorMessage.classList.add("hidden");

    }


    // =====================================================
    // LOGIN
    // =====================================================

    async function loginPemilik() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      // Cek input

      if (!email) {

        tampilkanError(
          "Email pemilik belum diisi."
        );

        emailInput.focus();

        return;

      }


      if (!password) {

        tampilkanError(
          "Password belum diisi."
        );

        passwordInput.focus();

        return;

      }


      // Loading

      btnLogin.disabled = true;

      btnLogin.textContent =
        "⏳ Memeriksa akun...";


      errorMessage.classList.add("hidden");


      try {

        const { data, error } =
          await supabase.auth.signInWithPassword({

            email: email,

            password: password

          });


        // Jika Supabase mengembalikan error

        if (error) {

          console.error(error);

          tampilkanError(
            "Email atau password salah."
          );

          btnLogin.disabled = false;

          btnLogin.textContent =
            "🔐 Login Pemilik";

          return;

        }


        // Login berhasil

        console.log(
          "Login berhasil:",
          data.user
        );


        tampilkanSukses(
          "Login berhasil. Membuka Dashboard Pemilik..."
        );


        // Tunggu sebentar lalu masuk dashboard

        setTimeout(() => {

          window.location.href =
            "admin.html";

        }, 800);


      } catch (err) {

        console.error(err);

        tampilkanError(
          "Terjadi kesalahan saat menghubungkan ke server."
        );


        btnLogin.disabled = false;

        btnLogin.textContent =
          "🔐 Login Pemilik";

      }

    }


    // =====================================================
    // TOMBOL LOGIN
    // =====================================================

    btnLogin.addEventListener(
      "click",
      loginPemilik
    );


    // =====================================================
    // ENTER UNTUK LOGIN
    // =====================================================

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          loginPemilik();

        }

      }
    );


    // =====================================================
    // CEK JIKA SUDAH LOGIN
    // =====================================================

    async function cekLogin() {

      const {
        data: {
          session
        }
      } = await supabase.auth.getSession();


      if (session) {

        // Kalau sudah login,
        // langsung ke dashboard

        window.location.href =
          "dashboard.html";

      }

    }


    cekLogin();

  </script>

</body>
</html>
