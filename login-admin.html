<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOKENT GROUP SYSTEMS | AKSES PORTAL AMAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Styling Dasar Kustom */
    body {
      background-color: black;
      font-family: 'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #38bdf8; /* Cyan */
      margin: 0;
      overflow: hidden; /* Mencegah scrollbar */
    }

    /* Efek Tulisan Berjalan Matrix (Canvas) */
    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Latar belakang */
    }

    /* Penyesuaian Card Login */
    #login-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 440px;
      z-index: 10; /* Di atas canvas */
    }

    /* Styling Teks Hacker Hijau Menyala */
    .glow-green {
      color: #34d399; /* Emerald */
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
    }

    /* Input Hacker */
    .hacker-input {
      background-color: rgba(38, 38, 38, 0.8);
      border: 1px solid #737373; /* Neutral 700 */
      color: #4ade80; /* Green 400 */
      transition: all 0.3s ease;
    }
    
    .hacker-input:focus {
      outline: none;
      border-color: #34d399; /* Emerald */
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
    }
    
    /* Tombol Peran (Tabs) */
    .peran-btn {
      color: #a3a3a3; /* Neutral 400 */
      transition: all 0.3s;
    }
    
    .peran-btn.active {
      color: #4ade80; /* Green 400 */
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    }
    
    .peran-btn:hover:not(.active) {
      color: #d4d4d4; /* Neutral 300 */
    }

  </style>
</head>
<body class="min-h-screen">

  <canvas id="matrix-bg"></canvas>

  <div id="login-container" class="px-4">
    
    <div class="text-center mb-8">
      <div class="text-3xl font-extrabold glow-green mb-1">
        <span class="text-white">&gt;_ </span>ZOKENT GRP
      </div>
      <p class="text-base text-cyan-400 font-bold">AKSES SISTEM TOKO</p>
      <p class="text-[10px] text-neutral-500 mt-1 uppercase tracking-wider">[ MODE: TERMINAL_AUTH_V3 ]</p>
    </div>

    <div class="bg-black/80 rounded-3xl p-6 border-2 border-emerald-500/50 shadow-[0_0_20px_rgba(34,197,94,0.5)]">
      
      <div class="flex bg-neutral-900 p-1.5 rounded-2xl mb-7 border border-emerald-500/30">
        <button 
          type="button" 
          id="tab-pemilik" 
          class="peran-btn flex-1 py-2.5 text-xs font-extrabold rounded-xl bg-black border- emerald-500/50 peran-btn active shadow-sm"
        >
          &gt;_ PEMILIK [ADMIN]
        </button>
        <button 
          type="button" 
          id="tab-kasir" 
          class="peran-btn flex-1 py-2.5 text-xs font-extrabold rounded-xl"
        >
          # KASIR [POS]
        </button>
      </div>

      <div class="mb-7">
        <h2 id="login-title" class="text-xl font-extrabold glow-green">Otentikasi Akun</h2>
        <p id="login-subtitle" class="text-xs text-neutral-400 mt-1.5">Sistem memverifikasi otentikasi peran.</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-bold text-neutral-300">USER_ID (EMAIL):</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan ID pengguna..."
            autocomplete="email"
            required
            class="hacker-input w-full px-4 py-3 rounded-xl border border-neutral-700 text-sm"
          >
        </div>

        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-bold text-neutral-300">AKSES_KEY (PASSWORD):</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Masukkan kunci akses..."
              autocomplete="current-password"
              required
              class="hacker-input w-full px-4 py-3 pr-12 rounded-xl border border-neutral-700 text-sm"
            >
            <button
              type="button"
              id="btn-show-password"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-500 text-xs font-bold hover:text-cyan-400"
            >
              👁
            </button>
          </div>
        </div>

        <div id="error-message" class="hidden mb-4 bg-red-900/50 border border-red-500 text-red-200 text-xs rounded-xl px-4 py-3.5 shadow-[0_0_10px_rgba(239,68,68,0.3)]"></div>

        <div id="success-message" class="hidden mb-4 bg-emerald-900/50 border border-emerald-500 text-emerald-200 text-xs rounded-xl px-4 py-3.5 shadow-[0_0_10px_rgba(34,197,94,0.3)]"></div>

        <button
          type="submit"
          id="btn-login"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-black font-extrabold text-sm py-4 rounded-xl transition-all shadow-[0_0_15px_rgba(34,197,94,0.5)] active:scale-[0.99] uppercase tracking-wider"
        >
          [ LOGIN SEBAGAI PEMILIK ]
        </button>
      </form>

      <p id="access-note" class="text-[10px] text-center text-neutral-400 mt-6 uppercase tracking-wider">Hanya untuk personel berwenang. Semua aktivitas dipantau.</p>
    </div>

    <p class="text-center text-[11px] text-neutral-500 mt-8 font-extrabold uppercase">© 2026 ZOKENT_GRP - KEAMANAN SISTEM DIPERCEPAT</p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // --- SETUP SUPABASE ---
    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- SETUP CANVAS MATRIX EFFECT ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Set Karakter
    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const numsPlus = '24567'; // Angka favorit
    const special = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    const alphabet = katakana + latin + numbers + special + numsPlus;
    
    // Konfigurasi Hujan
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const rainDrops = [];

    // Inisialisasi Posisi Awal Hujan
    for ( let i = 0; i < columns; i++ ) {
      rainDrops[ i ] = 1;
    }

    // Fungsi Render Hujan
    const drawMatrix = () => {
      // Background Semi-Transparent (untuk efek jejak)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Teks Hijau
      ctx.fillStyle = '#15803d'; /* Green 700 */
      ctx.font = fontSize + 'px monospace';

      for ( let i = 0; i < rainDrops.length; i++ ) {
        // Ambil karakter acak
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        
        // Tampilkan teks di koordinat
        ctx.fillText(text, i * fontSize, rainDrops[ i ] * fontSize);

        // Reset hujan jika sudah sampai bawah
        if ( rainDrops[ i ] * fontSize > canvas.height && Math.random() > 0.98 ) {
          rainDrops[ i ] = 0;
        }
        rainDrops[ i ]++;
      }
    };

    // Jalankan Animasi
    setInterval(drawMatrix, 45); // Kecepatan hujan

    // Sesuaikan Canvas saat Window di-resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      rainDrops.length = 0; // Hapus data lama
      for ( let i = 0; i < canvas.width / fontSize; i++ ) {
        rainDrops[ i ] = 1;
      }
    });

    // --- AKSES VARIABEL UI ---
    let currentRole = "pemilik";

    const tabPemilik = document.getElementById("tab-pemilik");
    const tabKasir = document.getElementById("tab-kasir");
    const loginTitle = document.getElementById("login-title");
    const loginSubtitle = document.getElementById("login-subtitle");
    const accessNote = document.getElementById("access-note");

    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const btnLogin = document.getElementById("btn-login");
    const btnShowPassword = document.getElementById("btn-show-password");
    const errorMessage = document.getElementById("error-message");
    const successMessage = document.getElementById("success-message");

    // =====================================================
    // SWITCH TAB PERAN (PEMILIK / KASIR)
    // =====================================================
    tabPemilik.addEventListener("click", () => {
      currentRole = "pemilik";
      tabPemilik.className = "peran-btn flex-1 py-2.5 text-xs font-extrabold rounded-xl bg-black border-emerald-500/50 active shadow-sm";
      tabKasir.className = "peran-btn flex-1 py-2.5 text-xs font-extrabold rounded-xl";
      
      loginTitle.textContent = "Otentikasi Akun";
      loginSubtitle.textContent = "Sistem memverifikasi otentikasi peran.";
      btnLogin.textContent = "[ LOGIN SEBAGAI PEMILIK ]";
    });

    tabKasir.addEventListener("click", () => {
      currentRole = "kasir";
      tabKasir.className = "peran-btn flex-1 py-2.5 text-xs font-extrabold rounded-xl bg-black border-emerald-500/50 active shadow-sm";
      tabPemilik.className = "peran-btn flex-1 py-2.5 text-xs font-extrabold rounded-xl";
      
      loginTitle.textContent = "Akses Kasir Toko";
      loginSubtitle.textContent = "Sistem membuka gerbang POS transaksi.";
      btnLogin.textContent = "[ MASUK SEBAGAI KASIR ]";
    });

    // =====================================================
    // WARNA BORDER DINAMIS
    // =====================================================
    function updateInputStyle(input) {
      if (input.value.trim().length > 0) {
        input.classList.remove("border-neutral-700", "border-red-500");
        input.classList.add("border-emerald-500");
      } else {
        input.classList.remove("border-emerald-500");
        input.classList.add("border-neutral-700");
      }
    }

    emailInput.addEventListener("input", () => updateInputStyle(emailInput));
    passwordInput.addEventListener("input", () => updateInputStyle(passwordInput));

    // Toggle Tampilkan Password
    btnShowPassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      btnShowPassword.textContent = isPassword ? "🙈" : "👁";
    });

    function tampilkanError(pesan) {
      errorMessage.textContent = `[! ERROR]: ${pesan}`;
      errorMessage.classList.remove("hidden");
      successMessage.classList.add("hidden");
    }

    function tampilkanSukses(pesan) {
      successMessage.textContent = `[✔ SUCCESS]: ${pesan}`;
      successMessage.classList.remove("hidden");
      errorMessage.classList.add("hidden");
    }

    // =====================================================
    // SUBMIT LOGIN HANDLER (WITH ROLE VALIDATION)
    // =====================================================
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      btnLogin.disabled = true;
      btnLogin.textContent = "⏳ Memeriksa integritas akun...";
      errorMessage.classList.add("hidden");

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          tampilkanError("ID pengguna atau kunci akses salah.");
          resetButtonState();
          return;
        }

        // AMBIL ROLE USER (Pastikan diatur via Supabase Metadata / User Data)
        // Contoh: 'role' disimpan di data.user.user_metadata.role
        const userRole = data.user?.user_metadata?.role || "kasir";

        // VALIDASI HAK AKSES PERAN
        if (userRole !== currentRole) {
          // Akses ditolak karena peran tidak sesuai dengan tab yang dipilih
          await supabase.auth.signOut(); // Wajib logout untuk mencegah akses tak sah
          tampilkanError(`Akses ditolak! Akun ini bukan akun ${currentRole.toUpperCase()}.`);
          resetButtonState();
          return;
        }

        const targetPage = currentRole === "pemilik" ? "admin.html" : "kasir.html";
        tampilkanSukses(`Login ${currentRole.toUpperCase()} berhasil! Membuka gerbang...`);
        
        setTimeout(() => {
          window.location.href = targetPage;
        }, 1200);

      } catch (err) {
        tampilkanError("Terjadi kesalahan sistem saat menghubungkan ke server.");
        resetButtonState();
      }
    });

    function resetButtonState() {
      btnLogin.disabled = false;
      btnLogin.textContent = currentRole === "pemilik" ? "[ LOGIN SEBAGAI PEMILIK ]" : "[ MASUK SEBAGAI KASIR ]";
    }

    // =====================================================
    // CEK SESI LOGIN AKTIF SAAT LOAD
    // =====================================================
    async function cekLogin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        // Ambil role user dari metadata sesi
        const role = session.user?.user_metadata?.role || "kasir";
        // Arahkan otomatis ke halaman yang sesuai
        window.location.href = role === "pemilik" ? "admin.html" : "kasir.html";
      }
    }

    cekLogin();
  </script>
</body>
</html>
