<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZOKENT GROUP SYSTEMS | LOGIN PORTAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Global Styles */
    body {
      background-color: #030712; /* Tailwind gray-950 */
      font-family: 'ui-monospace', SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #38bdf8;
    }

    /* Canvas Matrix Background */
    #matrix-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Glow Effects */
    .glow-green-text {
      color: #34d399;
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.6);
    }

    .glow-box {
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.25), inset 0 0 15px rgba(34, 197, 94, 0.1);
    }

    /* Hacker Input Custom Styling */
    .hacker-input {
      background-color: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(55, 65, 81, 0.8);
      color: #4ade80;
      transition: all 0.2s ease-in-out;
    }

    .hacker-input:focus {
      outline: none;
      border-color: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
    }

    /* Tab Buttons Styling */
    .tab-btn {
      transition: all 0.25s ease;
      color: #9ca3af;
    }

    .tab-btn.active {
      background-color: #000000;
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.5);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
    }

    /* Scrollbar Rapi */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #15803d;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 sm:p-6 md:p-8 overflow-y-auto">

  <!-- Matrix Rain Canvas Background -->
  <canvas id="matrix-bg"></canvas>

  <!-- Main Container (Responsif di HP & Desktop) -->
  <div class="relative z-10 w-full max-w-md my-auto">
    
    <!-- HEADER SISTEM -->
    <div class="text-center mb-5 sm:mb-7">
      <div class="inline-block p-2 mb-2 rounded-2xl bg-black/60 border border-emerald-500/30 glow-box">
        <span class="text-3xl sm:text-4xl">🏪</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold glow-green-text tracking-wide">
        <span class="text-white">&gt;_</span> ZOKENT GRP
      </h1>
      <p class="text-xs sm:text-sm text-cyan-400 font-bold mt-1 tracking-wider uppercase">
        PORTAL MASUK SISTEM TOKO
      </p>
      <p class="text-[10px] text-emerald-500/70 font-mono mt-1 tracking-widest uppercase">
        [ MODE: TERMINAL_AUTH_V3.2 ]
      </p>
    </div>

    <!-- LOGIN CARD -->
    <div class="bg-black/85 backdrop-blur-md rounded-2xl sm:rounded-3xl p-5 sm:p-7 border border-emerald-500/40 glow-box transition-all">
      
      <!-- TAB PILIHAN PERAN (PEMILIK / KASIR) -->
      <div class="grid grid-cols-2 gap-1.5 bg-gray-950 p-1.5 rounded-xl sm:rounded-2xl mb-5 sm:mb-6 border border-emerald-500/20">
        <button 
          type="button" 
          id="tab-pemilik" 
          class="tab-btn active py-2.5 sm:py-3 text-xs sm:text-sm font-extrabold rounded-lg sm:rounded-xl flex items-center justify-center gap-1.5 active:scale-95"
        >
          <span>👑</span> Login Pemilik
        </button>
        <button 
          type="button" 
          id="tab-kasir" 
          class="tab-btn py-2.5 sm:py-3 text-xs sm:text-sm font-extrabold rounded-lg sm:rounded-xl flex items-center justify-center gap-1.5 active:scale-95"
        >
          <span>🛒</span> Login Kasir
        </button>
      </div>

      <!-- TITLE & SUBTITLE -->
      <div class="mb-5 sm:mb-6">
        <h2 id="login-title" class="text-lg sm:text-xl font-extrabold glow-green-text">Login Pemilik</h2>
        <p id="login-subtitle" class="text-xs text-gray-400 mt-1 leading-relaxed">Masuk untuk mengatur dan mengontrol seluruh toko online.</p>
      </div>

      <!-- FORM LOGIN -->
      <form id="login-form" class="space-y-4 sm:space-y-5">
        <!-- EMAIL -->
        <div>
          <label for="email" class="block text-xs font-bold text-gray-300 mb-1.5 tracking-wide">Email Akses</label>
          <input
            type="email"
            id="email"
            placeholder="Masukkan email pengguna"
            autocomplete="email"
            required
            class="hacker-input w-full px-3.5 sm:px-4 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm"
          >
        </div>

        <!-- PASSWORD -->
        <div>
          <label for="password" class="block text-xs font-bold text-gray-300 mb-1.5 tracking-wide">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
              class="hacker-input w-full px-3.5 sm:px-4 py-2.5 sm:py-3 pr-10 sm:pr-12 rounded-xl text-xs sm:text-sm"
            >
            <button
              type="button"
              id="btn-show-password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-emerald-400 p-1 text-sm sm:text-base transition-colors"
              title="Lihat Password"
            >
              👁
            </button>
          </div>
        </div>

        <!-- PESAN ERROR -->
        <div id="error-message" class="hidden bg-red-950/80 border border-red-500/80 text-red-300 text-xs rounded-xl p-3 sm:p-3.5 leading-relaxed shadow-lg"></div>

        <!-- PESAN BERHASIL -->
        <div id="success-message" class="hidden bg-emerald-950/80 border border-emerald-500/80 text-emerald-300 text-xs rounded-xl p-3 sm:p-3.5 leading-relaxed shadow-lg"></div>

        <!-- TOMBOL LOGIN -->
        <button
          type="submit"
          id="btn-login"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-xs sm:text-sm py-3.5 sm:py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(34,197,94,0.4)] active:scale-[0.98] uppercase tracking-wider mt-2"
        >
          🔐 Login Pemilik
        </button>
      </form>

      <p id="access-note" class="text-[10px] sm:text-xs text-center text-gray-400 mt-5 leading-relaxed">Akses khusus pemilik / administrator toko.</p>
    </div>

    <!-- FOOTER -->
    <p class="text-center text-[10px] sm:text-xs text-gray-500 mt-6 font-mono tracking-widest uppercase">
      © 2026 ZOKENT GROUP SYSTEMS
    </p>
  </div>

  <!-- JAVASCRIPT & SUPABASE INTEGRATION -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // MODE STATUS: 'pemilik' atau 'kasir'
    let currentRole = "pemilik";

    const tabPemilik = document.getElementById("tab-pemilik");
    const tabKasir = document.getElementById("tab-kasir");
    const loginTitle = document.getElementById("login-title");
    const loginSubtitle = document.getElementById("login-subtitle");
    const accessNote = document.getElementById("access-note");

    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const btnLogin = document.getElementById("btn-login");
    const btnShowPassword = document.getElementById("btn-show-password");
    const errorMessage = document.getElementById("error-message");
    const successMessage = document.getElementById("success-message");

    // =====================================================
    // EFEK MATRIX DIGITAL RAIN (OPTIMAL DI HP & DESKTOP)
    // =====================================================
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    let fontSize = window.innerWidth < 640 ? 12 : 14;
    let columns = 0;
    let rainDrops = [];

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const alphabet = katakana + latin;

    function initMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fontSize = window.innerWidth < 640 ? 12 : 14;
      columns = Math.floor(canvas.width / fontSize);
      rainDrops = Array.from({ length: columns }, () => Math.floor(Math.random() * -50));
    }

    initMatrix();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 18, 0.08)'; // Trail halus
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#10b981'; // Emerald 500
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    }

    setInterval(drawMatrix, 45);

    // Dynamic Window Resize Handler
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(initMatrix, 150);
    });

    // =====================================================
    // SWITCH TAB (PEMILIK / KASIR)
    // =====================================================
    tabPemilik.addEventListener("click", () => {
      currentRole = "pemilik";
      tabPemilik.classList.add("active");
      tabKasir.classList.remove("active");
      
      loginTitle.textContent = "Login Pemilik";
      loginSubtitle.textContent = "Masuk untuk mengatur dan mengontrol seluruh toko online.";
      btnLogin.textContent = "🔐 Login Pemilik";
      accessNote.textContent = "Akses khusus pemilik / administrator toko.";
      
      errorMessage.classList.add("hidden");
      successMessage.classList.add("hidden");
    });

    tabKasir.addEventListener("click", () => {
      currentRole = "kasir";
      tabKasir.classList.add("active");
      tabPemilik.classList.remove("active");
      
      loginTitle.textContent = "Login Kasir Toko";
      loginSubtitle.textContent = "Masuk untuk membuka mesin kasir POS dan melayani transaksi.";
      btnLogin.textContent = "🛒 Login Kasir";
      accessNote.textContent = "Akses khusus petugas kasir toko.";

      errorMessage.classList.add("hidden");
      successMessage.classList.add("hidden");
    });

    // =====================================================
    // INPUT HIGHLIGHT & TOGGLE PASSWORD
    // =====================================================
    function updateInputStyle(input) {
      if (input.value.trim().length > 0) {
        input.classList.add("border-emerald-500");
      } else {
        input.classList.remove("border-emerald-500");
      }
    }

    emailInput.addEventListener("input", () => updateInputStyle(emailInput));
    passwordInput.addEventListener("input", () => updateInputStyle(passwordInput));

    btnShowPassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      btnShowPassword.textContent = isPassword ? "🙈" : "👁";
    });

    function tampilkanError(pesan) {
      errorMessage.textContent = `⚠️ ${pesan}`;
      errorMessage.classList.remove("hidden");
      successMessage.classList.add("hidden");
    }

    function tampilkanSukses(pesan) {
      successMessage.textContent = `✅ ${pesan}`;
      successMessage.classList.remove("hidden");
      errorMessage.classList.add("hidden");
    }

    // =====================================================
    // SUBMIT LOGIN HANDLER
    // =====================================================
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      btnLogin.disabled = true;
      btnLogin.textContent = "⏳ Memeriksa Akun...";
      errorMessage.classList.add("hidden");

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          tampilkanError("Email atau password salah.");
          btnLogin.disabled = false;
          btnLogin.textContent = currentRole === "pemilik" ? "🔐 Login Pemilik" : "🛒 Login Kasir";
          return;
        }

        const targetPage = currentRole === "pemilik" ? "admin.html" : "kasir.html";
        tampilkanSukses(`Login ${currentRole} berhasil! Mengalihkan...`);
        
        setTimeout(() => {
          window.location.href = targetPage;
        }, 800);

      } catch (err) {
        tampilkanError("Terjadi kesalahan koneksi ke server.");
        btnLogin.disabled = false;
        btnLogin.textContent = currentRole === "pemilik" ? "🔐 Login Pemilik" : "🛒 Login Kasir";
      }
    });

    // Auto Check Session Existing
    async function cekLogin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = currentRole === "pemilik" ? "admin.html" : "kasir.html";
      }
    }

    cekLogin();
  </script>
</body>
</html>
