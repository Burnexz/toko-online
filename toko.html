<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZOKENT STORE - Belanja Online</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #222;
      padding-bottom: 80px;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .top-header {
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 12px 15px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #087cf0, #0054b8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: bold;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: #087cf0;
    }

    .logo-subtitle {
      font-size: 10px;
      color: #777;
      margin-top: 2px;
    }

    .cart-button {
      position: relative;
      width: 44px;
      height: 44px;
      border: none;
      background: #f0f6ff;
      border-radius: 13px;
      font-size: 22px;
      cursor: pointer;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 20px;
      background: #ff3b30;
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 45px;
      border: 1px solid #e1e4e8;
      border-radius: 13px;
      background: #f6f7f9;
      padding: 0 15px 0 44px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #087cf0;
      background: white;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 13px;
      font-size: 17px;
      color: #777;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    /* =========================
       BANNER
    ========================= */

    .banner {
      background: linear-gradient(135deg, #087cf0, #003f91);
      min-height: 155px;
      border-radius: 18px;
      color: white;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }

    .banner::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -50px;
      top: -40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
    }

    .banner-content {
      position: relative;
      z-index: 2;
    }

    .banner h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .banner p {
      font-size: 13px;
      opacity: .9;
      max-width: 300px;
      line-height: 1.5;
    }

    .banner-badge {
      margin-top: 12px;
      display: inline-block;
      background: white;
      color: #087cf0;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
    }

    .section-more {
      color: #087cf0;
      font-size: 12px;
      cursor: pointer;
    }

    /* =========================
       CATEGORY
    ========================= */

    .category-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-item {
      min-width: 82px;
      border: none;
      background: white;
      border-radius: 15px;
      padding: 12px 7px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: .2s;
    }

    .category-item.active {
      background: #087cf0;
      color: white;
    }

    .category-icon {
      width: 42px;
      height: 42px;
      margin: auto auto 7px;
      border-radius: 12px;
      background: #edf5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .category-item.active .category-icon {
      background: rgba(255,255,255,0.18);
    }

    .category-name {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       PRODUCT GRID
    ========================= */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .product-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
      min-width: 0;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fafafa;
      display: block;
    }

    .product-info {
      padding: 10px;
    }

    .product-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      min-height: 35px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      margin-top: 7px;
      color: #087cf0;
      font-size: 16px;
      font-weight: 800;
    }

    .product-stock {
      margin-top: 4px;
      font-size: 10px;
      color: #777;
    }

    .stock-empty {
      color: #e53935;
      font-weight: bold;
    }

    .add-button {
      width: 100%;
      border: none;
      background: #087cf0;
      color: white;
      height: 36px;
      border-radius: 10px;
      margin-top: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-button:active {
      transform: scale(.97);
    }

    .add-button.disabled {
      background: #d8d8d8;
      cursor: not-allowed;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #777;
      font-size: 13px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e5e5e5;
      border-top-color: #087cf0;
      border-radius: 50%;
      margin: auto auto 10px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #777;
      grid-column: 1 / -1;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: center;
      z-index: 200;
    }

    .bottom-nav-inner {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-around;
    }

    .nav-item {
      border: none;
      background: transparent;
      color: #777;
      font-size: 10px;
      cursor: pointer;
      width: 25%;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #087cf0;
      font-weight: bold;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 11px 17px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 500;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 600px) {

      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .banner {
        min-height: 190px;
      }

      .banner h1 {
        font-size: 31px;
      }

      .category-item {
        min-width: 105px;
      }
    }

    @media (min-width: 900px) {

      .product-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="top-header">

    <div class="header-inner">

      <div class="brand-row">

        <div class="logo">

          <div class="logo-icon">
            Z
          </div>

          <div>
            <div class="logo-text">
              ZOKENT STORE
            </div>

            <div class="logo-subtitle">
              Belanja mudah • Cepat • Terpercaya
            </div>
          </div>

        </div>

        <button class="cart-button" onclick="goToCheckout()">

          🛒

          <span class="cart-count" id="cartCount">
            0
          </span>

        </button>

      </div>

      <div class="search-box">

        <span class="search-icon">
          🔍
        </span>

        <input
          type="search"
          id="searchInput"
          placeholder="Cari produk di ZOKENT STORE..."
          autocomplete="off"
        >

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- BANNER -->

    <section class="banner">

      <div class="banner-content">

        <h1>
          Belanja Lebih Mudah
        </h1>

        <p>
          Temukan kebutuhan sehari-hari kamu di ZOKENT STORE.
          Pilih produk, masukkan keranjang, lalu pesan.
        </p>

        <span class="banner-badge">
          🛍️ Belanja Sekarang
        </span>

      </div>

    </section>


    <!-- CATEGORY -->

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          Kategori
        </div>

        <div
          class="section-more"
          onclick="selectCategory('all')"
        >
          Lihat Semua
        </div>

      </div>

      <div
        class="category-scroll"
        id="categoryList"
      >

        <button
          class="category-item active"
          data-category="all"
          onclick="selectCategory('all')"
        >

          <div class="category-icon">
            🛍️
          </div>

          <div class="category-name">
            Semua
          </div>

        </button>

      </div>

    </section>


    <!-- PRODUCT -->

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          Produk Tersedia
        </div>

        <div
          class="section-more"
          id="productCount"
        >
          Memuat...
        </div>

      </div>


      <div
        id="productContainer"
        class="product-grid"
      >

        <div class="loading">

          <div class="spinner"></div>

          Memuat produk...

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <div class="bottom-nav-inner">

      <button
        class="nav-item active"
        onclick="window.scrollTo({top:0, behavior:'smooth'})"
      >

        <span class="nav-icon">
          🏠
        </span>

        Beranda

      </button>


      <button
        class="nav-item"
        onclick="selectCategory('all')"
      >

        <span class="nav-icon">
          🗂️
        </span>

        Kategori

      </button>


      <button
        class="nav-item"
        onclick="document.getElementById('searchInput').focus()"
      >

        <span class="nav-icon">
          🔍
        </span>

        Cari

      </button>


      <button
        class="nav-item"
        onclick="goToCheckout()"
      >

        <span class="nav-icon">
          🛒
        </span>

        Keranjang

      </button>

    </div>

  </nav>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  >
  </div>


<script>

/* =====================================================
   1. SUPABASE
   =====================================================

   GANTI 2 BAGIAN INI DENGAN DATA SUPABASE MILIKMU.

   JANGAN MASUKKAN SERVICE_ROLE KEY.
   GUNAKAN ANON / PUBLIC KEY.
===================================================== */

const SUPABASE_URL =
  "https://weuousmvkxmgmsnwiuad.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   2. DATA APLIKASI
===================================================== */

let allProducts = [];
let allCategories = [];

let selectedCategory = "all";

let cart = JSON.parse(
  localStorage.getItem("zokent_cart") || "[]"
);


/* =====================================================
   3. FORMAT RUPIAH
===================================================== */

function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(number || 0);

}


/* =====================================================
   4. LOAD DATA
===================================================== */

async function loadStoreData() {

  showLoading();

  try {

    /*
      PRODUK DARI DATABASE ADMIN

      Filter ini mengikuti RLS dan pengaturan admin:
      is_active
      show_in_catalog
      stok
    */

    const {
      data: products,
      error: productError
    } = await supabaseClient

      .from("products")

      .select(`
        id,
        name,
        catalog_name,
        sku,
        description,
        selling_price,
        image_url,
        is_active,
        show_in_catalog,
        show_when_out_of_stock,
        stock_quantity,
        category
      `)

      .eq("is_active", true)

      .eq("show_in_catalog", true)

      .order("created_at", {
        ascending: false
      });


    if (productError) {
      throw productError;
    }


    /*
      KATEGORI DARI DATABASE
    */

    const {
      data: categories,
      error: categoryError
    } = await supabaseClient

      .from("categories")

      .select("*")

      .order("name", {
        ascending: true
      });


    if (categoryError) {

      console.warn(
        "Kategori tidak berhasil dimuat:",
        categoryError
      );

    }


    allProducts = products || [];

    allCategories = categories || [];


    renderCategories();

    renderProducts();

    updateCartCount();


  } catch (error) {

    console.error(error);

    document.getElementById(
      "productContainer"
    ).innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div>
          Produk belum dapat dimuat.
        </div>

        <div style="
          font-size:11px;
          margin-top:8px;
          color:#999;
        ">
          Periksa koneksi Supabase dan RLS.
        </div>

      </div>

    `;

    document.getElementById(
      "productCount"
    ).textContent = "Error";

  }

}


/* =====================================================
   5. KATEGORI
===================================================== */

function renderCategories() {

  const container =
    document.getElementById("categoryList");


  let html = `

    <button
      class="category-item ${selectedCategory === "all" ? "active" : ""}"
      data-category="all"
      onclick="selectCategory('all')"
    >

      <div class="category-icon">
        🛍️
      </div>

      <div class="category-name">
        Semua
      </div>

    </button>

  `;


  allCategories.forEach(category => {

    const icon =
      getCategoryIcon(category.name);


    html += `

      <button
        class="category-item ${
          selectedCategory === String(category.id)
            ? "active"
            : ""
        }"
        data-category="${category.id}"
        onclick="selectCategory('${category.id}')"
      >

        <div class="category-icon">
          ${icon}
        </div>

        <div class="category-name">
          ${escapeHtml(category.name)}
        </div>

      </button>

    `;

  });


  container.innerHTML = html;

}


/* =====================================================
   6. ICON KATEGORI
===================================================== */

function getCategoryIcon(name) {

  const value =
    String(name || "").toLowerCase();


  if (value.includes("sembako"))
    return "🍚";

  if (value.includes("minuman"))
    return "🥤";

  if (value.includes("bumbu"))
    return "🌶️";

  if (
    value.includes("mandi") ||
    value.includes("cuci")
  )
    return "🧴";

  if (value.includes("snack"))
    return "🍪";

  if (value.includes("pulsa"))
    return "📱";

  return "📦";

}


/* =====================================================
   7. PILIH KATEGORI
===================================================== */

function selectCategory(categoryId) {

  selectedCategory =
    String(categoryId);


  renderCategories();

  renderProducts();

  window.scrollTo({
    top: 350,
    behavior: "smooth"
  });

}


/* =====================================================
   8. RENDER PRODUK
===================================================== */

function renderProducts() {

  const container =
    document.getElementById(
      "productContainer"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase()
      .trim();


  let products =
    [...allProducts];


  /* SEARCH */

  if (search) {

    products =
      products.filter(product => {

        const name =
          String(
            product.catalog_name ||
            product.name ||
            ""
          ).toLowerCase();


        const sku =
          String(
            product.sku || ""
          ).toLowerCase();


        const description =
          String(
            product.description || ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          sku.includes(search) ||
          description.includes(search)
        );

      });

  }


  /* CATEGORY */

  if (selectedCategory !== "all") {

    const selected =
      allCategories.find(
        category =>
          String(category.id) ===
          String(selectedCategory)
      );


    if (selected) {

      products =
        products.filter(product => {

          /*
            Bisa menggunakan category
            berbentuk nama.
          */

          return String(
            product.category || ""
          ).toLowerCase() ===
          String(
            selected.name || ""
          ).toLowerCase();

        });

    }

  }


  document.getElementById(
    "productCount"
  ).textContent =
    `${products.length} produk`;


  if (!products.length) {

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🔎
        </div>

        <div>
          Produk tidak ditemukan.
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    products.map(
      product => createProductCard(product)
    ).join("");

}


/* =====================================================
   9. PRODUCT CARD
===================================================== */

function createProductCard(product) {

  const name =
    product.catalog_name ||
    product.name ||
    "Produk";


  const price =
    Number(
      product.selling_price || 0
    );


  const stock =
    Number(
      product.stock_quantity || 0
    );


  const outOfStock =
    stock <= 0;


  const canShowOutOfStock =
    product.show_when_out_of_stock === true;


  const disabled =
    outOfStock &&
    !canShowOutOfStock;


  let image =
    product.image_url;


  if (!image) {

    image =
      "https://placehold.co/500x500?text=ZOKENT";

  }


  let stockText;


  if (outOfStock) {

    stockText =
      `<span class="stock-empty">
        Stok habis
      </span>`;

  } else {

    stockText =
      `Stok ${stock}`;

  }


  return `

    <article class="product-card">

      <img
        class="product-image"
        src="${escapeAttribute(image)}"
        alt="${escapeAttribute(name)}"
        loading="lazy"
        onerror="
          this.src='https://placehold.co/500x500?text=ZOKENT'
        "
      >

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(name)}
        </div>

        <div class="product-price">
          ${formatRupiah(price)}
        </div>

        <div class="product-stock">
          ${stockText}
        </div>

        <button
          class="add-button ${disabled ? "disabled" : ""}"
          ${disabled ? "disabled" : ""}
          onclick="addToCart('${product.id}')"
        >
          ${
            disabled
              ? "Stok Habis"
              : "＋ Keranjang"
          }
        </button>

      </div>

    </article>

  `;

}


/* =====================================================
   10. TAMBAH KERANJANG
===================================================== */

function addToCart(productId) {

  const product =
    allProducts.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if (!product) {

    showToast(
      "Produk tidak ditemukan"
    );

    return;

  }


  const stock =
    Number(
      product.stock_quantity || 0
    );


  if (stock <= 0) {

    showToast(
      "Stok produk habis"
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (existing) {

    if (
      existing.quantity >=
      stock
    ) {

      showToast(
        "Jumlah sudah mencapai stok"
      );

      return;

    }


    existing.quantity++;

  } else {

    cart.push({

      id: product.id,

      name:
        product.catalog_name ||
        product.name,

      price:
        Number(
          product.selling_price || 0
        ),

      image:
        product.image_url || "",

      quantity: 1

    });

  }


  saveCart();

  updateCartCount();

  showToast(
    "✓ Produk masuk keranjang"
  );

}


/* =====================================================
   11. SIMPAN CART
===================================================== */

function saveCart() {

  localStorage.setItem(
    "zokent_cart",
    JSON.stringify(cart)
  );

}


/* =====================================================
   12. JUMLAH CART
===================================================== */

function updateCartCount() {

  const total =
    cart.reduce(
      (sum, item) =>
        sum + Number(item.quantity || 0),
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent = total;

}


/* =====================================================
   13. CHECKOUT
===================================================== */

function goToCheckout() {

  window.location.href =
    "checkout.html";

}


/* =====================================================
   14. SEARCH
===================================================== */

document.getElementById(
  "searchInput"
).addEventListener(
  "input",
  function() {

    renderProducts();

  }
);


/* =====================================================
   15. TOAST
===================================================== */

let toastTimer;


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2000
    );

}


/* =====================================================
   16. LOADING
===================================================== */

function showLoading() {

  document.getElementById(
    "productContainer"
  ).innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Memuat produk...

    </div>

  `;

}


/* =====================================================
   17. KEAMANAN HTML
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* =====================================================
   18. START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCartCount();

    loadStoreData();

  }
);

</script>
