<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZOKENT STORE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   ZOKENT STORE
   CUSTOMER CATALOG
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --blue: #087cf0;
  --blue-dark: #004da8;
  --blue-light: #eaf4ff;
  --text: #10294d;
  --muted: #718096;
  --bg: #f5f8fc;
  --white: #ffffff;
  --green: #18a957;
  --red: #ef3e3e;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 95px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid #e8edf4;
}

.header-inner {
  max-width: 1500px;
  margin: auto;
  padding: 10px 18px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 22px;
}

/* LOGO */

.logo {
  min-width: 255px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-mark {
  width: 78px;
  height: 65px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo-z {
  font-size: 52px;
  font-weight: 1000;
  font-style: italic;
  line-height: 1;
  color: #0794ed;
  -webkit-text-stroke: 2px #07141e;
  text-shadow:
    4px 4px 0 #07141e,
    7px 7px 0 rgba(0,0,0,.18);
  transform: skew(-8deg);
}

.logo-z::after {
  content: "";
  position: absolute;
  width: 68px;
  height: 5px;
  background: #07141e;
  bottom: 4px;
  left: 5px;
  transform: rotate(-7deg);
  border-radius: 50%;
}

.logo-divider {
  width: 3px;
  height: 48px;
  background: #142638;
  border-radius: 3px;
}

.logo-name {
  line-height: 1;
}

.logo-name-main {
  font-size: 25px;
  font-weight: 1000;
  font-style: italic;
  letter-spacing: -1px;
  color: #12253d;
}

.logo-name-store {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 5px;
  color: var(--blue);
  text-align: center;
}

.logo-tagline {
  margin-top: 3px;
  color: #8090a4;
  font-size: 9px;
  letter-spacing: .7px;
}

/* SEARCH */

.search-area {
  flex: 1;
  position: relative;
}

.search-input {
  width: 100%;
  height: 48px;
  border: 1px solid #dfe7f0;
  border-radius: 25px;
  background: #f3f6fa;
  padding: 0 20px 0 50px;
  outline: none;
  font-size: 14px;
  color: #1d3554;
}

.search-input:focus {
  background: #fff;
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(8,124,240,.08);
}

.search-icon {
  position: absolute;
  left: 19px;
  top: 13px;
  font-size: 20px;
  color: #728096;
}

/* HEADER BUTTONS */

.header-actions {
  display: flex;
  gap: 10px;
}

.header-button {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 15px;
  background: var(--blue);
  color: white;
  font-size: 21px;
  cursor: pointer;
  position: relative;
  box-shadow: 0 5px 14px rgba(8,124,240,.2);
}

.header-button:hover {
  transform: translateY(-1px);
}

.cart-badge {
  position: absolute;
  right: -4px;
  top: -5px;
  min-width: 21px;
  height: 21px;
  border-radius: 50%;
  padding: 0 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ff3030;
  color: white;
  font-size: 11px;
  font-weight: bold;
  border: 2px solid white;
}

/* =========================================================
   MAIN
========================================================= */

.main {
  max-width: 1500px;
  margin: auto;
  padding: 15px 18px;
}

/* =========================================================
   BANNER
========================================================= */

.banner {
  min-height: 235px;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at 80% 45%, rgba(80,205,255,.5), transparent 25%),
    linear-gradient(120deg, #003b91, #087cf0 60%, #13a9f5);
  color: white;
  display: flex;
  align-items: center;
  padding: 35px 55px;
  margin-bottom: 25px;
  box-shadow: 0 8px 25px rgba(0,70,150,.15);
}

.banner::before {
  content: "";
  position: absolute;
  width: 430px;
  height: 430px;
  right: 8%;
  top: -180px;
  border: 80px solid rgba(255,255,255,.06);
  border-radius: 50%;
}

.banner::after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  right: -70px;
  bottom: -160px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
}

.banner-content {
  position: relative;
  z-index: 3;
  max-width: 650px;
}

.banner-small {
  font-size: 21px;
  font-weight: bold;
  font-style: italic;
  margin-bottom: 4px;
}

.banner-title {
  font-size: clamp(38px, 5vw, 70px);
  line-height: .95;
  font-weight: 1000;
  font-style: italic;
  letter-spacing: -2px;
  text-shadow: 3px 4px 0 rgba(0,0,0,.18);
}

.banner-description {
  margin-top: 14px;
  font-size: 15px;
  line-height: 1.6;
  opacity: .94;
}

.banner-button {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-top: 18px;
  padding: 12px 20px;
  border: none;
  border-radius: 25px;
  background: white;
  color: #0757b4;
  font-weight: bold;
  cursor: pointer;
}

.banner-logo {
  position: absolute;
  right: 7%;
  z-index: 2;
  text-align: center;
  transform: rotate(-5deg);
}

.banner-logo-z {
  font-size: 100px;
  font-weight: 1000;
  font-style: italic;
  color: #0da8f5;
  -webkit-text-stroke: 4px #06131d;
  text-shadow: 8px 9px 0 #06131d;
}

.banner-logo-store {
  margin-top: -15px;
  font-size: 30px;
  font-weight: 1000;
  color: white;
  -webkit-text-stroke: 1px #06131d;
  text-shadow: 3px 3px 0 #06131d;
}

/* =========================================================
   SECTION HEADER
========================================================= */

.section {
  margin-bottom: 25px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 23px;
  font-weight: 900;
}

.section-title-icon {
  color: var(--blue);
  font-size: 25px;
}

.section-more {
  border: none;
  background: none;
  color: var(--blue);
  font-weight: bold;
  cursor: pointer;
}

/* =========================================================
   CATEGORY
========================================================= */

.category-list {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 12px;
}

.category-card {
  min-height: 105px;
  background: white;
  border: 2px solid transparent;
  border-radius: 15px;
  box-shadow: 0 4px 13px rgba(25,55,90,.06);
  cursor: pointer;
  padding: 12px 8px;
  transition: .2s;
}

.category-card:hover {
  transform: translateY(-2px);
}

.category-card.active {
  background: linear-gradient(135deg,#087cf0,#0070e4);
  color: white;
  box-shadow: 0 7px 18px rgba(8,124,240,.2);
}

.category-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #eaf4ff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto auto 7px;
  font-size: 25px;
}

.category-card.active .category-icon {
  background: rgba(255,255,255,.18);
}

.category-name {
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================================================
   PRODUCTS
========================================================= */

.product-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 13px;
}

.product-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(25,55,90,.07);
  transition: .2s;
  min-width: 0;
}

.product-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(25,55,90,.11);
}

.product-image-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #fbfcfe;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.product-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
  transition: .25s;
}

.product-card:hover .product-image {
  transform: scale(1.04);
}

.product-info {
  padding: 10px;
}

.product-name {
  min-height: 37px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
  color: #172e4e;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.product-price {
  margin-top: 7px;
  color: var(--blue);
  font-size: 16px;
  font-weight: 900;
}

.product-stock {
  margin-top: 5px;
  color: var(--green);
  font-size: 11px;
  font-weight: bold;
}

.product-stock.empty {
  color: var(--red);
}

.add-cart {
  width: 100%;
  height: 35px;
  margin-top: 9px;
  border: none;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.add-cart:hover {
  background: #006de0;
}

.add-cart:disabled {
  background: #d9dee5;
  color: #7d8794;
  cursor: not-allowed;
}

/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading,
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 15px;
  color: var(--muted);
}

.spinner {
  width: 35px;
  height: 35px;
  margin: auto auto 13px;
  border: 4px solid #dfe8f2;
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

/* =========================================================
   CART POPUP
========================================================= */

.cart-popup {
  position: fixed;
  z-index: 1500;
  left: 50%;
  bottom: 72px;
  transform: translate(-50%, 130px);
  width: min(430px, calc(100% - 25px));
  background: rgba(255,255,255,.97);
  border: 1px solid #e4ebf4;
  border-radius: 22px;
  padding: 10px;
  box-shadow: 0 12px 40px rgba(12,43,77,.18);
  opacity: 0;
  pointer-events: none;
  transition: .3s ease;
}

.cart-popup.show {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}

.cart-popup-inner {
  display: flex;
  align-items: center;
  gap: 11px;
}

.cart-popup-icon {
  flex: 0 0 55px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: var(--blue);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.cart-popup-info {
  flex: 1;
  min-width: 0;
}

.cart-popup-items {
  font-size: 15px;
  font-weight: 900;
}

.cart-popup-total {
  margin-top: 3px;
  color: #75849a;
  font-size: 12px;
}

.cart-popup-button {
  border: none;
  background: var(--blue);
  color: white;
  padding: 12px 15px;
  border-radius: 22px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
  position: fixed;
  z-index: 1400;
  left: 0;
  right: 0;
  bottom: 0;
  height: 62px;
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(15px);
  border-top: 1px solid #e3e9f1;
}

.bottom-nav-inner {
  max-width: 600px;
  height: 100%;
  margin: auto;
  display: flex;
  justify-content: space-around;
}

.nav-button {
  width: 25%;
  border: none;
  background: transparent;
  color: #8190a3;
  font-size: 10px;
  cursor: pointer;
}

.nav-icon {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}

.nav-button.active {
  color: var(--blue);
  font-weight: bold;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;
  z-index: 3000;
  left: 50%;
  bottom: 145px;
  transform: translate(-50%, 20px);
  padding: 11px 18px;
  border-radius: 12px;
  background: #152538;
  color: white;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1200px) {

  .product-grid {
    grid-template-columns: repeat(5, 1fr);
  }

  .category-list {
    grid-template-columns: repeat(7, 1fr);
  }

  .banner-logo {
    right: 4%;
  }
}

@media (max-width: 900px) {

  .logo {
    min-width: auto;
  }

  .logo-divider,
  .logo-tagline {
    display: none;
  }

  .logo-name-store {
    letter-spacing: 3px;
  }

  .product-grid {
    grid-template-columns: repeat(4, 1fr);
  }

  .banner {
    padding: 28px;
  }

  .banner-logo {
    opacity: .25;
  }
}

@media (max-width: 650px) {

  body {
    padding-bottom: 90px;
  }

  .header-inner {
    padding: 8px 12px;
  }

  .header-top {
    flex-wrap: wrap;
    gap: 8px;
  }

  .logo {
    flex: 1;
    min-width: 0;
  }

  .logo-mark {
    width: 48px;
    height: 45px;
  }

  .logo-z {
    font-size: 39px;
  }

  .logo-z::after {
    width: 45px;
  }

  .logo-name-main {
    font-size: 18px;
  }

  .logo-name-store {
    font-size: 12px;
    letter-spacing: 3px;
  }

  .header-actions {
    gap: 5px;
  }

  .header-button {
    width: 42px;
    height: 42px;
    border-radius: 12px;
  }

  .search-area {
    order: 3;
    flex-basis: 100%;
  }

  .search-input {
    height: 43px;
  }

  .main {
    padding: 10px 10px;
  }

  .banner {
    min-height: 205px;
    padding: 25px 20px;
    border-radius: 17px;
  }

  .banner-small {
    font-size: 16px;
  }

  .banner-title {
    font-size: 37px;
  }

  .banner-description {
    font-size: 12px;
    max-width: 280px;
  }

  .banner-logo {
    right: -10px;
    opacity: .25;
  }

  .banner-logo-z {
    font-size: 90px;
  }

  .section-title {
    font-size: 18px;
  }

  .category-list {
    display: flex;
    overflow-x: auto;
    gap: 9px;
    padding-bottom: 5px;
    scrollbar-width: none;
  }

  .category-list::-webkit-scrollbar {
    display: none;
  }

  .category-card {
    flex: 0 0 78px;
    min-height: 91px;
    padding: 9px 5px;
  }

  .category-icon {
    width: 43px;
    height: 43px;
    font-size: 20px;
  }

  .category-name {
    font-size: 10px;
  }

  .product-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }

  .product-info {
    padding: 9px;
  }

  .product-name {
    font-size: 12px;
  }

  .product-price {
    font-size: 15px;
  }

  .product-stock {
    font-size: 10px;
  }

  .cart-popup {
    bottom: 70px;
  }

  .cart-popup-button {
    padding: 11px 12px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

  <div class="header-inner">

    <div class="header-top">

      <!-- LOGO -->
      <div class="logo">

        <div class="logo-mark">
          <div class="logo-z">Z</div>
        </div>

        <div class="logo-divider"></div>

        <div class="logo-name">

          <div class="logo-name-main">
            ZOKENT
          </div>

          <div class="logo-name-store">
            STORE
          </div>

          <div class="logo-tagline">
            BELANJA MUDAH • CEPAT • TERPERCAYA
          </div>

        </div>

      </div>


      <!-- SEARCH -->
      <div class="search-area">

        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Cari produk di ZOKENT STORE..."
          autocomplete="off"
        >

      </div>


      <!-- ACTION -->
      <div class="header-actions">

        <button
          class="header-button"
          onclick="showToast('Fitur akun pelanggan belum diperlukan')"
          title="Akun"
        >
          👤
        </button>

        <button
          class="header-button"
          onclick="goToCheckout()"
          title="Keranjang"
        >

          🛒

          <span
            id="cartBadge"
            class="cart-badge"
          >
            0
          </span>

        </button>

      </div>

    </div>

  </div>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


  <!-- BANNER -->

  <section class="banner">

    <div class="banner-content">

      <div class="banner-small">
        Belanja Lebih Mudah
      </div>

      <div class="banner-title">
        ZOKENT STORE
      </div>

      <div class="banner-description">
        Temukan kebutuhan sehari-hari kamu di ZOKENT STORE.
        Pilih produk, masukkan keranjang, lalu pesan.
      </div>

      <button
        class="banner-button"
        onclick="document.getElementById('productSection').scrollIntoView({behavior:'smooth'})"
      >
        🛒 Belanja Sekarang →
      </button>

    </div>


    <div class="banner-logo">

      <div class="banner-logo-z">
        ZOKENT
      </div>

      <div class="banner-logo-store">
        STORE
      </div>

    </div>

  </section>


  <!-- =====================================================
       CATEGORY
  ====================================================== -->

  <section class="section">

    <div class="section-header">

      <div class="section-title">

        <span class="section-title-icon">
          ▦
        </span>

        Kategori

      </div>

      <button
        class="section-more"
        onclick="selectCategory('all')"
      >
        Lihat Semua →
      </button>

    </div>


    <div
      id="categoryList"
      class="category-list"
    >

      <button
        class="category-card active"
        onclick="selectCategory('all')"
      >

        <div class="category-icon">
          🛍️
        </div>

        <div class="category-name">
          Semua
        </div>

      </button>

    </div>

  </section>


  <!-- =====================================================
       PRODUCTS
  ====================================================== -->

  <section
    id="productSection"
    class="section"
  >

    <div class="section-header">

      <div class="section-title">

        <span class="section-title-icon">
          🔥
        </span>

        Produk Tersedia

      </div>

      <div
        id="productCount"
        class="section-more"
      >
        Memuat...
      </div>

    </div>


    <div
      id="productGrid"
      class="product-grid"
    >

      <div class="loading">

        <div class="spinner"></div>

        Memuat produk ZOKENT STORE...

      </div>

    </div>

  </section>

</main>


<!-- =======================================================
     CART POPUP
======================================================= -->

<div
  id="cartPopup"
  class="cart-popup"
>

  <div class="cart-popup-inner">

    <div class="cart-popup-icon">
      🛒
    </div>

    <div class="cart-popup-info">

      <div
        id="cartPopupItems"
        class="cart-popup-items"
      >
        0 item
      </div>

      <div
        id="cartPopupTotal"
        class="cart-popup-total"
      >
        Total: Rp0
      </div>

    </div>

    <button
      class="cart-popup-button"
      onclick="goToCheckout()"
    >
      Lihat Keranjang →
    </button>

  </div>

</div>


<!-- =======================================================
     BOTTOM NAV
======================================================= -->

<nav class="bottom-nav">

  <div class="bottom-nav-inner">

    <button
      class="nav-button active"
      onclick="window.scrollTo({top:0,behavior:'smooth'})"
    >

      <span class="nav-icon">
        🏠
      </span>

      Beranda

    </button>


    <button
      class="nav-button"
      onclick="document.getElementById('categoryList').scrollIntoView({behavior:'smooth'})"
    >

      <span class="nav-icon">
        ▦
      </span>

      Kategori

    </button>


    <button
      class="nav-button"
      onclick="document.getElementById('searchInput').focus()"
    >

      <span class="nav-icon">
        🔍
      </span>

      Cari

    </button>


    <button
      class="nav-button"
      onclick="goToCheckout()"
    >

      <span class="nav-icon">
        🛒
      </span>

      Keranjang

    </button>

  </div>

</nav>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
>
</div>


<script>

/* =========================================================
   1. SUPABASE
   =========================================================

   GANTI HANYA 2 BARIS INI.

   JANGAN GUNAKAN SERVICE_ROLE KEY.
   GUNAKAN ANON / PUBLIC KEY.
========================================================= */

const SUPABASE_URL =
  "https://weuousmvkxmgmsnwiuad.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   2. DATA
========================================================= */

let products = [];
let categories = [];
let productCategoryMap = {};

let selectedCategory = "all";

let cart = JSON.parse(
  localStorage.getItem("zokent_cart") || "[]"
);


/* =========================================================
   3. FORMAT RUPIAH
========================================================= */

function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(Number(value) || 0);

}


/* =========================================================
   4. ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   5. LOAD PRODUCTS
========================================================= */

async function loadProducts() {

  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("products")

      .select(`
        id,
        name,
        catalog_name,
        sku,
        description,
        selling_price,
        image_url,
        is_active,
        show_in_catalog,
        show_when_out_of_stock,
        stock_quantity,
        category,
        created_at
      `)

      .eq("is_active", true)

      .eq("show_in_catalog", true)

      .order("created_at", {
        ascending: false
      });


    if (error) {
      throw error;
    }


    products = data || [];

  } catch (error) {

    console.error(
      "PRODUCT ERROR:",
      error
    );

    products = [];

    showProductError(
      "Produk belum dapat dimuat. Periksa URL Supabase, ANON KEY, dan RLS."
    );

  }

}


/* =========================================================
   6. LOAD CATEGORIES
========================================================= */

async function loadCategories() {

  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("categories")

      .select("*")

      .order("name", {
        ascending: true
      });


    if (error) {
      throw error;
    }


    categories = data || [];

  } catch (error) {

    console.warn(
      "CATEGORY ERROR:",
      error
    );

    categories = [];

  }

}


/* =========================================================
   7. LOAD PRODUCT-CATEGORY RELATION
=========================================================

   Ini menggunakan tabel:

   product_categories
       ↓
   product_id
   category_id

   Jadi kategori yang dibuat admin
   tetap bisa dipakai pelanggan.
========================================================= */

async function loadProductCategories() {

  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("product_categories")

      .select(`
        product_id,
        category_id
      `);


    if (error) {
      throw error;
    }


    productCategoryMap = {};


    (data || []).forEach(row => {

      if (!productCategoryMap[row.product_id]) {

        productCategoryMap[row.product_id] = [];

      }

      productCategoryMap[row.product_id]
        .push(String(row.category_id));

    });


  } catch (error) {

    console.warn(
      "PRODUCT CATEGORY ERROR:",
      error
    );

    productCategoryMap = {};

  }

}


/* =========================================================
   8. LOAD SEMUA DATA
========================================================= */

async function loadStore() {

  showLoading();

  await Promise.all([
    loadProducts(),
    loadCategories(),
    loadProductCategories()
  ]);

  renderCategories();

  renderProducts();

  updateCart();

}


/* =========================================================
   9. CATEGORY ICON
========================================================= */

function categoryIcon(name) {

  const value =
    String(name || "")
      .toLowerCase();

  if (value.includes("sembako"))
    return "🍚";

  if (value.includes("minuman"))
    return "🥤";

  if (value.includes("bumbu"))
    return "🌶️";

  if (
    value.includes("mandi") ||
    value.includes("cuci")
  )
    return "🧴";

  if (value.includes("snack"))
    return "🍪";

  if (value.includes("pulsa"))
    return "📱";

  return "📦";

}


/* =========================================================
   10. RENDER CATEGORY
========================================================= */

function renderCategories() {

  const container =
    document.getElementById(
      "categoryList"
    );


  let html = `

    <button
      class="category-card ${selectedCategory === "all" ? "active" : ""}"
      onclick="selectCategory('all')"
    >

      <div class="category-icon">
        🛍️
      </div>

      <div class="category-name">
        Semua
      </div>

    </button>

  `;


  categories.forEach(category => {

    html += `

      <button
        class="category-card ${
          selectedCategory === String(category.id)
            ? "active"
            : ""
        }"
        onclick="selectCategory('${category.id}')"
      >

        <div class="category-icon">
          ${categoryIcon(category.name)}
        </div>

        <div class="category-name">
          ${escapeHtml(category.name)}
        </div>

      </button>

    `;

  });


  container.innerHTML = html;

}


/* =========================================================
   11. SELECT CATEGORY
========================================================= */

function selectCategory(categoryId) {

  selectedCategory =
    String(categoryId);

  renderCategories();

  renderProducts();

  document
    .getElementById("productSection")
    .scrollIntoView({
      behavior: "smooth"
    });

}


/* =========================================================
   12. GET PRODUCT CATEGORY
========================================================= */

function productBelongsToCategory(
  product,
  categoryId
) {

  /*
    PRIORITAS 1:
    relasi product_categories
  */

  const relations =
    productCategoryMap[product.id] || [];


  if (
    relations.length &&
    relations.includes(String(categoryId))
  ) {

    return true;

  }


  /*
    PRIORITAS 2:
    fallback ke kolom products.category
  */

  const selected =
    categories.find(
      category =>
        String(category.id) ===
        String(categoryId)
    );


  if (!selected) {
    return false;
  }


  return (
    String(product.category || "")
      .toLowerCase()
      ===
    String(selected.name || "")
      .toLowerCase()
  );

}


/* =========================================================
   13. RENDER PRODUCTS
========================================================= */

function renderProducts() {

  const container =
    document.getElementById(
      "productGrid"
    );


  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  let filtered =
    [...products];


  /* SEARCH */

  if (search) {

    filtered =
      filtered.filter(product => {

        const name =
          String(
            product.catalog_name ||
            product.name ||
            ""
          ).toLowerCase();


        const sku =
          String(
            product.sku || ""
          ).toLowerCase();


        const description =
          String(
            product.description || ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          sku.includes(search) ||
          description.includes(search)
        );

      });

  }


  /* CATEGORY */

  if (
    selectedCategory !== "all"
  ) {

    filtered =
      filtered.filter(
        product =>
          productBelongsToCategory(
            product,
            selectedCategory
          )
      );

  }


  document.getElementById(
    "productCount"
  ).textContent =
    `${filtered.length} produk`;


  if (!filtered.length) {

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🔎
        </div>

        <strong>
          Produk tidak ditemukan
        </strong>

        <div style="margin-top:7px;font-size:12px;">
          Coba gunakan kata pencarian lain.
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(createProductCard)
      .join("");

}


/* =========================================================
   14. PRODUCT CARD
========================================================= */

function createProductCard(product) {

  const name =
    product.catalog_name ||
    product.name ||
    "Produk";


  const price =
    Number(
      product.selling_price || 0
    );


  const stock =
    Number(
      product.stock_quantity || 0
    );


  const outOfStock =
    stock <= 0;


  const showOutOfStock =
    product.show_when_out_of_stock === true;


  const image =
    product.image_url ||
    "https://placehold.co/600x600?text=ZOKENT";


  /*
    Produk yang stoknya habis tetapi
    admin memilih show_when_out_of_stock
    tetap boleh ditampilkan.

    Namun tombol beli dinonaktifkan.
  */

  const buttonDisabled =
    outOfStock;


  return `

    <article class="product-card">

      <div class="product-image-wrap">

        <img
          class="product-image"
          src="${escapeHtml(image)}"
          alt="${escapeHtml(name)}"
          loading="lazy"
          onerror="
            this.src='https://placehold.co/600x600?text=ZOKENT'
          "
        >

      </div>


      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(name)}
        </div>


        <div class="product-price">
          ${rupiah(price)}
        </div>


        ${
          outOfStock
            ? `
              <div class="product-stock empty">
                ● Stok habis
              </div>
            `
            : `
              <div class="product-stock">
                ● Stok ${stock}
              </div>
            `
        }


        <button
          class="add-cart"
          ${buttonDisabled ? "disabled" : ""}
          onclick="addToCart('${product.id}')"
        >

          ${
            buttonDisabled
              ? "Stok Habis"
              : "🛒 + Keranjang"
          }

        </button>

      </div>

    </article>

  `;

}


/* =========================================================
   15. ADD TO CART
========================================================= */

function addToCart(productId) {

  const product =
    products.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if (!product) {

    showToast(
      "Produk tidak ditemukan"
    );

    return;

  }


  const stock =
    Number(
      product.stock_quantity || 0
    );


  if (stock <= 0) {

    showToast(
      "Stok produk habis"
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (existing) {

    if (
      existing.quantity >= stock
    ) {

      showToast(
        "Jumlah sudah mencapai stok"
      );

      return;

    }


    existing.quantity++;

  } else {

    cart.push({

      id: product.id,

      name:
        product.catalog_name ||
        product.name,

      price:
        Number(
          product.selling_price || 0
        ),

      image:
        product.image_url || "",

      quantity: 1

    });

  }


  saveCart();

  updateCart();

  showToast(
    "✓ Produk masuk keranjang"
  );

}


/* =========================================================
   16. SAVE CART
========================================================= */

function saveCart() {

  localStorage.setItem(
    "zokent_cart",
    JSON.stringify(cart)
  );

}


/* =========================================================
   17. UPDATE CART
========================================================= */

function updateCart() {

  const itemCount =
    cart.reduce(
      (sum, item) =>
        sum + Number(item.quantity || 0),
      0
    );


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        (
          Number(item.price || 0) *
          Number(item.quantity || 0)
        ),
      0
    );


  /* HEADER BADGE */

  document.getElementById(
    "cartBadge"
  ).textContent =
    itemCount;


  /* POPUP */

  document.getElementById(
    "cartPopupItems"
  ).textContent =
    `${itemCount} item`;


  document.getElementById(
    "cartPopupTotal"
  ).textContent =
    `Total: ${rupiah(total)}`;


  const popup =
    document.getElementById(
      "cartPopup"
    );


  /*
    Popup muncul hanya kalau
    ada barang di keranjang.
  */

  if (itemCount > 0) {

    popup.classList.add(
      "show"
    );

  } else {

    popup.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   18. CHECKOUT
========================================================= */

function goToCheckout() {

  window.location.href =
    "checkout.html";

}


/* =========================================================
   19. SEARCH
========================================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function() {

      renderProducts();

    }
  );


/* =========================================================
   20. TOAST
========================================================= */

let toastTimer;


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2000
    );

}


/* =========================================================
   21. LOADING
========================================================= */

function showLoading() {

  document.getElementById(
    "productGrid"
  ).innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Memuat produk ZOKENT STORE...

    </div>

  `;

}


/* =========================================================
   22. ERROR
========================================================= */

function showProductError(message) {

  document.getElementById(
    "productGrid"
  ).innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        ⚠️
      </div>

      <strong>
        Tidak dapat memuat produk
      </strong>

      <div style="
        margin-top:8px;
        font-size:12px;
      ">
        ${escapeHtml(message)}
      </div>

    </div>

  `;


  document.getElementById(
    "productCount"
  ).textContent =
    "Error";

}


/* =========================================================
   23. START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    updateCart();

    loadStore();

  }
);

</script>

</body>
</html>
