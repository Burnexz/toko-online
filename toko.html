<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZOKENT STORE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --blue:#087ff5;
      --blue2:#006fe8;
      --soft-blue:#eaf5ff;
      --dark:#102b50;
      --text:#18365d;
      --muted:#8292a8;
      --bg:#f6f9fd;
      --white:#fff;
      --green:#16ad68;
      --red:#ef3030;
      --shadow:0 5px 18px rgba(31,74,120,.08);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,
    input{
      font-family:inherit;
    }

    button{
      cursor:pointer;
    }

    /* HEADER */

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#fff;
      box-shadow:0 2px 12px rgba(0,0,0,.06);
    }

    .header-inner{
      max-width:1250px;
      margin:auto;
      min-height:70px;
      display:flex;
      align-items:center;
      gap:18px;
      padding:10px 18px;
    }

    .logo{
      min-width:160px;
      line-height:.8;
      font-weight:1000;
      font-style:italic;
      letter-spacing:-3px;
      font-size:34px;
      color:#087ff5;
      text-shadow:2px 2px 0 #102b50;
    }

    .logo span{
      display:block;
      margin-left:48px;
      margin-top:5px;
      font-size:13px;
      letter-spacing:5px;
      color:#102b50;
      text-shadow:none;
      font-style:normal;
    }

    .search-box{
      flex:1;
      position:relative;
    }

    .search-box input{
      width:100%;
      height:44px;
      border:1px solid #dce7f3;
      background:#f7faff;
      border-radius:24px;
      padding:0 18px 0 45px;
      outline:none;
      font-size:14px;
    }

    .search-box input:focus{
      border-color:var(--blue);
      background:#fff;
    }

    .search-icon{
      position:absolute;
      left:17px;
      top:12px;
      font-size:18px;
      color:#8091a6;
    }

    .header-actions{
      display:flex;
      gap:10px;
    }

    .icon-btn{
      width:44px;
      height:44px;
      border:0;
      background:var(--soft-blue);
      border-radius:50%;
      font-size:20px;
      position:relative;
    }

    .cart-badge{
      position:absolute;
      top:-3px;
      right:-2px;
      min-width:19px;
      height:19px;
      padding:0 5px;
      background:#ef3030;
      color:#fff;
      font-size:11px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
    }

    /* MAIN */

    main{
      max-width:1250px;
      margin:auto;
      padding:20px 18px 100px;
    }

    /* HERO */

    .hero{
      min-height:230px;
      border-radius:25px;
      padding:32px;
      color:white;
      background:
        linear-gradient(
          115deg,
          #0069db 0%,
          #058df4 53%,
          #11b5f5 100%
        );
      display:flex;
      align-items:center;
      justify-content:space-between;
      overflow:hidden;
      position:relative;
      box-shadow:var(--shadow);
    }

    .hero::after{
      content:"";
      position:absolute;
      width:320px;
      height:320px;
      border-radius:50%;
      right:-100px;
      top:-140px;
      background:rgba(255,255,255,.12);
    }

    .hero-text{
      position:relative;
      z-index:2;
      max-width:650px;
    }

    .hero-text h1{
      font-size:38px;
      margin-bottom:10px;
    }

    .hero-text p{
      font-size:16px;
      line-height:1.6;
      opacity:.95;
    }

    .hero-logo{
      position:relative;
      z-index:2;
      font-size:60px;
      font-weight:1000;
      font-style:italic;
      transform:rotate(-5deg);
      text-shadow:4px 4px 0 #102b50;
    }

    .hero-logo small{
      display:block;
      text-align:center;
      font-size:17px;
      letter-spacing:8px;
      text-shadow:none;
      margin-top:-3px;
    }

    /* CATEGORY */

    .section{
      margin-top:25px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }

    .section-head h2{
      font-size:21px;
      color:var(--dark);
    }

    .section-head button{
      border:0;
      background:none;
      color:var(--blue);
      font-weight:bold;
    }

    .categories{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:12px;
    }

    .category{
      border:0;
      background:#fff;
      border-radius:18px;
      padding:17px 8px;
      box-shadow:var(--shadow);
      color:var(--text);
      transition:.2s;
    }

    .category:hover{
      transform:translateY(-3px);
    }

    .category-icon{
      width:50px;
      height:50px;
      margin:auto;
      border-radius:15px;
      background:var(--soft-blue);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:25px;
      margin-bottom:9px;
    }

    .category-name{
      font-size:13px;
      font-weight:bold;
    }

    /* PRODUCT */

    .products{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:15px;
    }

    .product{
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
      min-width:0;
      position:relative;
    }

    .product-image{
      height:180px;
      background:#f4f7fb;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .no-image{
      font-size:48px;
      opacity:.25;
    }

    .product-info{
      padding:13px;
    }

    .product-name{
      font-size:14px;
      font-weight:bold;
      min-height:38px;
      line-height:1.35;
      color:var(--dark);
    }

    .product-price{
      font-size:17px;
      font-weight:900;
      color:var(--blue);
      margin-top:7px;
    }

    .stock{
      margin-top:5px;
      font-size:12px;
      color:var(--muted);
    }

    .stock.out{
      color:var(--red);
      font-weight:bold;
    }

    .add-button{
      width:100%;
      border:0;
      background:var(--blue);
      color:#fff;
      border-radius:11px;
      padding:11px 8px;
      margin-top:10px;
      font-weight:bold;
      font-size:13px;
    }

    .add-button:hover{
      background:var(--blue2);
    }

    .add-button:disabled{
      background:#ccd5df;
      cursor:not-allowed;
    }

    /* FLOATING CART */

    .floating-cart{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:20px;
      z-index:900;
      width:min(500px,calc(100% - 30px));
      background:#fff;
      border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.18);
      padding:10px;
      display:none;
    }

    .floating-cart.show{
      display:block;
    }

    .floating-cart button{
      width:100%;
      border:0;
      background:var(--blue);
      color:#fff;
      border-radius:13px;
      padding:13px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:bold;
    }

    /* EMPTY */

    .empty{
      background:#fff;
      border-radius:18px;
      padding:45px 20px;
      text-align:center;
      color:var(--muted);
      box-shadow:var(--shadow);
      grid-column:1/-1;
    }

    /* LOADING */

    .loading{
      background:#fff;
      border-radius:18px;
      padding:40px;
      text-align:center;
      color:var(--muted);
      grid-column:1/-1;
    }

    /* TOAST */

    .toast{
      position:fixed;
      left:50%;
      bottom:90px;
      transform:translateX(-50%) translateY(20px);
      background:#102b50;
      color:#fff;
      padding:12px 18px;
      border-radius:12px;
      opacity:0;
      pointer-events:none;
      transition:.25s;
      z-index:2000;
      font-size:14px;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    /* MOBILE NAV */

    .bottom-nav{
      display:none;
    }

    /* RESPONSIVE */

    @media(max-width:1000px){
      .products{
        grid-template-columns:repeat(4,1fr);
      }

      .categories{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:700px){

      .header-inner{
        min-height:auto;
        flex-wrap:wrap;
        padding:10px 12px;
        gap:8px;
      }

      .logo{
        min-width:auto;
        font-size:29px;
      }

      .logo span{
        font-size:9px;
        margin-left:39px;
        letter-spacing:4px;
      }

      .header-actions{
        margin-left:auto;
      }

      .search-box{
        order:3;
        flex-basis:100%;
      }

      main{
        padding:12px 12px 100px;
      }

      .hero{
        min-height:190px;
        padding:24px;
      }

      .hero-text h1{
        font-size:27px;
      }

      .hero-text p{
        font-size:13px;
      }

      .hero-logo{
        display:none;
      }

      .categories{
        grid-template-columns:repeat(3,1fr);
      }

      .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
      }

      .product-image{
        height:150px;
      }

      .product-info{
        padding:10px;
      }

      .product-name{
        font-size:13px;
      }

      .product-price{
        font-size:15px;
      }

      .bottom-nav{
        position:fixed;
        display:flex;
        left:0;
        right:0;
        bottom:0;
        height:64px;
        background:#fff;
        border-top:1px solid #e5ebf2;
        z-index:1000;
        justify-content:space-around;
      }

      .bottom-nav button{
        flex:1;
        border:0;
        background:none;
        color:#8292a8;
        font-size:11px;
      }

      .bottom-nav button.active{
        color:var(--blue);
        font-weight:bold;
      }

      .floating-cart{
        bottom:72px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      ZOKENT
      <span>STORE</span>
    </div>

    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input
        id="searchInput"
        type="text"
        placeholder="Cari produk di ZOKENT STORE..."
        oninput="searchProducts()"
      >
    </div>

    <div class="header-actions">

      <button class="icon-btn" onclick="goCheckout()" title="Keranjang">
        🛒
        <span class="cart-badge" id="cartBadge">0</span>
      </button>

      <button class="icon-btn" onclick="showToast('Pelanggan tidak perlu login untuk belanja')">
        👤
      </button>

    </div>

  </div>
</header>


<main>

  <section class="hero">

    <div class="hero-text">
      <h1>Belanja Lebih Mudah di ZOKENT STORE</h1>

      <p>
        Toko kelontong modern untuk kebutuhan sehari-hari.
        Pilih produk, masukkan ke keranjang, lalu pesan melalui WhatsApp.
      </p>
    </div>

    <div class="hero-logo">
      ZOKENT
      <small>STORE</small>
    </div>

  </section>


  <section class="section">

    <div class="section-head">
      <h2>Kategori</h2>
      <button onclick="showAllProducts()">Lihat Semua</button>
    </div>

    <div class="categories" id="categories">

      <button class="category" onclick="filterCategory('Sembako')">
        <div class="category-icon">🍚</div>
        <div class="category-name">Sembako</div>
      </button>

      <button class="category" onclick="filterCategory('Minuman')">
        <div class="category-icon">🥤</div>
        <div class="category-name">Minuman</div>
      </button>

      <button class="category" onclick="filterCategory('Bumbu')">
        <div class="category-icon">🌶️</div>
        <div class="category-name">Bumbu</div>
      </button>

      <button class="category" onclick="filterCategory('Mandi-Cuci')">
        <div class="category-icon">🧼</div>
        <div class="category-name">Mandi-Cuci</div>
      </button>

      <button class="category" onclick="filterCategory('Snack')">
        <div class="category-icon">🍪</div>
        <div class="category-name">Snack</div>
      </button>

      <button class="category" onclick="filterCategory('Pulsa')">
        <div class="category-icon">📱</div>
        <div class="category-name">Pulsa</div>
      </button>

    </div>

  </section>


  <section class="section">

    <div class="section-head">
      <h2>Produk Tersedia</h2>
      <button onclick="showAllProducts()">Semua Produk</button>
    </div>

    <div class="products" id="products">
      <div class="loading">
        Memuat produk...
      </div>
    </div>

  </section>

</main>


<div class="floating-cart" id="floatingCart">

  <button onclick="goCheckout()">

    <span>
      🛒 <span id="floatingQty">0</span> item
    </span>

    <span>
      <span id="floatingTotal">Rp0</span>
      &nbsp; →
    </span>

  </button>

</div>


<div class="bottom-nav">

  <button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    🏠<br>
    Beranda
  </button>

  <button onclick="document.querySelector('.categories').scrollIntoView({behavior:'smooth'})">
    📦<br>
    Kategori
  </button>

  <button onclick="goCheckout()">
    🛒<br>
    Keranjang
  </button>

</div>


<div class="toast" id="toast"></div>


<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL = "GANTI_DI_SINI_URL_SUPABASE_KAMU";
  const SUPABASE_ANON_KEY = "GANTI_DI_SINI_ANON_PUBLIC_KEY_KAMU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =====================================================
     CART
  ===================================================== */

  const CART_KEY = "zokent_cart";

  let cart = [];

  try {
    const saved = localStorage.getItem(CART_KEY);

    if(saved){
      const parsed = JSON.parse(saved);

      if(Array.isArray(parsed)){
        cart = parsed;
      }
    }

  } catch(error){

    console.error("Cart error:", error);

    cart = [];

  }


  /* =====================================================
     PRODUCT DATA
  ===================================================== */

  let products = [];
  let allProducts = [];
  let selectedCategory = "";


  /* =====================================================
     SAVE CART
  ===================================================== */

  function saveCart(){

    try{

      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );

    }catch(error){

      console.error("Gagal menyimpan cart:",error);

    }

    updateCart();

  }


  /* =====================================================
     UPDATE CART
  ===================================================== */

  function updateCart(){

    const totalQty = cart.reduce(
      (sum,item) => sum + Number(item.quantity || 0),
      0
    );

    const totalPrice = cart.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.quantity || 0),
      0
    );


    document.getElementById("cartBadge").textContent =
      totalQty;

    document.getElementById("floatingQty").textContent =
      totalQty;

    document.getElementById("floatingTotal").textContent =
      formatRupiah(totalPrice);


    const floating =
      document.getElementById("floatingCart");


    if(totalQty > 0){

      floating.classList.add("show");

    }else{

      floating.classList.remove("show");

    }

  }


  /* =====================================================
     ADD TO CART
  ===================================================== */

  function addToCart(productId){

    const product =
      allProducts.find(
        p => p.id === productId
      );


    if(!product){

      showToast("Produk tidak ditemukan");

      return;

    }


    const stock =
      Number(product.stock_quantity || 0);


    if(stock <= 0){

      showToast("Stok produk sedang habis");

      return;

    }


    const existing =
      cart.find(
        item => item.id === product.id
      );


    if(existing){

      if(
        Number(existing.quantity) >= stock
      ){

        showToast("Jumlah sudah mencapai stok");

        return;

      }

      existing.quantity =
        Number(existing.quantity) + 1;

    }else{

      cart.push({

        id: product.id,

        name:
          product.catalog_name ||
          product.name,

        price:
          Number(product.selling_price || 0),

        image:
          product.image_url || "",

        quantity: 1

      });

    }


    saveCart();

    showToast(
      `${product.catalog_name || product.name} masuk keranjang`
    );

  }


  /* =====================================================
     CHECKOUT
     
     Cart dikirim juga melalui URL sebagai backup.
     Ini membantu apabila localStorage checkout
     tidak terbaca karena perbedaan path/deployment.
  ===================================================== */

  function goCheckout(){

    if(!cart.length){

      showToast("Keranjang masih kosong");

      return;

    }


    saveCart();


    try{

      const encodedCart =
        encodeURIComponent(
          JSON.stringify(cart)
        );


      window.location.href =
        "checkout.html?cart=" +
        encodedCart;

    }catch(error){

      console.error(error);

      window.location.href =
        "checkout.html";

    }

  }


  /* =====================================================
     LOAD STORE
  ===================================================== */

  async function loadStore(){

    try{

      const {
        data,
        error
      } = await supabaseClient

        .from("products")

        .select(`
          id,
          name,
          catalog_name,
          sku,
          description,
          selling_price,
          image_url,
          is_active,
          show_in_catalog,
          show_when_out_of_stock,
          stock_quantity,
          category,
          created_at
        `)

        .eq("is_active", true)

        .eq("show_in_catalog", true)

        .order(
          "created_at",
          {
            ascending:false
          }
        );


      if(error){

        console.error(error);

        document.getElementById("products").innerHTML = `
          <div class="empty">
            ❌ Gagal memuat produk.
            <br><br>
            Periksa URL dan Anon Key Supabase.
          </div>
        `;

        return;

      }


      allProducts =
        (data || []).filter(product => {

          const stock =
            Number(product.stock_quantity || 0);

          return (
            stock > 0 ||
            product.show_when_out_of_stock === true
          );

        });


      products =
        [...allProducts];


      renderProducts();

    }catch(error){

      console.error(error);

      document.getElementById("products").innerHTML = `
        <div class="empty">
          ❌ Terjadi kesalahan saat memuat produk.
        </div>
      `;

    }

  }


  /* =====================================================
     RENDER PRODUCTS
  ===================================================== */

  function renderProducts(){

    const container =
      document.getElementById("products");


    if(!products.length){

      container.innerHTML = `
        <div class="empty">
          <div style="font-size:45px;margin-bottom:10px;">
            📦
          </div>

          Belum ada produk tersedia.
        </div>
      `;

      return;

    }


    container.innerHTML =
      products.map(
        product => createProductCard(product)
      ).join("");

  }


  /* =====================================================
     PRODUCT CARD
  ===================================================== */

  function createProductCard(product){

    const stock =
      Number(product.stock_quantity || 0);


    const outOfStock =
      stock <= 0;


    const image =
      product.image_url;


    return `

      <div class="product">

        <div class="product-image">

          ${
            image
            ?
            `<img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.catalog_name || product.name)}"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
            >`
            :
            ""
          }

          <div
            class="no-image"
            style="${image ? 'display:none' : ''}"
          >
            🛒
          </div>

        </div>


        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(
              product.catalog_name ||
              product.name
            )}
          </div>


          <div class="product-price">
            ${formatRupiah(
              Number(product.selling_price || 0)
            )}
          </div>


          <div class="stock ${outOfStock ? 'out' : ''}">

            ${
              outOfStock
              ?
              "Stok habis"
              :
              `Stok: ${stock}`
            }

          </div>


          <button
            class="add-button"
            onclick="addToCart('${product.id}')"
            ${outOfStock ? "disabled" : ""}
          >

            ${
              outOfStock
              ?
              "Stok Habis"
              :
              "🛒 + Keranjang"
            }

          </button>

        </div>

      </div>

    `;

  }


  /* =====================================================
     CATEGORY
  ===================================================== */

  function filterCategory(category){

    selectedCategory =
      category;


    const normalized =
      category.toLowerCase().trim();


    products =
      allProducts.filter(product => {

        const productCategory =
          String(
            product.category || ""
          )
          .toLowerCase()
          .trim();


        return (
          productCategory === normalized
        );

      });


    renderProducts();


    window.scrollTo({
      top:500,
      behavior:"smooth"
    });

  }


  function showAllProducts(){

    selectedCategory = "";

    products =
      [...allProducts];

    renderProducts();

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  function searchProducts(){

    const keyword =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(!keyword){

      products =
        selectedCategory
        ?
        allProducts.filter(product =>
          String(product.category || "")
            .toLowerCase()
            .trim() ===
          selectedCategory.toLowerCase().trim()
        )
        :
        [...allProducts];

      renderProducts();

      return;

    }


    products =
      allProducts.filter(product => {

        const name =
          String(
            product.catalog_name ||
            product.name ||
            ""
          ).toLowerCase();


        const sku =
          String(
            product.sku || ""
          ).toLowerCase();


        const category =
          String(
            product.category || ""
          ).toLowerCase();


        return (
          name.includes(keyword) ||
          sku.includes(keyword) ||
          category.includes(keyword)
        );

      });


    renderProducts();

  }


  /* =====================================================
     FORMAT RUPIAH
  ===================================================== */

  function formatRupiah(number){

    return new Intl.NumberFormat(
      "id-ID",
      {
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
      }
    ).format(
      Number(number || 0)
    );

  }


  /* =====================================================
     HTML ESCAPE
  ===================================================== */

  function escapeHtml(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =====================================================
     TOAST
  ===================================================== */

  let toastTimer;


  function showToast(message){

    const toast =
      document.getElementById("toast");


    toast.textContent =
      message;


    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
      setTimeout(
        () => {
          toast.classList.remove("show");
        },
        2200
      );

  }


  /* =====================================================
     START
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      updateCart();

      loadStore();

    }
  );

</script>

</body>
