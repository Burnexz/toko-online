<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111827;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 3px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 20px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    .search-box input:focus {
      outline: none;
      border-color: #111827;
    }

    /* =========================
       KATEGORI
    ========================= */

    .category-section {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 20px;
    }

    .category-scroll {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-button {
      flex-shrink: 0;
      border: 1px solid #d1d5db;
      background: white;
      color: #111827;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .category-button.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    /* =========================
       PRODUK
    ========================= */

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .product-card {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .product-image {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .no-image {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      color: #6b7280;
      font-size: 13px;
    }

    .product-content {
      padding: 13px;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 7px;
    }

    .product-category {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .order-button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .order-button:hover {
      opacity: 0.9;
    }

    /* =========================
       LOADING / EMPTY
    ========================= */

    .loading,
    .empty {
      background: white;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 40px;
      padding: 25px 20px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 13px;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {

      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-image,
      .no-image {
        height: 190px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <div>
        <div class="logo">
          ZOKENT STORE
        </div>

        <div class="subtitle">
          Toko Kelontong Modern
        </div>
      </div>

    </div>

  </header>


  <!-- =========================
       SEARCH
  ========================= -->

  <div class="search-box">

    <input
      type="search"
      id="searchInput"
      placeholder="Cari produk..."
      autocomplete="off"
    >

  </div>


  <!-- =========================
       KATEGORI
  ========================= -->

  <section class="category-section">

    <div
      class="category-scroll"
      id="categoryList"
    >

      <button
        class="category-button active"
        data-category="all"
      >
        Semua
      </button>

    </div>

  </section>


  <!-- =========================
       PRODUK
  ========================= -->

  <main>

    <h1 class="section-title">
      Produk
    </h1>

    <section id="productContainer">

      <div class="loading">
        Memuat produk...
      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div>
      © Zokent Store
    </div>

    <div style="margin-top:5px;">
      Belanja mudah dan praktis
    </div>

  </footer>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://weuousmvkxmgmsnwiuad.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // DATA
    // ==========================================

    let products = [];

    let selectedCategory = "all";

    let searchText = "";


    // ==========================================
    // FORMAT HARGA
    // ==========================================

    function formatRupiah(value) {

      return new Intl.NumberFormat(
        "id-ID"
      ).format(value);

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;

    }


    // ==========================================
    // LOAD KATEGORI
    // ==========================================

    async function loadCategories() {

      const categoryList =
        document.getElementById(
          "categoryList"
        );


      const { data, error } =
        await supabaseClient
          .from("categories")
          .select("id, name")
          .order("name", {
            ascending: true
          });


      if (error) {

        console.error(
          "Kategori:",
          error
        );

        return;
      }


      data.forEach(category => {

        const button =
          document.createElement("button");

        button.className =
          "category-button";

        button.textContent =
          category.name;

        button.dataset.category =
          category.id;

        button.addEventListener(
          "click",
          function() {

            selectedCategory =
              category.id;

            document
              .querySelectorAll(
                ".category-button"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });

            button.classList.add(
              "active"
            );

            renderProducts();

          }
        );


        categoryList.appendChild(
          button
        );

      });

    }


    // ==========================================
    // LOAD PRODUK
    // ==========================================

    async function loadProducts() {

      const container =
        document.getElementById(
          "productContainer"
        );


      container.innerHTML = `
        <div class="loading">
          Memuat produk...
        </div>
      `;


      const { data, error } =
        await supabaseClient
          .from("products")
          .select(`
            id,
            name,
            price,
            image_url,
            is_active,
            product_categories (
              category_id,
              categories (
                id,
                name
              )
            )
          `)
          .eq("is_active", true)
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "Produk:",
          error
        );


        container.innerHTML = `
          <div class="empty">
            Produk gagal dimuat.
          </div>
        `;

        return;
      }


      products = data || [];

      renderProducts();

    }


    // ==========================================
    // FILTER + TAMPILKAN PRODUK
    // ==========================================

    function renderProducts() {

      const container =
        document.getElementById(
          "productContainer"
        );


      let filtered =
        products.filter(product => {


          // Filter kategori
          if (
            selectedCategory !== "all"
          ) {

            const hasCategory =
              product
                .product_categories
                ?.some(
                  relation =>
                    relation.category_id ===
                    selectedCategory
                );


            if (!hasCategory) {
              return false;
            }

          }


          // Filter pencarian
          if (searchText) {

            const name =
              product.name
                .toLowerCase();


            if (
              !name.includes(
                searchText
              )
            ) {

              return false;

            }

          }


          return true;

        });


      if (filtered.length === 0) {

        container.innerHTML = `
          <div class="empty">
            Produk tidak ditemukan.
          </div>
        `;

        return;
      }


      container.innerHTML = `
        <div class="product-grid"></div>
      `;


      const grid =
        container.querySelector(
          ".product-grid"
        );


      filtered.forEach(product => {

        let categoryName =
          "Tanpa kategori";


        if (
          product.product_categories &&
          product.product_categories.length
        ) {

          const category =
            product
              .product_categories[0]
              ?.categories;


          if (category?.name) {

            categoryName =
              category.name;

          }

        }


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "product-card";


        let imageHtml = "";


        if (product.image_url) {

          imageHtml = `
            <img
              class="product-image"
              src="${escapeHtml(
                product.image_url
              )}"
              alt="${escapeHtml(
                product.name
              )}"
              loading="lazy"
            >
          `;

        } else {

          imageHtml = `
            <div class="no-image">
              Tidak ada foto
            </div>
          `;

        }


        card.innerHTML = `

          ${imageHtml}

          <div class="product-content">

            <div class="product-name">
              ${escapeHtml(
                product.name
              )}
            </div>

            <div class="product-category">
              ${escapeHtml(
                categoryName
              )}
            </div>

            <div class="product-price">
              Rp ${formatRupiah(
                product.price
              )}
            </div>

            <button
              class="order-button"
              onclick="orderProduct(
                '${escapeHtml(
                  product.name
                )}',
                ${product.price}
              )"
            >
              Pesan via WhatsApp
            </button>

          </div>

        `;


        grid.appendChild(card);

      });

    }


    // ==========================================
    // SEARCH
    // ==========================================

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        function(event) {

          searchText =
            event.target.value
              .trim()
              .toLowerCase();

          renderProducts();

        }
      );


    // ==========================================
    // WHATSAPP
    // ==========================================

    function orderProduct(
      productName,
      price
    ) {

      const phone =
        "6283863000922";


      const message =
        `Halo Zokent Store, saya mau pesan ${productName} dengan harga Rp ${formatRupiah(price)}.`;


      const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(
          message
        );


      window.open(
        url,
        "_blank"
      );

    }


    // ==========================================
    // JALANKAN
    // ==========================================

    async function init() {

      await loadCategories();

      await loadProducts();

    }


    init();

  </script>

</body>
</html>
