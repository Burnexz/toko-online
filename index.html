<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Toko Online POS</title>
  <!-- CDN Tailwind CSS untuk Tampilan Modern -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CDN Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <!-- Card Login Container -->
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Sistem Toko Online</h1>
      <p class="text-sm text-slate-500 mt-1">Masuk untuk mengakses Kasir & Dasbor</p>
    </div>

    <!-- Alert Notifikasi Pesan Error -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Form Login -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="nama@toko.com" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
        />
      </div>

      <button 
        type="submit" 
        id="btnLogin" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg disabled:opacity-50"
      >
        Masuk Aplikasi
      </button>
    </form>
  </div>

  <script>
    // 1. Konfigurasi Klien Supabase
    // Ganti nilai berikut dengan URL & ANON KEY dari Supabase Anda
    const SUPABASE_URL = 'https://weuousmvkxmgmsnwiuad.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnLogin = document.getElementById('btnLogin');

    // Fungsi Pembantu Tampil Notifikasi Error/Info
    function showAlert(message, isError = true) {
      alertBox.textContent = message;
      alertBox.className = `mb-4 p-3 rounded-lg text-sm font-medium ${
        isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-600 border border-green-200'
      }`;
      alertBox.classList.remove('hidden');
    }

    // 2. Cek Sesi Pengguna (Redirect Otomatis Jika Sudah Login)
    async function checkSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        await redirectUserBasedOnRole(session.user.id);
      }
    }

    // 3. Pengarahan Halaman Berdasarkan Peran Pengguna (Role)
    async function redirectUserBasedOnRole(userId) {
      const { data: profile, error } = await _supabase
        .from('profiles')
        .select('role')
        .eq('id', userId)
        .single();

      if (error || !profile) {
        // Default pengarahan jika role belum terkonfigurasi di profiles
        window.location.href = 'dashboard.html';
        return;
      }

      if (profile.role === 'admin') {
        window.location.href = 'dashboard.html';
      } else if (profile.role === 'kasir') {
        window.location.href = 'kasir.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }

    // 4. Handling Submit Form Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btnLogin.disabled = true;
      btnLogin.textContent = 'Memproses...';
      alertBox.classList.add('hidden');

      // Panggil API Supabase Auth
      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        showAlert('Login gagal: ' + error.message, true);
        btnLogin.disabled = false;
        btnLogin.textContent = 'Masuk Aplikasi';
      } else {
        showAlert('Berhasil masuk! Mengarahkan...', false);
        await redirectUserBasedOnRole(data.user.id);
      }
    });

    // Jalankan pengecekan sesi saat halaman dibuka
    checkSession();
  </script>
</body>
</html>
