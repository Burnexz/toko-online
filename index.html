<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      opacity: .8;
      margin-top: 3px;
    }

    .search-box {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 20px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    .category-section {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 20px;
    }

    .category-scroll {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-button {
      flex-shrink: 0;
      border: 1px solid #d1d5db;
      background: white;
      color: #111827;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .category-button.active {
      background: #111827;
      color: white;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .product-card {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
    }

    .product-image {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .no-image {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      color: #6b7280;
      font-size: 13px;
    }

    .product-content {
      padding: 13px;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 7px;
    }

    .product-description {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .product-category {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .stock {
      font-size: 12px;
      margin-bottom: 10px;
      color: #374151;
    }

    .order-button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .loading,
    .empty,
    .error {
      background: white;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }

    footer {
      margin-top: 40px;
      padding: 25px 20px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-image,
      .no-image {
        height: 190px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">ZOKENT STORE</div>
    <div class="subtitle">Toko Kelontong Modern</div>
  </div>
</header>


<div class="search-box">
  <input
    type="search"
    id="searchInput"
    placeholder="Cari produk..."
    autocomplete="off"
  >
</div>


<section class="category-section">

  <div
    class="category-scroll"
    id="categoryList"
  >

    <button
      class="category-button active"
      data-category="all"
      onclick="selectCategory('all', this)"
    >
      Semua
    </button>

  </div>

</section>


<main>

  <h1 class="section-title">
    Produk
  </h1>

  <section id="productContainer">

    <div class="loading">
      Memuat produk...
    </div>

  </section>

</main>


<footer>

  <div>© Zokent Store</div>

  <div style="margin-top:5px;">
    Belanja mudah dan praktis
  </div>

</footer>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://weuousmvkxmgmsnwiuad.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  let products = [];

  let selectedCategory = "all";

  let searchText = "";


  // ==========================================
  // FORMAT RUPIAH
  // ==========================================

  function formatRupiah(value) {

    return new Intl.NumberFormat(
      "id-ID"
    ).format(value || 0);

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  // ==========================================
  // LOAD KATEGORI
  // ==========================================

  async function loadCategories() {

    const categoryList =
      document.getElementById(
        "categoryList"
      );


    const { data, error } =
      await supabaseClient
        .from("categories")
        .select("id, name")
        .order("name", {
          ascending: true
        });


    if (error) {

      console.error(
        "ERROR KATEGORI:",
        error
      );

      return;
    }


    data.forEach(category => {

      const button =
        document.createElement("button");

      button.className =
        "category-button";

      button.textContent =
        category.name;

      button.onclick =
        function() {

          selectCategory(
            category.id,
            button
          );

        };


      categoryList.appendChild(
        button
      );

    });

  }


  // ==========================================
  // PILIH KATEGORI
  // ==========================================

  function selectCategory(
    categoryId,
    button
  ) {

    selectedCategory =
      categoryId;


    document
      .querySelectorAll(
        ".category-button"
      )
      .forEach(item => {

        item.classList.remove(
          "active"
        );

      });


    button.classList.add(
      "active"
    );


    renderProducts();

  }


  // ==========================================
  // LOAD PRODUK
  // ==========================================

  async function loadProducts() {

    const container =
      document.getElementById(
        "productContainer"
      );


    container.innerHTML = `
      <div class="loading">
        Memuat produk...
      </div>
    `;


    const { data, error } =
      await supabaseClient
        .from("products")
        .select(`
          id,
          name,
          sku,
          description,
          selling_price,
          image_url,
          is_active,
          show_in_catalog,
          show_when_out_of_stock,
          stock_quantity,
          product_categories (
            category_id,
            categories (
              id,
              name
            )
          )
        `)
        .eq("is_active", true)
        .eq("show_in_catalog", true)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(
        "ERROR PRODUK:",
        error
      );


      container.innerHTML = `
        <div class="error">
          Produk gagal dimuat.
        </div>
      `;

      return;
    }


    products =
      data || [];


    renderProducts();

  }


  // ==========================================
  // TAMPILKAN PRODUK
  // ==========================================

  function renderProducts() {

    const container =
      document.getElementById(
        "productContainer"
      );


    const filtered =
      products.filter(product => {


        // =========================
        // FILTER KATEGORI
        // =========================

        if (
          selectedCategory !== "all"
        ) {

          const cocok =
            product
              .product_categories
              ?.some(
                relation =>
                  relation.category_id ===
                  selectedCategory
              );


          if (!cocok) {
            return false;
          }

        }


        // =========================
        // FILTER SEARCH
        // =========================

        if (searchText) {

          const nama =
            (
              product.name ||
              ""
            ).toLowerCase();


          const deskripsi =
            (
              product.description ||
              ""
            ).toLowerCase();


          if (
            !nama.includes(
              searchText
            ) &&
            !deskripsi.includes(
              searchText
            )
          ) {

            return false;

          }

        }


        // =========================
        // FILTER STOK
        // =========================

        if (
          Number(
            product.stock_quantity
          ) <= 0 &&
          !product.show_when_out_of_stock
        ) {

          return false;

        }


        return true;

      });


    if (filtered.length === 0) {

      container.innerHTML = `
        <div class="empty">
          Produk tidak ditemukan.
        </div>
      `;

      return;
    }


    container.innerHTML = `
      <div class="product-grid"></div>
    `;


    const grid =
      container.querySelector(
        ".product-grid"
      );


    filtered.forEach(product => {

      let categoryName =
        "Tanpa kategori";


      if (
        product.product_categories &&
        product.product_categories.length > 0
      ) {

        const relation =
          product
            .product_categories[0];


        if (
          relation.categories &&
          relation.categories.name
        ) {

          categoryName =
            relation.categories.name;

        }

      }


      let imageHtml;


      if (product.image_url) {

        imageHtml = `
          <img
            class="product-image"
            src="${escapeHtml(
              product.image_url
            )}"
            alt="${escapeHtml(
              product.name
            )}"
            loading="lazy"
          >
        `;

      } else {

        imageHtml = `
          <div class="no-image">
            Tidak ada foto
          </div>
        `;

      }


      let stockText;


      if (
        Number(
          product.stock_quantity
        ) <= 0
      ) {

        stockText =
          "Stok habis";

      } else {

        stockText =
          "Stok: " +
          product.stock_quantity;

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product-card";


      card.innerHTML = `

        ${imageHtml}

        <div class="product-content">

          <div class="product-name">
            ${escapeHtml(
              product.name
            )}
          </div>

          ${
            product.description
              ? `
                <div class="product-description">
                  ${escapeHtml(
                    product.description
                  )}
                </div>
              `
              : ""
          }

          <div class="product-category">
            ${escapeHtml(
              categoryName
            )}
          </div>

          <div class="product-price">
            Rp ${formatRupiah(
              product.selling_price
            )}
          </div>

          <div class="stock">
            ${stockText}
          </div>

          <button
            class="order-button"
            onclick="orderProduct(
              '${escapeHtml(
                product.name
              )}',
              ${product.selling_price}
            )"
          >
            Pesan via WhatsApp
          </button>

        </div>

      `;


      grid.appendChild(
        card
      );

    });

  }


  // ==========================================
  // SEARCH
  // ==========================================

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      function(event) {

        searchText =
          event.target.value
            .trim()
            .toLowerCase();


        renderProducts();

      }
    );


  // ==========================================
  // WHATSAPP
  // ==========================================

  function orderProduct(
    productName,
    price
  ) {

    const phone =
      "6283863000922";


    const message =
      `Halo Zokent Store, saya mau pesan ${productName} dengan harga Rp ${formatRupiah(price)}.`;


    const url =
      "https://wa.me/" +
      phone +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.open(
      url,
      "_blank"
    );

  }


  // ==========================================
  // MULAI
  // ==========================================

  async function init() {

    await loadCategories();

    await loadProducts();

  }


  init();

</script>

</body>
</html>
