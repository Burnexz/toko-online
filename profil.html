<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - ZOKENT STORE</title>

<style>
:root{
  --primary:#e21b23;
  --primary-dark:#b9141a;
  --soft:#fff1f1;
  --text:#171717;
  --muted:#777;
  --border:#e8e8e8;
  --bg:#f7f7f8;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.profile{
  min-height:100vh;
  background:#fff;
}

/* HEADER */
.profile-header{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:#fff;
  z-index:10;
}

.profile-title{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-title-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,#e21b23,#8f0005);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  font-size:21px;
  box-shadow:0 5px 15px rgba(226,27,35,.25);
}

.profile-title h1{
  font-size:18px;
}

.profile-title span{
  display:block;
  font-size:11px;
  color:#888;
  margin-top:2px;
}

.close-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:11px;
  background:#f2f2f2;
  cursor:pointer;
  font-size:23px;
  color:#444;
}

.close-btn:hover{
  background:#e9e9e9;
}

/* CONTENT */
.profile-content{
  padding:20px;
}

/* BRAND PREVIEW */
.brand-preview{
  background:
    radial-gradient(circle at top right,rgba(255,255,255,.18),transparent 35%),
    linear-gradient(135deg,#e21b23,#8d0005);
  border-radius:20px;
  padding:25px 20px;
  color:white;
  text-align:center;
  margin-bottom:20px;
  overflow:hidden;
  position:relative;
}

.brand-preview::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border:2px solid rgba(255,255,255,.12);
  border-radius:50%;
  right:-70px;
  top:-80px;
}

.brand-preview-label{
  font-size:11px;
  opacity:.75;
  letter-spacing:2px;
  margin-bottom:5px;
}

/*
  LOGO GRAFFITI
*/
.graffiti-logo{
  font-family:Impact, Haettenschweiler, "Arial Black", sans-serif;
  font-size:52px;
  line-height:.9;
  letter-spacing:-2px;
  font-style:italic;
  transform:skew(-8deg) rotate(-2deg);
  text-transform:uppercase;

  color:#fff;

  text-shadow:
    3px 3px 0 #111,
    5px 5px 0 rgba(0,0,0,.35);

  position:relative;
  display:inline-block;
}

.graffiti-logo::after{
  content:"";
  position:absolute;
  left:5%;
  right:-5%;
  bottom:-7px;
  height:5px;
  background:#fff;
  border-radius:100%;
  transform:rotate(-2deg);
  opacity:.9;
}

.brand-preview-store{
  margin-top:13px;
  font-size:13px;
  font-weight:900;
  letter-spacing:7px;
}

/* SECTION */
.section{
  margin-bottom:18px;
}

.section-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

/* LOGO */
.logo-box{
  padding:18px;
  text-align:center;
}

.logo-preview{
  width:140px;
  height:100px;
  border:2px dashed #ddd;
  border-radius:14px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fafafa;
}

.logo-preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.logo-placeholder{
  color:#aaa;
  font-size:12px;
}

.button-row{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-light{
  background:#f1f1f1;
  color:#333;
}

/* FORM */
.form-card{
  padding:17px;
}

.form-group{
  margin-bottom:15px;
}

.form-group:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px;
  font-size:14px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(226,27,35,.08);
}

textarea{
  min-height:85px;
  resize:vertical;
}

/* INFO */
.info-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
  border-bottom:1px solid var(--border);
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  font-size:12px;
  color:#777;
}

.info-value{
  font-size:13px;
  font-weight:700;
}

/* SAVE */
.save-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#e21b23,#b9141a);
  color:white;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(226,27,35,.2);
}

.save-btn:active{
  transform:scale(.98);
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:480px){

  .profile-content{
    padding:14px;
  }

  .profile-header{
    padding:0 14px;
  }

  .graffiti-logo{
    font-size:46px;
  }

  .brand-preview{
    border-radius:17px;
  }
}
</style>
</head>

<body>

<div class="profile">

  <!-- HEADER -->
  <header class="profile-header">

    <div class="profile-title">

      <div class="profile-title-icon">
        Z
      </div>

      <div>
        <h1>Profil ZOKENT</h1>
        <span>Identitas toko & akun</span>
      </div>

    </div>

    <button class="close-btn" onclick="closeProfile()">
      ×
    </button>

  </header>


  <main class="profile-content">

    <!-- BRAND -->
    <section class="brand-preview">

      <div class="brand-preview-label">
        STORE BRAND
      </div>

      <div class="graffiti-logo" id="previewBrand">
        ZOKENT
      </div>

      <div class="brand-preview-store">
        STORE
      </div>

    </section>


    <!-- LOGO -->
    <section class="section">

      <div class="section-title">
        Logo Toko
      </div>

      <div class="card">

        <div class="logo-box">

          <div class="logo-preview">

            <img id="logoPreview"
                 style="display:none;">

            <div class="logo-placeholder"
                 id="logoPlaceholder">
              Belum ada logo
            </div>

          </div>

          <div class="button-row">

            <label class="btn btn-primary"
                   style="cursor:pointer;">

              Upload Logo

              <input
                type="file"
                id="logoInput"
                accept="image/*"
                style="display:none;"
                onchange="handleLogo(event)"
              >

            </label>

            <button
              class="btn btn-light"
              onclick="removeLogo()">
              Hapus
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- IDENTITAS TOKO -->
    <section class="section">

      <div class="section-title">
        Identitas Toko
      </div>

      <div class="card form-card">

        <div class="form-group">

          <label>
            Nama Toko
          </label>

          <input
            id="storeName"
            type="text"
            placeholder="ZOKENT STORE"
          >

        </div>


        <div class="form-group">

          <label>
            Nama Singkat
          </label>

          <input
            id="shortName"
            type="text"
            placeholder="ZOKENT"
          >

        </div>


        <div class="form-group">

          <label>
            Deskripsi Toko
          </label>

          <textarea
            id="storeDescription"
            placeholder="Contoh: Toko sembako & kebutuhan harian"
          ></textarea>

        </div>

      </div>

    </section>


    <!-- AKUN -->
    <section class="section">

      <div class="section-title">
        Informasi Akun
      </div>

      <div class="card">

        <div class="info-row">
          <div class="info-label">
            Sistem
          </div>

          <div class="info-value">
            ZOKENT STORE
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">
            Status
          </div>

          <div class="info-value">
            Aktif
          </div>
        </div>


        <div class="info-row">
          <div class="info-label">
            Akses
          </div>

          <div class="info-value">
            Administrator
          </div>
        </div>

      </div>

    </section>


    <!-- SAVE -->
    <button class="save-btn"
            onclick="saveProfile()">

      Simpan Perubahan

    </button>

  </main>

</div>


<div class="toast" id="toast">
  Perubahan berhasil disimpan
</div>


<script>

let pendingLogo = null;


/* LOAD DATA */
function loadProfile(){

  const storeName =
    localStorage.getItem("zokent_store_name")
    || "ZOKENT STORE";

  const shortName =
    localStorage.getItem("zokent_short_name")
    || "ZOKENT";

  const description =
    localStorage.getItem("zokent_description")
    || "Toko SRC / kebutuhan harian";

  document.getElementById("storeName").value =
    storeName;

  document.getElementById("shortName").value =
    shortName;

  document.getElementById("storeDescription").value =
    description;

  document.getElementById("previewBrand").textContent =
    shortName;

  const logo =
    localStorage.getItem("zokent_logo");

  if(logo){
    showLogo(logo);
  }

}


/* LOGO PREVIEW */
function showLogo(src){

  const img =
    document.getElementById("logoPreview");

  const placeholder =
    document.getElementById("logoPlaceholder");

  img.src = src;
  img.style.display = "block";

  placeholder.style.display = "none";

}


/* UPLOAD LOGO */
function handleLogo(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    showToast("File harus berupa gambar");
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e){

    const image =
      new Image();

    image.onload = function(){

      const canvas =
        document.createElement("canvas");

      let width = image.width;
      let height = image.height;

      const maxSize = 500;

      if(width > maxSize || height > maxSize){

        if(width > height){

          height =
            height * maxSize / width;

          width = maxSize;

        }else{

          width =
            width * maxSize / height;

          height = maxSize;

        }

      }

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );

      pendingLogo =
        canvas.toDataURL(
          "image/jpeg",
          .85
        );

      showLogo(pendingLogo);

    };

    image.src = e.target.result;

  };

  reader.readAsDataURL(file);

}


/* REMOVE LOGO */
function removeLogo(){

  pendingLogo = null;

  localStorage.removeItem(
    "zokent_logo"
  );

  const img =
    document.getElementById("logoPreview");

  const placeholder =
    document.getElementById("logoPlaceholder");

  img.src = "";
  img.style.display = "none";

  placeholder.style.display = "block";

  notifyParent();

}


/* SAVE */
function saveProfile(){

  const storeName =
    document.getElementById("storeName")
    .value
    .trim()
    || "ZOKENT STORE";

  const shortName =
    document.getElementById("shortName")
    .value
    .trim()
    || "ZOKENT";

  const description =
    document.getElementById("storeDescription")
    .value
    .trim()
    || "Toko SRC / kebutuhan harian";


  localStorage.setItem(
    "zokent_store_name",
    storeName
  );

  localStorage.setItem(
    "zokent_short_name",
    shortName
  );

  localStorage.setItem(
    "zokent_description",
    description
  );


  if(pendingLogo){

    localStorage.setItem(
      "zokent_logo",
      pendingLogo
    );

    pendingLogo = null;

  }


  document.getElementById(
    "previewBrand"
  ).textContent = shortName;


  notifyParent();

  showToast(
    "Profil toko berhasil disimpan"
  );

}


/* UPDATE ADMIN */
function notifyParent(){

  try{

    if(
      window.parent &&
      window.parent !== window &&
      typeof window.parent.refreshStoreSettingsFromProfile
      === "function"
    ){

      window.parent.refreshStoreSettingsFromProfile();

    }

  }catch(error){

    console.log(error);

  }

}


/* CLOSE */
function closeProfile(){

  try{

    if(
      window.parent &&
      window.parent !== window &&
      typeof window.parent.closeProfileDrawer
      === "function"
    ){

      window.parent.closeProfileDrawer();

    }else{

      history.back();

    }

  }catch(error){

    history.back();

  }

}


/* TOAST */
function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2500);

}


loadProfile();

</script>

</body>
  </html>
