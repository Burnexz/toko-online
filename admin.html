<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Matrix Terminal Zokent Group</title>
    <style>
        :root {
            --bg-color: #0b0f0e;
            --panel-bg: #111a17;
            --border-color: #1f382b;
            --neon-green: #00ff66;
            --neon-green-dim: #00b347;
            --text-main: #c0d8d0;
            --text-muted: #6b8c80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header Dashboard */
        .dashboard-header {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .dashboard-title h1 {
            color: var(--neon-green);
            font-size: 1.2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .dashboard-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-logout {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ff4d4d;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }

        /* Panel Card */
        .panel-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .panel-card h2 {
            color: var(--neon-green);
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-card > p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            color: var(--neon-green);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            background: #070c0a;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
        }

        /* Button Primary */
        .btn-primary {
            width: 100%;
            background: var(--neon-green);
            color: #050a08;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--neon-green-dim);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        /* Alert Notification */
        .alert {
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }
        .alert-success {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="dashboard-title">
                <h1>>_ DASHBOARD ADMIN / PEMILIK</h1>
                <p>[ SYSTEM ACCESS LEVEL : ADMINISTRATOR ROOT ]</p>
            </div>
            <button class="btn-logout" onclick="handleLogout()">LOGOUT ADMIN</button>
        </div>

        <!-- Registrasi Kasir -->
        <div class="panel-card">
            <h2>⚙️ REGISTRASI AKUN KASIR</h2>
            <p>Buat kredensial kasir baru untuk akses portal terminal.</p>
            
            <div id="alertBox" class="alert"></div>

            <form id="formKasir" onsubmit="registerKasir(event)">
                <div class="form-group">
                    <label class="form-label">Nama Operator Kasir</label>
                    <input type="text" id="namaKasir" class="form-input" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Akses Kasir</label>
                    <input type="email" id="emailKasir" class="form-input" placeholder="kasir1@toko.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password Akses</label>
                    <input type="password" id="passKasir" class="form-input" placeholder="Minimal 6 karakter" minlength="6" required>
                </div>

                <button type="submit" class="btn-primary">+ BUAT AKUN KASIR</button>
            </form>
        </div>
    </div>

    <script>
        function registerKasir(event) {
            event.preventDefault();
            const nama = document.getElementById('namaKasir').value;
            const email = document.getElementById('emailKasir').value;
            const alertBox = document.getElementById('alertBox');

            // Simulasi sukses pendaftaran
            alertBox.style.display = 'block';
            alertBox.className = 'alert alert-success';
            alertBox.innerHTML = `>_ SUCCESS: Akun untuk <strong>${nama}</strong> (${email}) berhasil didaftarkan ke terminal!`;

            // Reset form
            document.getElementById('formKasir').reset();

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        function handleLogout() {
            if(confirm("Apakah Anda yakin ingin keluar dari sesi Administrator?")) {
                window.location.href = "index.html"; // Sesuaikan halaman login Anda
            }
        }
    </script>
</body>
</html>
