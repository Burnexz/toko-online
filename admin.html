<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 25px;
      font-weight: bold;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      min-height: 20px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      width: 100%;
      min-height: 100vh;
    }

    .dashboard.active {
      display: block;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
    }

    .logout {
      width: auto;
      background: #374151;
      padding: 9px 13px;
      font-size: 13px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .welcome h2 {
      margin-bottom: 7px;
    }

    .welcome p {
      color: #6b7280;
      font-size: 14px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .menu-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      cursor: pointer;
    }

    .menu-card h3 {
      margin-bottom: 7px;
    }

    .menu-card p {
      color: #6b7280;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .menu {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<!-- ==============================
     HALAMAN LOGIN
     ============================== -->

<div class="page" id="loginPage">

  <div class="login-box">

    <div class="logo">
      ZOKENT STORE
    </div>

    <div class="subtitle">
      Login Administrator
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <div
        class="message"
        id="loginMessage"
      ></div>

      <button
        type="submit"
        id="loginButton"
      >
        Masuk
      </button>

    </form>

  </div>

</div>


<!-- ==============================
     DASHBOARD ADMIN
     ============================== -->

<div
  class="dashboard"
  id="dashboardPage"
>

  <header>

    <div class="header-inner">

      <div class="header-title">
        ZOKENT STORE
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Keluar
      </button>

    </div>

  </header>


  <main>

    <section class="welcome">

      <h2>
        Dashboard Admin
      </h2>

      <p id="adminEmail">
        Memuat akun...
      </p>

    </section>


    <section class="menu">

      <div
        class="menu-card"
        onclick="openPage('produk.html')"
      >
        <h3>Produk</h3>
        <p>
          Tambah dan kelola produk toko.
        </p>
      </div>


      <div
        class="menu-card"
        onclick="showComingSoon('Kategori')"
      >
        <h3>Kategori</h3>
        <p>
          Kelola kategori produk.
        </p>
      </div>


      <div
        class="menu-card"
        onclick="showComingSoon('Stok')"
      >
        <h3>Stok</h3>
        <p>
          Kontrol persediaan produk.
        </p>
      </div>


      <div
        class="menu-card"
        onclick="showComingSoon('Kasir')"
      >
        <h3>Kasir</h3>
        <p>
          Kelola akun kasir.
        </p>
      </div>


      <div
        class="menu-card"
        onclick="showComingSoon('Pesanan')"
      >
        <h3>Pesanan</h3>
        <p>
          Lihat dan kontrol pesanan.
        </p>
      </div>


      <div
        class="menu-card"
        onclick="showComingSoon('Pengaturan')"
      >
        <h3>Pengaturan</h3>
        <p>
          Pengaturan toko dan sistem.
        </p>
      </div>

    </section>

  </main>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://weuousmvkxmgmsnwiuad.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // ELEMENT
  // ==========================================

  const loginPage =
    document.getElementById(
      "loginPage"
    );

  const dashboardPage =
    document.getElementById(
      "dashboardPage"
    );

  const loginForm =
    document.getElementById(
      "loginForm"
    );

  const loginButton =
    document.getElementById(
      "loginButton"
    );

  const loginMessage =
    document.getElementById(
      "loginMessage"
    );

  const adminEmail =
    document.getElementById(
      "adminEmail"
    );


  // ==========================================
  // TAMPILKAN PESAN
  // ==========================================

  function showMessage(
    text,
    success = false
  ) {

    loginMessage.textContent =
      text;

    loginMessage.style.color =
      success ? "green" : "red";

  }


  // ==========================================
  // LOGIN
  // ==========================================

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      loginButton.disabled = true;

      loginButton.textContent =
        "Memeriksa...";

      showMessage("");


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        console.error(error);

        showMessage(
          "Email atau password salah."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Masuk";

        return;
      }


      if (!data.user) {

        showMessage(
          "Login gagal."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Masuk";

        return;
      }


      // ======================================
      // CEK PROFILE ADMIN
      // ======================================

      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "role, is_active"
          )
          .eq(
            "id",
            data.user.id
          )
          .single();


      if (
        profileError ||
        !profile ||
        profile.role !== "owner" ||
        profile.is_active !== true
      ) {

        await supabaseClient.auth.signOut();

        showMessage(
          "Akun ini bukan akun administrator."
        );

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Masuk";

        return;
      }


      showDashboard(
        data.user.email
      );

    }
  );


  // ==========================================
  // DASHBOARD
  // ==========================================

  function showDashboard(
    email
  ) {

    loginPage.style.display =
      "none";

    dashboardPage.classList.add(
      "active"
    );

    adminEmail.textContent =
      "Login sebagai: " + email;

  }


  // ==========================================
  // CEK LOGIN SAAT HALAMAN DIBUKA
  // ==========================================

  async function checkLogin() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {
      return;
    }


    const {
      data: profile
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "role, is_active"
        )
        .eq(
          "id",
          user.id
        )
        .single();


    if (
      profile &&
      profile.role === "owner" &&
      profile.is_active === true
    ) {

      showDashboard(
        user.email
      );

    }

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.reload();

  }


  // ==========================================
  // BUKA HALAMAN
  // ==========================================

  function openPage(
    page
  ) {

    window.location.href =
      page;

  }


  // ==========================================
  // FITUR YANG AKAN DIBUAT
  // ==========================================

  function showComingSoon(
    name
  ) {

    alert(
      name +
      " akan kita aktifkan setelah sistem utama selesai."
    );

  }


  // ==========================================
  // MULAI
  // ==========================================

  checkLogin();

</script>

</body>
</html>
