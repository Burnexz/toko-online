<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">

    <div class="logo">ZOKENT</div>

    <div class="subtitle">
      Login Admin
    </div>

    <form id="loginForm">

      <label for="email">Email Pemilik</label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

  </div>

  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // ==============================
    // LOGIN
    // ==============================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Memproses...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent = "Email atau password salah.";
        message.style.color = "red";

        loginButton.disabled = false;
        loginButton.textContent = "Login";

        return;
      }


      // ==============================
      // CEK PROFILE PEMILIK
      // ==============================

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("full_name, role, is_active")
          .eq("id", data.user.id)
          .single();


      if (
        profileError ||
        !profile ||
        profile.role !== "owner" ||
        profile.is_active !== true
      ) {

        await supabaseClient.auth.signOut();

        message.textContent =
          "Akun ini bukan akun Pemilik.";

        message.style.color = "red";

        loginButton.disabled = false;
        loginButton.textContent = "Login";

        return;
      }


      // ==============================
      // BERHASIL
      // ==============================

      message.textContent =
        "Login berhasil. Membuka Admin...";

      message.style.color = "green";

      setTimeout(() => {

        window.location.href = "dashboard.html";

      }, 800);

    });

  </script>

</body>
</html>
