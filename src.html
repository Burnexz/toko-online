<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Toko - SRC Zokent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

  <!-- HEADER TOKO DENGAN TOMBOL KEMBALI -->
  <header class="bg-red-600 text-white py-4 px-6 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <!-- TOMBOL KEMBALI KE HALAMAN SEBELUMNYA -->
      <button onclick="window.history.back()" class="bg-red-700 hover:bg-red-800 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition-all border border-red-500">
        ← Kembali
      </button>
      <div>
        <h1 class="text-lg md:text-xl font-bold">🛒 SRC Zokent</h1>
        <p class="text-[10px] md:text-xs text-red-100">Katalog Produk Online</p>
      </div>
    </div>
    <a href="checkout.html" class="bg-white text-red-600 font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm hover:bg-red-50 transition-all">
      🛍️ Keranjang / Checkout
    </a>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">
    
    <!-- JUDUL KATALOG & REFRESH -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-slate-900">📦 Katalog Produk</h2>
      <button onclick="loadKatalogProduk()" class="text-xs text-red-600 font-semibold hover:underline">🔄 Refresh</button>
    </div>

    <!-- FILTER KATEGORI -->
    <div class="mb-6 flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="container-kategori">
      <button onclick="filterKategori('semua', this)" class="btn-kategori bg-red-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm">
        Semua
      </button>
      <button onclick="filterKategori('Makanan', this)" class="btn-kategori bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-slate-50">
        🍔 Makanan
      </button>
      <button onclick="filterKategori('Minuman', this)" class="btn-kategori bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-slate-50">
        🥤 Minuman
      </button>
      <button onclick="filterKategori('Sembako', this)" class="btn-kategori bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-slate-50">
        🌾 Sembako
      </button>
      <button onclick="filterKategori('Kebutuhan Rumah', this)" class="btn-kategori bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-slate-50">
        🏠 Kebutuhan Rumah
      </button>
    </div>

    <!-- CONTAINER GRID PRODUK -->
    <div id="grid-produk" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-12 text-slate-400">
        Memuat produk...
      </div>
    </div>
  </main>

  <!-- SKRIP LOGIKA SUPABASE -->
  <script>
    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let semuaProduk = [];

    // 1. AMBIL PRODUK DARI SUPABASE
    async function loadKatalogProduk() {
      const container = document.getElementById('grid-produk');

      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error:', error);
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-semibold">❌ Gagal memuat produk database.</div>`;
        return;
      }

      semuaProduk = products || [];
      tampilkanProduk(semuaProduk);
    }

    // 2. TAMPILKAN KARTU PRODUK
    function tampilkanProduk(daftarProduk) {
      const container = document.getElementById('grid-produk');

      if (!daftarProduk || daftarProduk.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Tidak ada produk dalam kategori ini.</div>`;
        return;
      }

      container.innerHTML = daftarProduk.map(item => `
        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
          <div>
            <div class="w-full h-36 bg-slate-100 rounded-xl mb-3 overflow-hidden flex items-center justify-center">
              ${item.image_url 
                ? `<img src="${item.image_url}" class="w-full h-full object-cover">` 
                : `<span class="text-4xl">📦</span>`}
            </div>
            
            ${item.category ? `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold uppercase tracking-wider">${item.category}</span>` : ''}
            
            <h3 class="font-bold text-sm text-slate-800 mt-1 line-clamp-2">${item.name}</h3>
            <p class="text-xs text-slate-400 mt-1">${item.description || 'Tidak ada deskripsi'}</p>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
            <div>
              <span class="text-[10px] text-slate-400 block">Harga</span>
              <span class="text-sm font-extrabold text-red-600">
                Rp ${Number(item.selling_price || 0).toLocaleString('id-ID')}
              </span>
            </div>
            <button onclick="tambahKeKeranjang('${item.name}', ${item.selling_price})" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition-all">
              + Beli
            </button>
          </div>
        </div>
      `).join('');
    }

    // 3. FILTER KATEGORI
    function filterKategori(kategori, el) {
      document.querySelectorAll('.btn-kategori').forEach(btn => {
        btn.className = "btn-kategori bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-slate-50";
      });
      el.className = "btn-kategori bg-red-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm";

      if (kategori === 'semua') {
        tampilkanProduk(semuaProduk);
      } else {
        const hasilFilter = semuaProduk.filter(item => item.category && item.category.toLowerCase() === kategori.toLowerCase());
        tampilkanProduk(hasilFilter);
      }
    }

    function tambahKeKeranjang(nama, harga) {
      alert(`Berhasil menambahkan ${nama} ke keranjang!`);
    }

    loadKatalogProduk();
  </script>

</body>
</html>
