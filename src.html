<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Toko - SRC Zokent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

  <!-- HEADER TOKO DENGAN TOMBOL KEMBALI & KERANJANG -->
  <header class="bg-red-600 text-white py-4 px-6 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <!-- TOMBOL KEMBALI KE HALAMAN SEBELUMNYA -->
      <button onclick="window.history.back()" class="bg-red-700 hover:bg-red-800 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition-all border border-red-500">
        ← Kembali
      </button>
      <div>
        <h1 class="text-lg md:text-xl font-bold">🛒 SRC Zokent</h1>
        <p class="text-[10px] md:text-xs text-red-100">Katalog Produk Online</p>
      </div>
    </div>
    
    <!-- TOMBOL CHECKOUT / KERANJANG -->
    <a href="checkout.html" id="btn-keranjang" class="bg-white text-red-600 font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm hover:bg-red-50 transition-all flex items-center gap-1">
      🛍️ Keranjang (0)
    </a>
  </header>

  <!-- KONTEN KATALOG PRODUK -->
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    
    <!-- NAVIGASI KATEGORI -->
    <section class="mb-6">
      <div id="kategori-list" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
        <button onclick="filterKategori('Semua')" class="btn-kategori active bg-red-600 text-white px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm">
          Semua Produk
        </button>
        <button onclick="filterKategori('Makanan')" class="btn-kategori bg-white text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm border border-slate-200">
          🍔 Makanan
        </button>
        <button onclick="filterKategori('Minuman')" class="btn-kategori bg-white text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm border border-slate-200">
          🥤 Minuman
        </button>
        <button onclick="filterKategori('Sembako')" class="btn-kategori bg-white text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm border border-slate-200">
          🌾 Sembako
        </button>
        <button onclick="filterKategori('Kebutuhan Rumah')" class="btn-kategori bg-white text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm border border-slate-200">
          🏠 Kebutuhan Rumah
        </button>
      </div>
    </section>

    <!-- GRID PRODUK -->
    <section id="produk-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
      <div class="col-span-full text-center py-10 text-slate-400">
        Memuat produk...
      </div>
    </section>

  </main>

  <!-- LOGIKA INTERAKSI & SUPABASE -->
  <script>
    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let semuaProduk = [];

    // 1. FUNGSI AMBIL DATA DARI SUPABASE
    async function loadProduk() {
      const grid = document.getElementById('produk-grid');
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Gagal mengambil data:", error);
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">Gagal memuat produk: ${error.message}</div>`;
        return;
      }

      semuaProduk = products || [];
      tampilkanProduk(semuaProduk);
      updateBadgeKeranjang();
    }

    // 2. FUNGSI TAMPILKAN PRODUK KE GRID
    function tampilkanProduk(daftarProduk) {
      const grid = document.getElementById('produk-grid');

      if (!daftarProduk || daftarProduk.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">Belum ada produk di kategori ini.</div>`;
        return;
      }

      grid.innerHTML = daftarProduk.map(item => `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition-all">
          <div class="relative">
            ${item.image_url ? 
              `<img src="${item.image_url}" class="w-full h-36 object-cover bg-slate-50" alt="${item.name}">` : 
              `<div class="w-full h-36 bg-slate-100 flex items-center justify-center text-3xl">📦</div>`
            }
            <span class="absolute top-2 left-2 bg-slate-900/70 backdrop-blur-md text-white text-[10px] font-semibold px-2 py-0.5 rounded-full">
              ${item.category || 'Umum'}
            </span>
          </div>

          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-slate-800 text-xs md:text-sm line-clamp-2 leading-tight">${item.name}</h3>
              <p class="text-[11px] text-slate-500 mt-1 line-clamp-1">${item.description || ''}</p>
            </div>
            
            <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
              <div>
                <p class="text-[10px] text-slate-400">Harga</p>
                <p class="font-extrabold text-red-600 text-xs md:text-sm">Rp ${Number(item.selling_price || 0).toLocaleString('id-ID')}</p>
              </div>

              <button onclick="tambahKeKeranjang('${item.id}', '${item.name.replace(/'/g, "\\'")}', ${item.selling_price}, '${item.image_url || ''}')" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg shadow-sm active:scale-95 transition-all flex items-center gap-1">
                + Beli
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 3. FUNGSI FILTER KATEGORI
    function filterKategori(kategori) {
      const buttons = document.querySelectorAll('.btn-kategori');
      buttons.forEach(btn => {
        if (btn.innerText.includes(kategori) || (kategori === 'Semua' && btn.innerText.includes('Semua'))) {
          btn.className = "btn-kategori active bg-red-600 text-white px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm";
        } else {
          btn.className = "btn-kategori bg-white text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm border border-slate-200";
        }
      });

      if (kategori === 'Semua') {
        tampilkanProduk(semuaProduk);
      } else {
        const terfilter = semuaProduk.filter(item => item.category === kategori);
        tampilkanProduk(terfilter);
      }
    }

    // 4. FUNGSI MASUKKAN KE KERANJANG (localStorage)
    function tambahKeKeranjang(id, nama, harga, gambar) {
      let keranjang = JSON.parse(localStorage.getItem('keranjang_zokent')) || [];
      const indexLama = keranjang.findIndex(item => item.id === id);

      if (indexLama !== -1) {
        keranjang[indexLama].jumlah += 1;
      } else {
        keranjang.push({
          id: id,
          nama: nama,
          harga: harga,
          gambar: gambar,
          jumlah: 1
        });
      }

      localStorage.setItem('keranjang_zokent', JSON.stringify(keranjang));
      updateBadgeKeranjang();
      alert(`✅ ${nama} berhasil ditambahkan ke keranjang!`);
    }

    // 5. UPDATE BADGE JUMLAH BARANG DI TOMBOL CHECKOUT
    function updateBadgeKeranjang() {
      const keranjang = JSON.parse(localStorage.getItem('keranjang_zokent')) || [];
      const totalItem = keranjang.reduce((sum, item) => sum + item.jumlah, 0);
      const btnKeranjang = document.getElementById('btn-keranjang');
      if (btnKeranjang) {
        btnKeranjang.innerText = `🛍️ Keranjang (${totalItem})`;
      }
    }

    // Jalankan saat halaman terbuka
    loadProduk();
  </script>

</body>
</html>
