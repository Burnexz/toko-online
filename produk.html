<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produk - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      font-size: 24px;
    }

    button {
      cursor: pointer;
    }

    .add-button {
      border: none;
      background: #111827;
      color: white;
      padding: 12px 16px;
      border-radius: 9px;
      font-weight: bold;
    }

    .form-box {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .form-box.active {
      display: block;
    }

    .form-box h3 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 10px;
    }

    .save-button,
    .cancel-button {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .save-button {
      background: #111827;
      color: white;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #111827;
    }

    .save-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product-card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      background: #e5e7eb;
      margin-bottom: 12px;
    }

    .no-image {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-sku {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .product-description {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-category {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 7px;
    }

    .product-stock {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .product-status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .active {
      background: #dcfce7;
      color: #166534;
    }

    .inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-button {
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .toggle-button {
      background: #e5e7eb;
      color: #111827;
    }

    .delete-button {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 35px;
      color: #6b7280;
      background: white;
      border-radius: 12px;
    }

    @media (min-width: 700px) {
      .product-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ZOKENT STORE</h1>
  <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main class="container">

  <div class="top">
    <h2>Produk</h2>

    <button
      class="add-button"
      onclick="showForm()">
      + Tambah Produk
    </button>
  </div>

  <div
    id="message"
    class="message">
  </div>

  <section
    id="formBox"
    class="form-box">

    <h3>Tambah Produk</h3>

    <form id="productForm">

      <label for="productName">
        Nama Produk
      </label>

      <input
        type="text"
        id="productName"
        required
      >

      <label for="productSku">
        SKU
      </label>

      <input
        type="text"
        id="productSku"
      >

      <label for="productDescription">
        Deskripsi
      </label>

      <textarea
        id="productDescription">
      </textarea>

      <label for="productPrice">
        Harga Jual
      </label>

      <input
        type="number"
        id="productPrice"
        min="0"
        required
      >

      <label for="productStock">
        Stok
      </label>

      <input
        type="number"
        id="productStock"
        min="0"
        value="0"
        required
      >

      <label for="productCategory">
        Kategori
      </label>

      <select
        id="productCategory"
        required>

        <option value="">
          Pilih kategori
        </option>

      </select>

      <label for="productImage">
        URL Foto Produk
      </label>

      <input
        type="url"
        id="productImage"
      >

      <div class="form-actions">

        <button
          type="submit"
          class="save-button"
          id="saveButton">
          Simpan Produk
        </button>

        <button
          type="button"
          class="cancel-button"
          onclick="hideForm()">
          Batal
        </button>

      </div>

    </form>

  </section>

  <section id="productList">

    <div class="loading">
      Memuat produk...
    </div>

  </section>

</main>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://weuousmvkxmgmsnwiuad.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // FORM
  // ==========================================

  async function showForm() {

    document
      .getElementById("formBox")
      .classList.add("active");

    await loadCategories();

    document
      .getElementById("productName")
      .focus();

  }


  function hideForm() {

    document
      .getElementById("formBox")
      .classList.remove("active");

    document
      .getElementById("productForm")
      .reset();

  }


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(
    text,
    success = false
  ) {

    const element =
      document.getElementById(
        "message"
      );

    element.textContent = text;

    element.style.color =
      success ? "green" : "red";

  }


  // ==========================================
  // KATEGORI
  // ==========================================

  async function loadCategories() {

    const select =
      document.getElementById(
        "productCategory"
      );

    select.innerHTML =
      '<option value="">Memuat kategori...</option>';


    const { data, error } =
      await supabaseClient
        .from("categories")
        .select("id, name")
        .order("name", {
          ascending: true
        });


    if (error) {

      console.error(error);

      select.innerHTML =
        '<option value="">Gagal memuat kategori</option>';

      showMessage(
        "Kategori gagal dimuat."
      );

      return;

    }


    select.innerHTML =
      '<option value="">Pilih kategori</option>';


    if (!data || data.length === 0) {

      select.innerHTML =
        '<option value="">Belum ada kategori</option>';

      return;

    }


    data.forEach(category => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category.id;

      option.textContent =
        category.name;

      select.appendChild(
        option
      );

    });

  }


  // ==========================================
  // TAMBAH PRODUK
  // ==========================================

  document
    .getElementById("productForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const name =
          document
            .getElementById(
              "productName"
            )
            .value
            .trim();


        const sku =
          document
            .getElementById(
              "productSku"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "productDescription"
            )
            .value
            .trim();


        const sellingPrice =
          Number(
            document
              .getElementById(
                "productPrice"
              )
              .value
          );


        const stockQuantity =
          Number(
            document
              .getElementById(
                "productStock"
              )
              .value
          );


        const categoryId =
          document
            .getElementById(
              "productCategory"
            )
            .value;


        const imageUrl =
          document
            .getElementById(
              "productImage"
            )
            .value
            .trim();


        if (
          !name ||
          !categoryId ||
          sellingPrice < 0 ||
          stockQuantity < 0
        ) {

          showMessage(
            "Lengkapi data produk."
          );

          return;

        }


        const saveButton =
          document.getElementById(
            "saveButton"
          );


        saveButton.disabled = true;

        saveButton.textContent =
          "Menyimpan...";


        try {

          // ===============================
          // SIMPAN PRODUK
          // ===============================

          const { data: product, error } =
            await supabaseClient
              .from("products")
              .insert({

                name: name,

                sku:
                  sku || null,

                description:
                  description || null,

                selling_price:
                  sellingPrice,

                image_url:
                  imageUrl || null,

                is_active:
                  true,

                show_in_catalog:
                  true,

                show_when_out_of_stock:
                  false,

                stock_quantity:
                  stockQuantity,

                minimum_stock:
                  0,

                allow_negative_stock:
                  false

              })
              .select()
              .single();


          if (error) {
            throw error;
          }


          // ===============================
          // HUBUNGKAN KATEGORI
          // ===============================

          const { error: categoryError } =
            await supabaseClient
              .from("product_categories")
              .insert({

                product_id:
                  product.id,

                category_id:
                  categoryId

              });


          if (categoryError) {

            await supabaseClient
              .from("products")
              .delete()
              .eq(
                "id",
                product.id
              );

            throw categoryError;

          }


          showMessage(
            "Produk berhasil ditambahkan.",
            true
          );


          hideForm();

          await loadProducts();


        } catch (error) {

          console.error(
            "ERROR SIMPAN PRODUK:",
            error
          );

          showMessage(
            error.message ||
            "Produk gagal disimpan."
          );


        } finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "Simpan Produk";

        }

      }
    );


  // ==========================================
  // LOAD PRODUK
  // ==========================================

  async function loadProducts() {

    const list =
      document.getElementById(
        "productList"
      );


    list.innerHTML =
      '<div class="loading">Memuat produk...</div>';


    const { data, error } =
      await supabaseClient
        .from("products")
        .select(`
          id,
          name,
          sku,
          description,
          selling_price,
          image_url,
          is_active,
          show_in_catalog,
          show_when_out_of_stock,
          stock_quantity,
          product_categories (
            category_id,
            categories (
              id,
              name
            )
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">Gagal memuat produk.</div>';

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML =
        '<div class="empty">Belum ada produk.</div>';

      return;

    }


    list.innerHTML =
      '<div class="product-list"></div>';


    const grid =
      list.querySelector(
        ".product-list"
      );


    data.forEach(product => {

      let categoryName =
        "Tanpa kategori";


      if (
        product.product_categories &&
        product.product_categories.length
      ) {

        const relation =
          product.product_categories[0];


        if (
          relation.categories
        ) {

          categoryName =
            relation.categories.name ||
            "Tanpa kategori";

        }

      }


      const imageHtml =
        product.image_url

          ? `
            <img
              class="product-image"
              src="${escapeHtml(
                product.image_url
              )}"
              alt="${escapeHtml(
                product.name
              )}"
            >
          `

          : `
            <div class="no-image">
              Tidak ada foto
            </div>
          `;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product-card";


      card.innerHTML = `

        ${imageHtml}

        <div class="product-name">
          ${escapeHtml(
            product.name
          )}
        </div>

        ${
          product.sku
            ? `
              <div class="product-sku">
                SKU: ${escapeHtml(
                  product.sku
                )}
              </div>
            `
            : ""
        }

        ${
          product.description
            ? `
              <div class="product-description">
                ${escapeHtml(
                  product.description
                )}
              </div>
            `
            : ""
        }

        <div class="product-price">
          Rp ${formatRupiah(
            product.selling_price
          )}
        </div>

        <div class="product-category">
          Kategori:
          ${escapeHtml(
            categoryName
          )}
        </div>

        <div class="product-stock">
          Stok:
          ${product.stock_quantity ?? 0}
        </div>

        <span
          class="product-status ${
            product.is_active
              ? "active"
              : "inactive"
          }">

          ${
            product.is_active
              ? "Aktif"
              : "Nonaktif"
          }

        </span>

        <div class="actions">

          <button
            class="action-button toggle-button"
            onclick="toggleProduct(
              '${product.id}',
              ${product.is_active}
            )">

            ${
              product.is_active
                ? "Nonaktifkan"
                : "Aktifkan"
            }

          </button>

          <button
            class="action-button delete-button"
            onclick="deleteProduct(
              '${product.id}'
            )">

            Hapus

          </button>

        </div>

      `;


      grid.appendChild(
        card
      );

    });

  }


  // ==========================================
  // AKTIF / NONAKTIF
  // ==========================================

  async function toggleProduct(
    productId,
    currentStatus
  ) {

    const { error } =
      await supabaseClient
        .from("products")
        .update({

          is_active:
            !currentStatus

        })
        .eq(
          "id",
          productId
        );


    if (error) {

      console.error(error);

      showMessage(
        "Gagal mengubah status produk."
      );

      return;

    }


    showMessage(
      !currentStatus
        ? "Produk diaktifkan."
        : "Produk dinonaktifkan.",
      true
    );


    await loadProducts();

  }


  // ==========================================
  // HAPUS PRODUK
  // ==========================================

  async function deleteProduct(
    productId
  ) {

    const yakin =
      confirm(
        "Yakin ingin menghapus produk ini?"
      );


    if (!yakin) {
      return;
    }


    const { error: relationError } =
      await supabaseClient
        .from("product_categories")
        .delete()
        .eq(
          "product_id",
          productId
        );


    if (relationError) {

      console.error(
        relationError
      );

      showMessage(
        "Gagal menghapus kategori produk."
      );

      return;

    }


    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          productId
        );


    if (error) {

      console.error(error);

      showMessage(
        "Produk gagal dihapus."
      );

      return;

    }


    showMessage(
      "Produk berhasil dihapus.",
      true
    );


    await loadProducts();

  }


  // ==========================================
  // FORMAT RUPIAH
  // ==========================================

  function formatRupiah(
    value
  ) {

    return new Intl.NumberFormat(
      "id-ID"
    ).format(
      Number(value) || 0
    );

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(
    value
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  // ==========================================
  // MULAI
  // ==========================================

  loadProducts();

</script>

</body>
</html>
