<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelola Produk - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 13px;
      background: #374151;
      padding: 9px 12px;
      border-radius: 8px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .title {
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .title p {
      font-size: 13px;
      color: #6b7280;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .checkbox-area {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: normal;
    }

    .check:last-child {
      margin-bottom: 0;
    }

    .check input {
      width: auto;
    }

    .button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .product-list {
      margin-top: 10px;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .product-item:last-child {
      border-bottom: none;
    }

    .product-name {
      font-size: 14px;
      font-weight: bold;
    }

    .product-info {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    .product-price {
      font-size: 13px;
      font-weight: bold;
      color: #dc2626;
      white-space: nowrap;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    @media (min-width: 650px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div class="loading" id="loading">
    Memeriksa login...
  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="header-inner">

      <div>
        <div class="brand">
          ZOKENT STORE
        </div>

        <div class="subtitle">
          KELOLA PRODUK
        </div>
      </div>

      <a href="dashboard.html" class="back">
        ← Dashboard
      </a>

    </div>

  </header>


  <main class="container">


    <!-- JUDUL -->

    <section class="title">

      <h1>
        Produk
      </h1>

      <p>
        Tambahkan produk baru yang nantinya dapat ditampilkan di toko online.
      </p>

    </section>


    <!-- PESAN -->

    <div id="message" class="message"></div>


    <!-- FORM -->

    <section class="card">

      <h2>
        ➕ Tambah Produk
      </h2>


      <form id="productForm">


        <!-- NAMA + SKU -->

        <div class="grid">

          <div class="form-group">

            <label>
              Nama Produk *
            </label>

            <input
              type="text"
              id="name"
              placeholder="Contoh: Beras Premium 5 Kg"
              required
            >

          </div>


          <div class="form-group">

            <label>
              SKU
            </label>

            <input
              type="text"
              id="sku"
              placeholder="Contoh: BRSP5"
            >

          </div>

        </div>


        <!-- KATEGORI + NAMA KATALOG -->

        <div class="grid">

          <div class="form-group">

            <label>
              Kategori *
            </label>

            <select id="category" required>

              <option value="">
                Memuat kategori...
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Nama di Katalog
            </label>

            <input
              type="text"
              id="catalog_name"
              placeholder="Kosongkan jika sama dengan nama produk"
            >

          </div>

        </div>


        <!-- DESKRIPSI -->

        <div class="form-group">

          <label>
            Deskripsi
          </label>

          <textarea
            id="description"
            placeholder="Keterangan produk..."
          ></textarea>

        </div>


        <!-- HARGA -->

        <div class="grid">

          <div class="form-group">

            <label>
              Harga Jual *
            </label>

            <input
              type="number"
              id="selling_price"
              placeholder="Contoh: 72000"
              min="0"
              required
            >

          </div>


          <div class="form-group">

            <label>
              URL Gambar
            </label>

            <input
              type="url"
              id="image_url"
              placeholder="https://..."
            >

          </div>

        </div>


        <!-- STOK -->

        <div class="grid">

          <div class="form-group">

            <label>
              Stok Awal
            </label>

            <input
              type="number"
              id="stock_quantity"
              value="0"
              min="0"
            >

          </div>


          <div class="form-group">

            <label>
              Minimum Stok
            </label>

            <input
              type="number"
              id="minimum_stock"
              value="5"
              min="0"
            >

          </div>

        </div>


        <!-- PENGATURAN -->

        <div class="checkbox-area">

          <label class="check">

            <input
              type="checkbox"
              id="is_active"
              checked
            >

            Produk aktif

          </label>


          <label class="check">

            <input
              type="checkbox"
              id="show_in_catalog"
              checked
            >

            Tampilkan di katalog pelanggan

          </label>


          <label class="check">

            <input
              type="checkbox"
              id="show_when_out_of_stock"
            >

            Tetap tampilkan jika stok habis

          </label>


          <label class="check">

            <input
              type="checkbox"
              id="allow_negative_stock"
            >

            Izinkan stok minus

          </label>

        </div>


        <br>


        <button
          type="submit"
          class="button"
          id="saveButton"
        >
          💾 Simpan Produk
        </button>


      </form>

    </section>


    <!-- PRODUK TERBARU -->

    <section class="card">

      <h2>
        📦 Produk Terbaru
      </h2>

      <div
        id="productList"
        class="product-list"
      >
        Memuat produk...
      </div>

    </section>


  </main>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://weuousmvkxmgmsnwiuad.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // ELEMENT
    // ==========================================

    const loading =
      document.getElementById("loading");

    const form =
      document.getElementById("productForm");

    const message =
      document.getElementById("message");

    const saveButton =
      document.getElementById("saveButton");

    const categorySelect =
      document.getElementById("category");

    const productList =
      document.getElementById("productList");


    // ==========================================
    // PESAN
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // ==========================================
    // CEK LOGIN PEMILIK
    // ==========================================

    async function checkLogin() {

      const {
        data: { user },
        error
      } =
        await supabaseClient.auth.getUser();


      if (error || !user) {

        window.location.href =
          "login-admin.html";

        return false;

      }


      // Cek profile

      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select("full_name, role, is_active")
          .eq("id", user.id)
          .single();


      if (
        profileError ||
        !profile ||
        profile.role !== "owner" ||
        profile.is_active !== true
      ) {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login-admin.html";

        return false;

      }


      return true;

    }


    // ==========================================
    // AMBIL KATEGORI
    // ==========================================

    async function loadCategories() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("categories")
          .select("id, name")
          .order("name", {
            ascending: true
          });


      if (error) {

        console.error(error);

        categorySelect.innerHTML = `
          <option value="">
            Gagal memuat kategori
          </option>
        `;

        return;

      }


      categorySelect.innerHTML = `
        <option value="">
          Pilih kategori
        </option>
      `;


      (data || []).forEach(category => {

        const option =
          document.createElement("option");

        option.value =
          category.id;

        option.textContent =
          category.name;

        categorySelect.appendChild(option);

      });

    }


    // ==========================================
    // SIMPAN PRODUK
    // ==========================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        saveButton.disabled = true;

        saveButton.textContent =
          "⏳ Menyimpan...";


        try {

          const categoryId =
            categorySelect.value;

          const name =
            document.getElementById("name").value.trim();

          const sku =
            document.getElementById("sku").value.trim();

          const catalogNameInput =
            document.getElementById("catalog_name").value.trim();

          const description =
            document.getElementById("description").value.trim();

          const sellingPrice =
            Number(
              document.getElementById("selling_price").value
            );

          const imageUrl =
            document.getElementById("image_url").value.trim();

          const stockQuantity =
            Number(
              document.getElementById("stock_quantity").value
            );

          const minimumStock =
            Number(
              document.getElementById("minimum_stock").value
            );


          if (!name) {

            throw new Error(
              "Nama produk wajib diisi."
            );

          }


          if (!categoryId) {

            throw new Error(
              "Silakan pilih kategori."
            );

          }


          if (!sellingPrice || sellingPrice < 0) {

            throw new Error(
              "Harga jual tidak valid."
            );

          }


          // ======================================
          // AMBIL NAMA KATEGORI
          // ======================================

          const {
            data: category,
            error: categoryError
          } =
            await supabaseClient
              .from("categories")
              .select("name")
              .eq("id", categoryId)
              .single();


          if (categoryError) {

            throw categoryError;

          }


          // ======================================
          // DATA PRODUK
          // ======================================

          const productData = {

            name: name,

            catalog_name:
              catalogNameInput || name,

            sku:
              sku || null,

            description:
              description || null,

            selling_price:
              sellingPrice,

            image_url:
              imageUrl || null,

            is_active:
              document.getElementById("is_active").checked,

            show_in_catalog:
              document.getElementById("show_in_catalog").checked,

            show_when_out_of_stock:
              document.getElementById("show_when_out_of_stock").checked,

            stock_quantity:
              stockQuantity,

            minimum_stock:
              minimumStock,

            allow_negative_stock:
              document.getElementById("allow_negative_stock").checked

          };


          // ======================================
          // SIMPAN PRODUCTS
          // ======================================

          const {
            data: product,
            error: productError
          } =
            await supabaseClient
              .from("products")
              .insert(productData)
              .select()
              .single();


          if (productError) {

            throw productError;

          }


          // ======================================
          // HUBUNGKAN KE KATEGORI
          // ======================================

          const {
            error: relationError
          } =
            await supabaseClient
              .from("product_categories")
              .insert({

                product_id:
                  product.id,

                category_id:
                  categoryId

              });


          if (relationError) {

            // Produk sudah tersimpan,
            // tetapi relasi kategori gagal.

            console.error(
              "Kategori gagal dihubungkan:",
              relationError
            );

            showMessage(
              "Produk berhasil disimpan, tetapi kategori belum terhubung: " +
              relationError.message,
              "error"
            );

          } else {

            showMessage(
              "✅ Produk berhasil ditambahkan dan akan dapat ditampilkan di katalog.",
              "success"
            );

          }


          // ======================================
          // RESET FORM
          // ======================================

          form.reset();


          document.getElementById(
            "is_active"
          ).checked = true;


          document.getElementById(
            "show_in_catalog"
          ).checked = true;


          document.getElementById(
            "stock_quantity"
          ).value = 0;


          document.getElementById(
            "minimum_stock"
          ).value = 5;


          // Refresh daftar

          loadProducts();

        }

        catch (error) {

          console.error(error);

          showMessage(
            "❌ Gagal menyimpan produk: " +
            error.message,
            "error"
          );

        }

        finally {

          saveButton.disabled = false;

          saveButton.textContent =
            "💾 Simpan Produk";

        }

      }
    );


    // ==========================================
    // LOAD PRODUK
    // ==========================================

    async function loadProducts() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select(
            "id, name, sku, selling_price, stock_quantity, is_active"
          )
          .order("created_at", {
            ascending: false
          })
          .limit(20);


      if (error) {

        productList.innerHTML = `
          <div style="color:#dc2626;font-size:13px;">
            Gagal memuat produk: ${escapeHtml(error.message)}
          </div>
        `;

        return;

      }


      if (!data || data.length === 0) {

        productList.innerHTML = `
          <div style="color:#6b7280;font-size:13px;">
            Belum ada produk.
          </div>
        `;

        return;

      }


      productList.innerHTML =
        data.map(product => {

          return `

            <div class="product-item">

              <div>

                <div class="product-name">
                  ${escapeHtml(product.name)}
                </div>

                <div class="product-info">
                  SKU: ${escapeHtml(product.sku || "-")}
                  · Stok: ${product.stock_quantity ?? 0}
                  · ${product.is_active ? "Aktif" : "Nonaktif"}
                </div>

              </div>

              <div class="product-price">
                Rp ${formatRupiah(product.selling_price)}
              </div>

            </div>

          `;

        }).join("");

    }


    // ==========================================
    // FORMAT RUPIAH
    // ==========================================

    function formatRupiah(number) {

      return Number(number || 0)
        .toLocaleString("id-ID");

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text ?? "";

      return div.innerHTML;

    }


    // =======================================
