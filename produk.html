<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelola Produk - Zokent Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top h2 {
      font-size: 24px;
    }

    .add-button {
      border: none;
      background: #111827;
      color: white;
      padding: 12px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-box {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .form-box.active {
      display: block;
    }

    .form-box h3 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 15px;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .save-button,
    .cancel-button {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-button {
      background: #111827;
      color: white;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #111827;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      background: #e5e7eb;
      margin-bottom: 12px;
    }

    .no-image {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-info {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .product-status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin: 8px 0 12px;
    }

    .active {
      background: #dcfce7;
      color: #166534;
    }

    .inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-button {
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .toggle-button {
      background: #e5e7eb;
      color: #111827;
    }

    .delete-button {
      background: #fee2e2;
      color: #991b1b;
    }

    .message {
      margin-bottom: 15px;
      min-height: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      background: white;
      border-radius: 12px;
    }

    @media (min-width: 700px) {
      .product-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ZOKENT STORE</h1>

  <a
    class="back"
    href="dashboard.html"
  >
    ← Dashboard
  </a>
</header>


<main class="container">

  <div class="top">

    <h2>Produk</h2>

    <button
      class="add-button"
      onclick="showForm()"
    >
      + Tambah Produk
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <!-- =========================
       FORM PRODUK
  ========================== -->

  <section
    id="formBox"
    class="form-box"
  >

    <h3>Tambah Produk</h3>

    <form id="productForm">

      <label for="productName">
        Nama Produk
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Contoh: Aqua 600ml"
        required
      >


      <label for="productSku">
        SKU / Kode Produk
      </label>

      <input
        type="text"
        id="productSku"
        placeholder="Contoh: AQUA600"
      >


      <label for="productDescription">
        Deskripsi
      </label>

      <textarea
        id="productDescription"
        placeholder="Deskripsi produk..."
      ></textarea>


      <label for="productPrice">
        Harga Jual
      </label>

      <input
        type="number"
        id="productPrice"
        placeholder="Contoh: 5000"
        min="0"
        required
      >


      <label for="productCategory">
        Kategori
      </label>

      <select
        id="productCategory"
        required
      >
        <option value="">
          Pilih kategori
        </option>
      </select>


      <label for="productImage">
        URL Foto Produk
      </label>

      <input
        type="url"
        id="productImage"
        placeholder="https://..."
      >


      <label for="productStock">
        Jumlah Stok
      </label>

      <input
        type="number"
        id="productStock"
        placeholder="Contoh: 20"
        min="0"
        value="0"
      >


      <div class="checkbox-row">

        <input
          type="checkbox"
          id="showInCatalog"
          checked
        >

        <label
          for="showInCatalog"
          style="margin:0;"
        >
          Tampilkan di katalog pelanggan
        </label>

      </div>


      <div class="checkbox-row">

        <input
          type="checkbox"
          id="showWhenOutOfStock"
        >

        <label
          for="showWhenOutOfStock"
          style="margin:0;"
        >
          Tetap tampilkan jika stok habis
        </label>

      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="save-button"
          id="saveButton"
        >
          Simpan Produk
        </button>

        <button
          type="button"
          class="cancel-button"
          onclick="hideForm()"
        >
          Batal
        </button>

      </div>

    </form>

  </section>


  <!-- =========================
       DAFTAR PRODUK
  ========================== -->

  <section id="productList">

    <div class="loading">
      Memuat produk...
    </div>

  </section>

</main>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://weuousmvkxmgmsnwiuad.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // CEK OWNER
  // ==========================================

  async function checkOwner() {

    const {
      data: { user }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      window.location.href =
        "admin.html";

      return false;
    }


    const {
      data: profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "role, is_active"
        )
        .eq(
          "id",
          user.id
        )
        .single();


    if (
      error ||
      !profile ||
      profile.role !== "owner" ||
      profile.is_active !== true
    ) {

      await supabaseClient
        .auth
        .signOut();

      window.location.href =
        "admin.html";

      return false;
    }


    return true;
  }


  // ==========================================
  // TAMPILKAN FORM
  // ==========================================

  async function showForm() {

    document
      .getElementById("formBox")
      .classList
      .add("active");


    await loadCategories();


    document
      .getElementById("productName")
      .focus();

  }


  // ==========================================
  // SEMBUNYIKAN FORM
  // ==========================================

  function hideForm() {

    document
      .getElementById("formBox")
      .classList
      .remove("active");


    document
      .getElementById("productForm")
      .reset();


    document
      .getElementById("showInCatalog")
      .checked = true;


    document
      .getElementById("productStock")
      .value = 0;

  }


  // ==========================================
  // PESAN
  // ==========================================

  function showMessage(
    text,
    success = false
  ) {

    const element =
      document.getElementById(
        "message"
      );


    element.textContent =
      text;


    element.style.color =
      success
        ? "green"
        : "red";

  }


  // ==========================================
  // LOAD KATEGORI
  // ==========================================

  async function loadCategories() {

    const select =
      document.getElementById(
        "productCategory"
      );


    select.innerHTML =
      `<option value="">
        Memuat kategori...
      </option>`;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("categories")
        .select(
          "id, name"
        )
        .order(
          "name",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        error
      );


      select.innerHTML =
        `<option value="">
          Gagal memuat kategori
        </option>`;


      return;
    }


    select.innerHTML =
      `<option value="">
        Pilih kategori
      </option>`;


    if (
      !data ||
      data.length === 0
    ) {

      select.innerHTML =
        `<option value="">
          Belum ada kategori
        </option>`;


      return;
    }


    data.forEach(
      category => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          category.id;


        option.textContent =
          category.name;


        select.appendChild(
          option
        );

      }
    );

  }


  // ==========================================
  // SIMPAN PRODUK
  // ==========================================

  document
    .getElementById(
      "productForm"
    )
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const name =
          document
            .getElementById(
              "productName"
            )
            .value
            .trim();


        const sku =
          document
            .getElementById(
              "productSku"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "productDescription"
            )
            .value
            .trim();


        const sellingPrice =
          Number(
            document
              .getElementById(
                "productPrice"
              )
              .value
          );


        const categoryId =
          document
            .getElementById(
              "productCategory"
            )
            .value;


        const imageUrl =
          document
            .getElementById(
              "productImage"
            )
            .value
            .trim();


        const stockQuantity =
          Number(
            document
              .getElementById(
                "productStock"
              )
              .value
          );


        const showInCatalog =
          document
            .getElementById(
              "showInCatalog"
            )
            .checked;


        const showWhenOutOfStock =
          document
            .getElementById(
              "showWhenOutOfStock"
            )
            .checked;


        // Validasi

        if (
          !name ||
          !categoryId ||
          sellingPrice < 0 ||
          stockQuantity < 0
        ) {

          showMessage(
            "Lengkapi data produk."
          );

          return;
        }


        const saveButton =
          document.getElementById(
            "saveButton"
          );


        saveButton.disabled =
          true;


        saveButton.textContent =
          "Menyimpan...";


        try {

          // ==============================
          // SIMPAN PRODUK
          // ==============================

          const {
            data: product,
            error: productError
          } =
            await supabaseClient
              .from("products")
              .insert({

                name:
                  name,

                catalog_name:
                  name,

                sku:
                  sku || null,

                description:
                  description || null,

                selling_price:
                  sellingPrice,

                image_url:
                  imageUrl || null,

                is_active:
                  true,

                show_in_catalog:
                  showInCatalog,

                show_when_out_of_stock:
                  showWhenOutOfStock,

                stock_quantity:
                  stockQuantity,

                minimum_stock:
                  0,

                allow_negative_stock:
                  false

              })
              .select()
              .single();


          if (
            productError
          ) {

            throw productError;

          }


          // ==============================
          // HUBUNGKAN KATEGORI
          // ==============================

          const {
            error: categoryError
          } =
            await supabaseClient
              .from(
                "product_categories"
              )
              .insert({

                product_id:
                  product.id,

                category_id:
                  categoryId

              });


          if (
            categoryError
          ) {

            await supabaseClient
              .from("products")
              .delete()
              .eq(
                "id",
                product.id
              );


            throw categoryError;

          }


          showMessage(
            "Produk berhasil ditambahkan.",
            true
          );


          hideForm();


          await loadProducts();


        } catch (error) {

          console.error(
            error
          );


          showMessage(
            error.message ||
            "Produk gagal ditambahkan."
          );


        } finally {

          saveButton.disabled =
            false;


          saveButton.textContent =
            "Simpan Produk";

        }

      }
    );


  // ==========================================
  // LOAD PRODUK
  // ==========================================

  async function loadProducts() {

    const list =
      document.getElementById(
        "productList"
      );


    list.innerHTML =
      `<div class="loading">
        Memuat produk...
      </div>`;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select(`
          id,
          name,
          sku,
          description,
          selling_price,
          image_url,
          is_active,
          show_in_catalog,
          stock_quantity,
          product_categories (
            categories (
              id,
              name
            )
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        error
      );


      list.innerHTML =
        `<div class="empty">
          Gagal memuat produk.
        </div>`;


      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML =
        `<div class="empty">
          Belum ada produk.
        </div>`;


      return;
    }


    list.innerHTML =
      `<div class="product-list"></div>`;


    const grid =
      list.querySelector(
        ".product-list"
      );


    data.forEach(
      product => {

        let categoryName =
          "Tanpa kategori";


        if (
          product
            .product_categories &&
          product
            .product_categories
            .length > 0
        ) {

          const relation =
            product
              .product_categories[0];


          if (
            relation.categories &&
            relation.categories.name
          ) {

            categoryName =
              relation.categories.name;

          }

        }


        let image;


        if (
          product.image_url
        ) {

          image =
            `<img
              class="product-image"
              src="${escapeHtml(
                product.image_url
              )}"
              alt="${escapeHtml(
                product.name
              )}"
            >`;

        } else {

          image =
            `<div class="no-image">
              Tidak ada foto
            </div>`;

        }


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "product-card";


        card.innerHTML = `

          ${image}

          <div class="product-name">
            ${escapeHtml(
              product.name
            )}
          </div>

          <div class="product-price">
            Rp ${formatRupiah(
              product.selling_price
            )}
          </div>

          <div class="product-info">
            SKU:
            ${escapeHtml(
              product.sku || "-"
            )}
          </div>

          <div class="product-info">
            Kategori:
            ${escapeHtml(
              categoryName
            )}
          </div>

          <div class="product-info">
            Stok:
            ${product.stock_quantity}
          </div>

          <span class="product-status ${
            product.is_active
              ? "active"
              : "inactive"
          }">

            ${
              product.is_active
                ? "Aktif"
                : "Nonaktif"
            }

          </span>


          <div class="actions">

            <button
              class="action-button toggle-button"
              onclick="toggleProduct(
                '${product.id}',
                ${product.is_active}
              )"
            >

              ${
                product.is_active
                  ? "Nonaktifkan"
                  : "Aktifkan"
              }

            </button>


            <button
              class="action-button delete-button"
              onclick="deleteProduct(
                '${product.id}'
              )"
            >
              Hapus
            </button>

          </div>

        `;


        grid.appendChild(
          card
        );

      }
    );

  }


  // ==========================================
  // AKTIF / NONAKTIF
  // ==========================================

  async function toggleProduct(
    productId,
    currentStatus
  ) {

    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({
          is_active:
            !currentStatus
        })
        .eq(
          "id",
          productId
        );


    if (error) {

      console.error(
        error
      );


      showMessage(
        "Gagal mengubah status produk."
      );


      return;
    }


    showMessage(
      !currentStatus
        ? "Produk diaktifkan."
        : "Produk dinonaktifkan.",
      true
    );


    await loadProducts();

  }


  // ==========================================
  // HAPUS PRODUK
  // ==========================================

  async function deleteProduct(
    productId
  ) {

    const yakin =
      confirm(
        "Yakin ingin menghapus produk ini?"
      );


    if (!yakin) {
      return;
    }


    // Hapus hubungan kategori

    const {
      error: relationError
    } =
      await supabaseClient
        .from(
          "product_categories"
        )
        .delete()
        .eq(
          "product_id",
          productId
        );


    if (
      relationError
    ) {

      console.error(
        relationError
      );


      showMessage(
        "Gagal menghapus kategori produk."
      );


      return;
    }


    // Hapus produk

    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          productId
        );


    if (error) {

      console.error(
        error
      );


      showMessage(
        "Produk gagal dihapus."
      );


      return;
    }


    showMessage(
      "Produk berhasil dihapus.",
      true
    );


    await loadProducts();

  }


  // ==========================================
  // FORMAT RUPIAH
  // ==========================================

  function formatRupiah(
    value
  ) {

    return new Intl.NumberFormat(
      "id-ID"
    ).format(
      value || 0
    );

  }


  // ==========================================
  // KEAMANAN HTML
  // ==========================================

  function escapeHtml(
    value
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      value ?? "";


    return div.innerHTML;

  }


  // ==========================================
  // JALANKAN
  // ==========================================

  (async function() {

    const isOwner =
      await checkOwner();


    if (isOwner) {

      await loadProducts();

    }

  })();

</script>

</body>
</html>
