<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk - SRC Zokent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- HEADER TOKO -->
  <header class="bg-[#dc2626] text-white py-6 px-4 shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">🏪 SRC Zokent</h1>
        <p class="text-xs text-red-100">Belanja Dekat & Hemat</p>
      </div>
      <a href="index.html" class="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg transition-all">
        ← Kembali ke Beranda
      </a>
    </div>
  </header>

  <!-- KATALOG PRODUK -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    <h2 class="text-lg font-bold text-slate-900 mb-6">Daftar Produk Toko</h2>

    <!-- GRID UNTUK MENAMPILKAN BARANG -->
    <div id="produk-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <p class="col-span-full text-center text-sm text-slate-500 py-10">Memuat produk dari toko...</p>
    </div>
  </main>

  <!-- SKRIP SUPABASE -->
  <script>
    const SUPABASE_URL = "https://weuousmvkxmgmsnwiuad.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e375KDL0vuoahHO_kWMjwA_a04R4yHb";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadKatalog() {
      const container = document.getElementById('produk-grid');

      // Mengambil data barang yang diatur oleh Admin
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p class="col-span-full text-center text-red-500 text-sm py-10">Gagal memuat data toko: ${error.message}</p>`;
        return;
      }

      if (!products || products.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-slate-500 text-sm py-10">Belum ada produk di toko ini.</p>`;
        return;
      }

      // Menampilkan daftar barang ke halaman
      container.innerHTML = products.map(item => `
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
          <div class="h-36 bg-slate-100 relative">
            ${item.image_url 
              ? `<img src="${item.image_url}" alt="${item.name}" class="w-full h-full object-cover">` 
              : `<div class="w-full h-full flex items-center justify-center text-3xl text-slate-300">📦</div>`}
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-sm text-slate-800 line-clamp-2">${item.name || item.catalog_name}</h3>
              <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.description || ''}</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
              <span class="text-sm font-extrabold text-red-600">Rp ${Number(item.selling_price || item.price || 0).toLocaleString('id-ID')}</span>
              <a href="checkout.html" class="text-xs bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded-lg transition-all">Beli</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    loadKatalog();
  </script>
</body>
</html>
